ds from 4 metres away.","Fix a bad slide: take a paragraph-style slide and rebuild it as a headline + image + 3 bullets."],"m":"You instinctively split paragraphs into visual, one-idea slides.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"],["Canva Design School","https://www.canva.com/designschool/"]]},{"n":"Story first: outline before you open the app","h":3,"s":["Write on paper: audience, 3 main messages, opening hook, closing ask — before any design.","Structure: hook → problem → idea → evidence → action. Ten slides max for most talks.","Draft a 10-slide talk on paper for a topic you know, then reveal: you already did the hard part."],"m":"You can plan any presentation outline on one page of paper in 15 minutes.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"]]}]},{"t":"Building the deck","topics":[{"n":"PowerPoint / Slides tour & first deck","h":4,"s":["Learn the screen: slide list, main canvas, notes area, ribbon/toolbar, presenter view.","Create a 5-slide deck: title, agenda, 3 content slides. Use layouts, not free-floating text boxes.","Present it to yourself with the Present button and arrow keys; note what looks wrong."],"m":"You can build a clean basic deck from a blank file in under 20 minutes.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"],["Google Slides help","https://support.google.com/docs/topic/9055132"]]},{"n":"Layouts, placeholders & masters","h":4,"s":["Understand placeholders (the dotted boxes): typing into them keeps everything aligned.","Edit the master once (Slide Master / Theme) and change every slide's font and colour at once.","Set up your own 3-colour theme: dark title text, accent colour, background — apply everywhere via master."],"m":"You theme a whole deck in one edit, and nothing on your slides is misaligned.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"],["Microsoft 365 training centre","https://support.microsoft.com/training"]]},{"n":"Design: colours, fonts and space","h":4,"s":["Learn the rules: 2 fonts max, 3 colours max, generous empty space, consistent margins.","Use built-in designer suggestions (Designer / Explore) for layout ideas, then adjust.","Learn where free assets live: icons (Flaticon), photos (Pexels/Unsplash), all properly usable."],"m":"Your decks look designed, not decorated — and they load in seconds.","r":[["Canva Design School","https://www.canva.com/designschool/"],["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"]]},{"n":"Images, icons, charts and diagrams on slides","h":4,"s":["Insert images and crop to shapes; learn why full-bleed images with dark overlay + white text always work.","Paste an Excel chart as an image and as a linked chart — know the difference.","Build one diagram: 4 boxes with arrows (a process) using SmartArt or simple shapes."],"m":"You add visuals that explain, not distract.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"],["Canva Design School","https://www.canva.com/designschool/"]]},{"n":"Animation & transitions: less, always less","h":3,"s":["Learn to use animation for ONE purpose: revealing information step by step (Appear/Fade).","Ban the rest: spinning, bouncing, sound effects. One transition type for the whole deck.","Add progressive bullet reveals to one slide and remove all animation from another that had five effects."],"m":"Your animation is invisible as animation — it just controls attention.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"]]},{"n":"Presenter view, notes & live delivery","h":4,"s":["Use presenter notes (script) + presenter view (timing, next slide) while the audience sees only the slide.","Practise: speak from notes, not from the slide. Time your 10 slides to 5 minutes.","Learn the recovery moves: B for black screen, number+Enter to jump to a slide, Esc to exit."],"m":"You can present live without reading slides, and recover gracefully when anything glitches.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"],["Zoom support","https://support.zoom.us/"]]},{"n":"Export: PDF, video, handouts","h":3,"s":["Export a PDF so fonts never break on another computer; export a video if you need a recorded talk.","Print handouts (2–4 slides per page) and notes pages when the audience needs detail.","Produce all three versions of your deck and check each one opens."],"m":"Your presentation works everywhere: projector, WhatsApp PDF, recorded video.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"],["PDF24 — free PDF tools","https://www.pdf24.org/"]]}]},{"t":"Canva & quick modern design","topics":[{"n":"Canva for fast beautiful decks","h":4,"s":["Tour Canva: templates, elements, text, uploads, brand kit; learn to strip a template to your own content.","Build a 6-slide deck from a template in 30 minutes.","Learn resize (turn the deck into an Instagram post set) and share/export options."],"m":"You produce a professional deck in an hour without design training.","r":[["Canva Design School","https://www.canva.com/designschool/"],["Canva","https://www.canva.com/"]]},{"n":"Posters, invitations & social posts with Canva","h":4,"s":["Learn the size presets (poster A4, Insta post, WhatsApp status) and safe zones.","Design: one poster for an event and one festival greeting; use a real photo of yours.","Export PNG for screens and PDF-print for paper; check colours in both."],"m":"You can make any basic design (poster, invite, card) yourself in under 30 minutes.","r":[["Canva","https://www.canva.com/"],["Canva Design School","https://www.canva.com/designschool/"]]}]},{"t":"Stage 4 checkpoint","topics":[{"n":"Checkpoint: a 10-slide deck about YOU, delivered","h":5,"s":["Build a 10-slide 'About me & my goal' deck: who I am, what I know, what I am building, how I work, what I want.","Apply the rules: one idea per slide, 2 fonts, 3 colours, images, consistent layout, notes for each slide.","Present it live (in person or on a video call) in under 5 minutes; ask for one piece of feedback and fix it."],"m":"A deck you could show in an interview tomorrow, presented without reading the slides.","r":[["PowerPoint — GCFGlobal","https://edu.gcfglobal.org/en/powerpoint/"],["Canva Design School","https://www.canva.com/designschool/"]]}]}]},{"id":5,"emo":"🎨","t":"Stage 5 · Images, Video & Audio","sub":"Photos, editing, design, video editing, audio, compression — the creative toolbox","goal":"You can handle any media file: view it, fix it, resize it, convert it, edit it, and ship it in the right format for WhatsApp, print, YouTube or a job. This stage is where most people's 'computer skills' stop — you will go past it.","mods":[{"t":"Understanding media files","topics":[{"n":"Image formats: JPG, PNG, WebP, SVG, RAW, HEIC","h":4,"s":["Learn the traits: JPG (small, photos, loses quality), PNG (lossless, transparency, bigger), WebP (modern, small), SVG (vector, scales perfectly, for logos), RAW/HEIC (camera/phone originals).","Convert one photo into JPG, PNG and WebP and compare file sizes and quality at 100% zoom.","Learn which to use where: WhatsApp photo = JPG, logo = PNG/SVG, website = WebP."],"m":"You choose the right format and can explain the trade-off between size and quality.","r":[["Photopea — Photoshop in the browser (free)","https://www.photopea.com/"],["Canva Design School","https://www.canva.com/designschool/"]]},{"n":"Resolution, DPI and why WhatsApp ruins photos","h":4,"s":["Learn pixels: 1920×1080 = 2 megapixels wide screen; 4000×3000 = 12 MP phone photo.","Learn the rule: screen needs ~72–96 DPI (size in pixels), print needs 300 DPI (size in cm × 300).","Check a photo's real pixel size, then resize a copy for WhatsApp (1600px long edge) and for print (300 DPI at 6×4 inch)."],"m":"You always know the right pixel size for screens vs print, and why messages compress images.","r":[["Photo editing & digital media — GCFGlobal","https://edu.gcfglobal.org/en/digitalmedia/"],["Photopea — Photoshop in the browser (free)","https://www.photopea.com/"]]},{"n":"Video formats, resolution & bitrate","h":4,"s":["Learn the words: 720p/1080p/4K, fps (24/30/60), and that bitrate decides quality-vs-size more than anything.","Learn container vs codec basics: .mp4 with H.264 plays literally everywhere — that is your default.","Compare: record the same 10-second clip at 720p and 4K and look at the file sizes."],"m":"You know why a 4K video is huge, and you always export MP4/H.264 unless asked otherwise.","r":[["DaVinci Resolve — free pro editor","https://www.blackmagicdesign.com/products/davinciresolve"],["CapCut — free video editor","https://www.capcut.com/"]]}]},{"t":"Photos: viewing, fixing, creating","topics":[{"n":"Viewing & organising photos properly","h":3,"s":["Use a real photo viewer (Windows Photos / Google Photos) and learn rotate, zoom, slideshow, and info (EXIF: date, GPS, camera).","Learn that EXIF GPS can leak your home location — check one photo's metadata.","Set up a sane photo folder structure and file naming (2026-10-trip-goa-001.jpg)."],"m":"Your photo library is organised, searchable, and you know what metadata is attached to each photo.","r":[["Photo editing & digital media — GCFGlobal","https://edu.gcfglobal.org/en/digitalmedia/"]]},{"n":"Crop, resize, rotate, compress (the 4 everyday edits)","h":4,"s":["Do all four on one photo in Paint/Photos/Photopea: crop to a square, resize to 1080px, rotate straight, compress under 200 KB.","Learn to keep an untouched original before editing (a 'master' copy) — this is a professional habit.","Take a 5 MB phone photo down to under 200 KB with no visible quality loss for a form upload."],"m":"You can prepare any photo for any upload limit without help.","r":[["Photopea — Photoshop in the browser (free)","https://www.photopea.com/"],["Photo editing & digital media — GCFGlobal","https://edu.gcfglobal.org/en/digitalmedia/"]]},{"n":"Photo correction: brightness, contrast, colour, sharpness","h":4,"s":["Learn the four sliders: exposure, contrast, saturation, sharpness — and go gently.","Fix 5 bad photos: a dark selfie, a yellowish indoor shot, a tilted photo, a dull landscape, a scan of a document shot on a phone.","Learn the document-scan trick: photo → straighten → whiten background → export PDF."],"m":"Your photos look noticeably better without obvious editing.","r":[["Photopea — Photoshop in the browser (free)","https://www.photopea.com/"],["Photo editing & digital media — GCFGlobal","https://edu.gcfglobal.org/en/digitalmedia/"]]},{"n":"Free Photoshop-class tools: Photopea & GIMP","h":6,"s":["Tour the layout: layers, tools panel, adjustments, export. Learn that everything is layers.","Learn the five core operations: select, cut out, move to a new layer, adjust one layer, export with transparency.","Real project: make a transparent-PNG logo from a photo and a two-image composite."],"m":"You can do real photo work — cutouts, layers, adjustments — in a free tool.","r":[["Photopea — Photoshop in the browser (free)","https://www.photopea.com/"],["GIMP tutorials (free)","https://www.gimp.org/tutorials/"]]},{"n":"Remove background, retouch & passport-photo jobs","h":5,"s":["Cut a person out of a photo, put them on a new background, and fix skin/brightness on the face layer only.","Build a passport/visa photo: correct size in mm, white background, proper brightness, right crop of the head.","Make one file meet a real requirement (a form's exact pixels and KB limit)."],"m":"You can produce passport photos and clean cutouts at home.","r":[["Photopea — Photoshop in the browser (free)","https://www.photopea.com/"],["GIMP tutorials (free)","https://www.gimp.org/tutorials/"]]}]},{"t":"Video editing","topics":[{"n":"CapCut/filmora basics: cut, trim, join, speed","h":6,"s":["Import clips, cut the boring parts (razor + delete), join clips in order.","Learn the timeline: video track, audio track, text layer. Zoom in to cut precisely.","Edit a 60-second video from 10 raw clips: trim each, order them, cut the dead air."],"m":"You turn raw phone clips into a tight, watchable 1-minute video.","r":[["CapCut — free video editor","https://www.capcut.com/"],["DaVinci Resolve — free pro editor","https://www.blackmagicdesign.com/products/davinciresolve"]]},{"n":"Titles, music, subtitles & text","h":4,"s":["Add a title card, lower-third name text, and end card. Use consistent fonts and positions.","Add background music and learn ducking (music quieter under speech); learn auto-subtitles and fix their errors.","Add subtitles to a 1-minute clip and export with them burned in for silent scrolling."],"m":"Your videos look intentional: named, labelled, subtitled, music balanced.","r":[["CapCut — free video editor","https://www.capcut.com/"],["DaVinci Resolve — free pro editor","https://www.blackmagicdesign.com/products/davinciresolve"]]},{"n":"Export settings for WhatsApp, YouTube & study material","h":4,"s":["Learn the presets: WhatsApp status (720p, under 16 MB), YouTube 1080p, low-data study video (480p).","Understand export time vs quality; export the same clip twice and compare sizes.","Ship one video through three exports and check each plays on a phone."],"m":"Your videos never get rejected for being too big or unwatchable on a phone.","r":[["CapCut — free video editor","https://www.capcut.com/"],["HandBrake — video compression","https://handbrake.fr/"]]},{"n":"Screen recording & voiceover (teach anything)","h":4,"s":["Record your screen with OBS or built-in tools, with your voice explaining a task.","Learn the setup: quiet room, microphone close, screen area chosen, mouse highlighting.","Record a 3-minute tutorial (e.g. 'how to build your resume'), then edit out mistakes."],"m":"You can make a clear tutorial video that someone could follow without you present.","r":[["OBS Studio — screen recording","https://obsproject.com/"],["DaVinci Resolve — free pro editor","https://www.blackmagicdesign.com/products/davinciresolve"]]}]},{"t":"Audio","topics":[{"n":"Audio basics: MP3, WAV, bitrate, mono/stereo","h":3,"s":["Learn: WAV = big and perfect for editing; MP3/M4A = small, for listening; bitrate (128/320 kbps) decides quality.","Convert a WAV to MP3 at two bitrates and compare size and sound.","Understand mono vs stereo and when each is right (voice = mono is fine)."],"m":"You pick the right audio format and can explain the size/quality trade-off.","r":[["Audacity — free audio editor","https://www.audacityteam.org/"]]},{"n":"Audacity: record, trim, clean, export","h":5,"s":["Record 30 seconds of speech; trim silence, remove a mistake, fade the ending.","Use Noise Reduction on a recording with fan/AC noise; normalise volume; export MP3.","Produce a clean 1-minute voice note (for a class or a YouTube voiceover)."],"m":"Your voice recordings sound clear and professional, with noise and dead air removed.","r":[["Audacity — free audio editor","https://www.audacityteam.org/"]]},{"n":"Turning audio into use: ringtones, voice notes, podcasts","h":3,"s":["Trim a song to 30 seconds, fade it, export, and set it as a phone ringtone.","Understand how voice notes and podcast episodes are structured (intro → content → outro).","Produce one 2-minute audio piece: a 'how I use my computer' voice note."],"m":"You can produce reusable audio: ringtone, voice note, mini-podcast segment.","r":[["Audacity — free audio editor","https://www.audacityteam.org/"]]}]},{"t":"Files, sharing & compression","topics":[{"n":"Zip, unzip & compress: sending big things","h":3,"s":["Create a ZIP of 10 files (or a folder) and open it on another device.","Learn when zipping helps (many small files, photos) and when it doesn't (already-compressed video/JPEG).","Prepare a project bundle: folder → zip → rename with date → send over email/Drive."],"m":"You can package and send any set of files as one tidy archive.","r":[["7-Zip — free archiver","https://www.7-zip.org/"]]},{"n":"PDF toolbox: merge, split, compress, protect","h":4,"s":["Merge 5 photos into one PDF; split pages out of a big PDF; compress a 20 MB scan below the upload limit.","Protect a PDF with a password and remove a password you know.","Assemble a submission set: cover letter + marksheets, merged, under the size limit."],"m":"You handle any PDF work an office or a college form throws at you.","r":[["PDF24 — free PDF tools","https://www.pdf24.org/"],["Google Docs editors help","https://support.google.com/docs"]]},{"n":"Stage 5 checkpoint: a 1-minute video + a design pack","h":4,"s":["Produce a 1-minute video (slides/photos + voiceover + subtitles) about something you learned in this course.","Produce a design pack: a poster, an invitation and a logo — original, correct sizes, exported properly.","Export every deliverable in two formats (screen + print/PDF) and check them all."],"m":"A portfolio of media work you could send to a client or put on your resume.","r":[["CapCut — free video editor","https://www.capcut.com/"],["Canva","https://www.canva.com/"]]}]}]},{"id":6,"emo":"🗂️","t":"Stage 6 · Files, Storage & Backups","sub":"File systems, storage sizes, the 3-2-1 backup rule, recovery, organising a digital life","goal":"You will never lose an important file again. You understand where data physically lives, how big things are, how to move and protect them, and how to recover when something disappears.","mods":[{"t":"How files & storage work","topics":[{"n":"File systems: drives, folders, paths, extensions","h":4,"s":["Learn a path like C:\\Users\\Rahul\\Documents\\Study\\notes.pdf and read it out loud like an address.","Learn drive letters (C: system, D: data, E: pen drive) and that a 'path' is just nested folders.","Practise: find the full path of 3 files, then open a file by typing its path in the address bar."],"m":"You read any file location like an address and can navigate by typing paths.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Storage types: HDD, SSD, NVMe, cloud, pen drive, memory card","h":4,"s":["Learn speed order: RAM (fastest, temporary) > SSD/NVMe > HDD > pen drive > cloud (network speed).","Learn reliability: SSDs have no moving parts (fast, shock-proof); HDDs are cheap and big; pen drives fail suddenly — never trust one as your only copy.","Check your own machine: what type of disk is C:? How full is each drive?"],"m":"You can name the storage type in any device and its trade-off in speed, size and price.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"],["The 3-2-1 backup rule explained","https://www.backblaze.com/blog/the-3-2-1-backup-strategy/"]]},{"n":"How big is a GB? Sizes, and planning space","h":3,"s":["Learn the ladder: KB → MB → GB → TB (each ×1024). A photo ~3 MB, a song ~5 MB, a film ~1.5 GB, a full phone backup ~30 GB.","Estimate: how many photos can 64 GB hold? Then check your phone — were you close?","Free space safely: uninstall unused apps, clear downloads, move media to cloud/PC. Never delete system folders you don't recognise."],"m":"You can estimate space needs for anything and know what to delete when a disk fills.","r":[["The 3-2-1 backup rule explained","https://www.backblaze.com/blog/the-3-2-1-backup-strategy/"],["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Organising your digital life (a system that survives years)","h":4,"s":["Learn the structure: Documents → Education / Money / Personal / Work; each year → month or event folders.","Naming rules: date first (2026-10-07-invoice.pdf), no spaces problems, no 'final2'.","Spend one hour reorganising your whole computer into this system. Sort at least 100 files."],"m":"Anyone (including you in 5 years) can find a document in your computer in 30 seconds.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]}]},{"t":"Backups & recovery","topics":[{"n":"Backups: the 3-2-1 rule, made practical","h":5,"s":["Learn 3-2-1: 3 copies, on 2 different media, with 1 off-site (cloud/friend's house).","Design YOUR system: PC + external drive/USB + Google Drive/OneDrive. Decide what is worth backing up (documents — yes; 200 movies — pointless).","Set up an automatic backup: File History on Windows, or Drive for Desktop sync folder, or a scheduled copy to an external drive."],"m":"Your important files exist in three places and at least one copy updates without you remembering.","r":[["The 3-2-1 backup rule explained","https://www.backblaze.com/blog/the-3-2-1-backup-strategy/"],["OneDrive help","https://support.microsoft.com/onedrive"]]},{"n":"Sync vs backup: the difference that saves you","h":3,"s":["Learn: sync copies changes everywhere instantly (delete on one → deleted everywhere); backup keeps old versions you can go back to.","Demonstrate it: delete a synced file and watch it vanish from the cloud; then restore it from Drive's trash/version history.","Lesson: sync is convenience, backup is safety. You need both, and you just proved why."],"m":"You can explain the difference and you know which one recovers a file you deleted by mistake.","r":[["The 3-2-1 backup rule explained","https://www.backblaze.com/blog/the-3-2-1-backup-strategy/"],["Google Drive help","https://support.google.com/drive"]]},{"n":"Recovering deleted files & lost data","h":4,"s":["Check the Recycle Bin first, then cloud trash (Drive trash keeps 30 days), then version history.","Learn that recovery software (Recuva) works best when you stop using the disk immediately after deleting.","Practise the full recovery: delete a file, empty the recycle bin, restore it from cloud/version history."],"m":"You can bring back a deleted file through at least two different routes.","r":[["Recuva — file recovery","https://www.ccleaner.com/recuva"],["Google Drive help","https://support.google.com/drive"]]},{"n":"Password-protecting, hiding & shredding files","h":4,"s":["Password-protect a document (Word → Save with password; or ZIP with password; or PDF with password).","Encrypt a folder on Windows with BitLocker/EFS, and learn what 'hidden' really means (hidden ≠ secure).","Learn that normal delete is not secure deletion — for sensitive data use wipe/shred tools, and encrypt the whole drive instead."],"m":"You handle sensitive documents correctly: encrypted, password-protected, or destroyed properly.","r":[["Windows Security (Defender) guide","https://support.microsoft.com/windows/stay-protected-with-windows-security-2ae0363d-0ada-c064-8b56-6a39afb6a963"],["Bitwarden — free password manager","https://bitwarden.com/"]]},{"n":"Sharing huge files without email pain","h":3,"s":["Learn the routes: Drive links (up to 15 GB free), WeTransfer for no-account sends, zipped split archives for old systems.","Understand limits: WhatsApp 2 GB per file/100 MB video status, email 25 MB, and what to do when you hit them.","Send a 500 MB file to someone using a Drive link with view-only access."],"m":"You send any size of file to anyone, on any platform, without frustration.","r":[["Google Drive help","https://support.google.com/drive"],["7-Zip — free archiver","https://www.7-zip.org/"]]},{"n":"Stage 6 checkpoint: your own backup routine","h":3,"s":["Write your backup plan on paper: what, where, how often, how to restore. Then implement it today.","Prove it works: delete a test file and restore it from each of your two backup routes.","Put a monthly reminder in your calendar to check that backups are still running."],"m":"A working, tested backup system — and the calm that comes with it.","r":[["The 3-2-1 backup rule explained","https://www.backblaze.com/blog/the-3-2-1-backup-strategy/"]]}]}]},{"id":7,"emo":"⚙️","t":"Stage 7 · Operating Systems","sub":"Windows in depth, Linux & Ubuntu, macOS, Android/iOS, command line, virtual machines","goal":"You stop being a passenger in your own computer. You can configure any system, fix it when it misbehaves, install and remove software properly, use the command line without fear, and understand Linux — the system that runs the internet.","mods":[{"t":"Windows in depth","topics":[{"n":"Windows 10/11 tour: everything and where it lives","h":4,"s":["Map the system: Start, search, taskbar, tray, File Explorer, Settings, Control Panel (legacy), Task Manager.","Learn the file locations that matter: Desktop, Documents, Downloads, Pictures, AppData (don't touch), Program Files (don't touch).","Recreate your perfect setup: pinned apps, folders on toolbar, dark mode, custom Start layout."],"m":"You know where every Windows setting and file category lives, without asking anyone.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"],["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Settings vs Control Panel + the settings that matter","h":4,"s":["Tour the real sections: System, Devices, Network, Personalisation, Apps, Accounts, Time & Language, Privacy, Update & Security.","Change the ten settings everyone eventually needs: default browser, default printer, display scaling, power plan, notifications, storage sense, startup apps, region/date format, mouse speed, sound devices.","Fix one real annoyance on your own PC (e.g. apps opening at startup) using these settings."],"m":"You configure any Windows machine for your own way of working in 20 minutes.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"]]},{"n":"Installing & managing software like an adult","h":4,"s":["Install from official sites and winget/Store; learn what an installer does (files + registry + shortcuts) and why 'Custom install' matters (bundled extras).","Use Disk Cleanup and apps list to uninstall leftovers; learn why dragging a folder to the trash does NOT uninstall a program.","Audit your PC: list every installed app, uninstall 5 you don't need, update the rest."],"m":"Your machine only runs software you chose, all of it updated.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"],["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Users & accounts on one computer","h":3,"s":["Learn administrator vs standard user, and why you should not do daily work as admin.","Create a second user account, switch between users, understand separate files and settings.","Set a strong login password/PIN and screen lock timeout."],"m":"Family members share one PC without touching each other's files — set up properly.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"],["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]},{"n":"Task Manager: seeing what your computer is doing","h":5,"s":["Learn the four tabs: Processes (what's running + CPU/RAM), Performance (graphs), Startup (boot speed), Services.","Find the memory hog: sort by Memory, watch what happens when you close a heavy app or a browser with 40 tabs.","Learn to end an unresponsive program properly (and why Task Manager is your first stop for a frozen PC)."],"m":"You can diagnose 'why is my PC slow?' in two minutes using Task Manager.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"]]},{"n":"Windows Update, drivers & device manager","h":4,"s":["Understand updates: security patches, features, driver updates — why postponing forever is a real risk.","Use Device Manager to see all hardware and spot driver problems (yellow ! mark).","Update everything once: Windows Update, GPU driver, printer software. Then schedule when updates install."],"m":"Your system and drivers stay current, and you can find the one device causing a problem.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"]]},{"n":"Command line: your first superpower (Windows)","h":7,"s":["Open Command Prompt/PowerShell: Win+R, type cmd, Enter. Learn the prompt and that you type commands, not click.","Learn 8 commands: dir (list), cd (move), mkdir (new folder), copy, move, del, cls, ipconfig.","Build a real task: create folders, copy files, list a tree of your documents — entirely by typing."],"m":"You can navigate and manage files from the command line, and it no longer looks like hacking.","r":[["Windows commands reference","https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/windows-commands"],["OverTheWire Bandit — command-line game","https://overthewire.org/wargames/bandit/"]]},{"n":"Taskbar, shortcuts & productivity tweaks","h":3,"s":["Learn the Windows key combos: Win+E (explorer), Win+D (desktop), Win+L (lock), Win+S (search), Win+V (clipboard history), Win+Shift+S (screenshot).","Enable Clipboard History and try it across apps.","Set up 3 automations: a shortcut key for your study folder, a pinned Quick Access set, a shutdown/restart routine."],"m":"You drive Windows at speed, mostly with the keyboard.","r":[["Keyboard shortcut reference","https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"],["Microsoft Windows help centre","https://support.microsoft.com/windows"]]},{"n":"Power, battery & laptop life","h":3,"s":["Learn power plans, battery report (powercfg /batteryreport), and what drains a laptop (background apps, brightness, heat).","Practise: check your battery health percentage and set a 20–80% charging habit for longevity.","Learn sleep vs hibernate vs shutdown properly and pick the right one for your use."],"m":"You get more hours per charge and know your battery's real health.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"]]}]},{"t":"Linux — the system that runs the world","topics":[{"n":"What Linux is & why it matters","h":4,"s":["Learn: a free, open-source OS family (Ubuntu, Fedora, Debian, Android!). 96% of web servers run Linux; Android phones are Linux.","Understand: distributions, desktop environments, package managers — in plain words.","Look at where Linux runs around you today (router, smart TV, servers, cloud)."],"m":"You can explain what Linux is and why a computer learner needs it.","r":[["Linux Journey — learn Linux","https://linuxjourney.com/"]]},{"n":"Ubuntu in a virtual machine: install & first steps","h":8,"s":["Install VirtualBox/VMware Player, download Ubuntu Desktop ISO, create a VM (4 GB RAM, 40 GB disk).","Install Ubuntu, boot it, explore: Activities, Files, Settings, Software Centre, terminal.","Break it fearlessly — it's a VM. Then snapshot & restore to see why VMs are the safest place to learn."],"m":"You have Ubuntu running on your own PC and you've installed software in it yourself.","r":[["Ubuntu tutorials","https://ubuntu.com/tutorials"],["VirtualBox — run other OSes safely","https://www.virtualbox.org/manual/"]]},{"n":"Linux terminal & the core commands","h":10,"s":["Learn navigation: pwd, ls, cd, mkdir, touch, cp, mv, rm, and the meaning of ~ (home).","Learn the power tools: sudo, apt install, cat, nano, grep, | (pipe), chmod basics.","Play OverTheWire Bandit levels 0–10 — the best free command-line trainer that exists."],"m":"You work comfortably at a Linux prompt: navigate, create, install, search, edit.","r":[["OverTheWire Bandit — command-line game","https://overthewire.org/wargames/bandit/"],["Linux Journey — learn Linux","https://linuxjourney.com/"]]},{"n":"macOS essentials (so any Mac won't confuse you)","h":4,"s":["Learn the Mac map: Finder, Dock, Launchpad, menu bar, Spotlight (⌘-Space), Mission Control.","Learn the Mac shortcuts: ⌘C/V/Z/S/Q/T, ⌘-Tab, and the difference between ⌘ (command) and Ctrl.","Tour System Settings and know where apps live (Applications) and user files live (Home folder)."],"m":"You can sit at a Mac and work within minutes, using the right keys.","r":[["macOS User Guide","https://support.apple.com/guide/mac-help/welcome/mac"]]}]},{"t":"Mobile operating systems & virtual machines","topics":[{"n":"Android & iOS as operating systems","h":5,"s":["Tour Android: home screens, app drawer, notifications, storage settings, developer options, app permissions.","Tour iOS: Control Centre, settings depth, App Store rules, privacy features, and its restriction on installing outside apps.","Compare both to Windows: same concepts (apps, storage, permissions, accounts) with fewer controls."],"m":"You can set up, secure and de-junk any phone like a power user.","r":[["Android help","https://support.google.com/android"],["iPhone User Guide","https://support.apple.com/guide/iphone/welcome/ios"]]},{"n":"Dual boot & virtual machines","h":5,"s":["Learn the difference: dual boot (two real OSes, pick one at startup) vs VM (one OS inside a window, safe sandbox).","Learn when each is right: performance (dual boot) vs safety and convenience (VM).","Set up a second OS in a VM (Ubuntu if you haven't) and take a snapshot before experimenting."],"m":"You run any operating system safely on your machine without risking your main setup.","r":[["VirtualBox — run other OSes safely","https://www.virtualbox.org/manual/"],["Ubuntu tutorials","https://ubuntu.com/tutorials"]]},{"n":"Stage 7 checkpoint: make an old computer useful again","h":4,"s":["Take an old/slow machine (or reset yours): clean it up — uninstall bloat, update, clear startup apps, add an SSD if possible.","Install a lightweight Linux (Xubuntu/Lubuntu) on it OR set up a fresh Windows install in a VM.","Document what you did and the before/after speed. You just did what a repair shop charges ₹800 for."],"m":"A machine you revived, running better than when you started, with your own notes on how.","r":[["Linux Journey — learn Linux","https://linuxjourney.com/"],["Microsoft Windows help centre","https://support.microsoft.com/windows"]]}]}]},{"id":8,"emo":"🧰","t":"Stage 8 · Hardware & Maintenance","sub":"What's inside, upgrading, assembling, troubleshooting, printers, buying advice","goal":"You understand the physical machine: every component, what specs mean when buying, how to upgrade, how to diagnose faults, and when to fix vs replace. You will never be cheated on a computer purchase again.","mods":[{"t":"Components in depth","topics":[{"n":"CPU: cores, threads, GHz, and what actually matters","h":4,"s":["Learn the terms: cores (workers), threads, clock speed (GHz), cache, and that core count ≠ speed.","Compare two real CPUs on a benchmark site and match them to how people actually use PCs (office, gaming, video).","Learn what bottlenecks a CPU: heavy browsing, video export, games; and that RAM/storage can matter more for office work."],"m":"You can read any CPU name and say who should buy it and what it will struggle with.","r":[["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"]]},{"n":"RAM: how much, what type, and symptoms of too little","h":4,"s":["Learn DDR4 vs DDR5, speed (MHz) and capacity tiers: 4 GB (useless today), 8 GB (basic), 16 GB (comfortable), 32 GB+ (heavy work).","Spot RAM shortage: constant disk thrashing, everything slow with 20 tabs open, Task Manager memory at 90%+.","Check your own RAM: how much, how many slots free, max supported."],"m":"You know exactly how much RAM a machine needs for a given job and how to check yours.","r":[["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"]]},{"n":"Storage: SSD vs HDD vs NVMe (the single best upgrade)","h":4,"s":["Learn the difference in numbers: HDD ~200 MB/s, SATA SSD ~550 MB/s, NVMe 2000–7000 MB/s. Everything feels 10× faster on an SSD.","Understand why SSDs die differently: no warning, no noise — another reason backups matter.","Check your disk type and free space, and price out an SSD upgrade for your machine."],"m":"You can advise anyone (including your past self) that the SSD is the upgrade that changes a computer's life.","r":[["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"]]},{"n":"GPU & graphics: integrated vs dedicated","h":4,"s":["Learn the split: integrated GPU (in the CPU, fine for office/video) vs dedicated card (gaming, 3D, video editing, AI).","Learn the numbers: VRAM, and what causes GPU bottlenecks (gaming at high settings, 4K video, AI models).","Match a card to a job: pick GPUs for 'office', '1080p gaming', 'video editing', 'AI/ML'."],"m":"You can spec graphics for a purpose without overspending or under-buying.","r":[["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"]]},{"n":"The motherboard, PSU & cooling (the boring parts that kill PCs)","h":4,"s":["Learn slots and sockets: CPU socket, RAM slots, PCIe slots, M.2, SATA ports — and that the socket decides what CPU fits.","Learn power: wattage needs, 80+ ratings, and why a cheap PSU can destroy an expensive PC.","Learn cooling: air vs liquid, thermal paste, airflow direction, and dust's role in overheating."],"m":"You can check any two parts for compatibility and spot a dangerous power supply.","r":[["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"]]},{"n":"Buying a computer: guidance for India","h":5,"s":["Build a budget split: for office use, spend on SSD + RAM + screen, not the CPU badge; for gaming, GPU first.","Learn the scam patterns: 'i7 laptop' with 4 GB RAM, old generation CPUs hidden in the name, warranty traps, refurbished sold as new.","Spec three machines for three budgets (₹30k, ₹50k, ₹80k) with real listings and defend each choice."],"m":"You can walk into any shop or site and buy the right machine for the money.","r":[["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"]]}]},{"t":"Upgrading & repairs","topics":[{"n":"Assembling/upgrading step by step","h":8,"s":["Learn the order: case → PSU → motherboard → CPU + cooler → RAM → storage → GPU → cables → first boot.","Watch a full build video twice, then do a real upgrade: add RAM or swap an HDD for an SSD (the safest first job).","Learn the safety: power off and unplug, touch metal to discharge static, never force connectors, keep screws organised."],"m":"You have physically upgraded your own machine and it still works — a huge psychological unlock.","r":[["iFixit — repair guides","https://www.ifixit.com/Guide"],["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"]]},{"n":"Printers & scanners: setup, sharing, fixing","h":5,"s":["Set up a printer (Wi-Fi and USB), install the right driver, set it as default, and print a test page.","Learn the common faults and fixes: offline status, paper jam, faded prints (toner/ink), 'driver unavailable'.","Share one printer between two devices on your Wi-Fi and print from both."],"m":"You can set up and fix a home printer without calling anyone.","r":[["Printers & scanning — GCFGlobal","https://edu.gcfglobal.org/en/printersandscanners/"]]},{"n":"Peripherals: choosing and repairing","h":3,"s":["Learn what makes a good monitor (resolution, panel type, size for distance), keyboard (mechanical vs membrane), mouse (DPI, ergonomics), webcam/mic for calls.","Learn the test: swap a suspect peripheral to confirm whether the device or the port/PC is at fault.","Fix one real problem: clean a mouse sensor, reseat a loose cable, update one driver."],"m":"You can diagnose any peripheral problem in 5 minutes and choose good ones when buying.","r":[["iFixit — repair guides","https://www.ifixit.com/Guide"]]},{"n":"BIOS/UEFI: the layer under Windows","h":4,"s":["Learn what BIOS/UEFI is (the first software that runs, before the OS) and how to enter it (Del/F2 at boot).","Learn the 5 settings that matter: boot order, secure boot, virtualization (VT-x/AMD-V), XMP for RAM speed, and update firmware.","Reboot into BIOS, write down your settings, change boot order, and change it back safely."],"m":"You can enter BIOS, understand what you're seeing, and safely change a setting or two.","r":[["iFixit — repair guides","https://www.ifixit.com/Guide"]]}]},{"t":"Troubleshooting & maintenance","topics":[{"n":"Diagnosing: no power, no display, no boot, overheating","h":7,"s":["Learn the universal start: is it plugged in → does it light up → does it beep/post → what does the screen say.","Learn the swap test: one component at a time (RAM sticks, cables, slots, another monitor) to isolate a fault.","Practise on a real or simulated fault: reseat RAM, clean dust, check the PSU fan, test with one RAM stick."],"m":"Given a dead computer, you can narrow the fault to a part within 20 minutes.","r":[["iFixit — repair guides","https://www.ifixit.com/Guide"],["Basic troubleshooting — GCFGlobal","https://edu.gcfglobal.org/en/computerbasics/basic-troubleshooting/1/"]]},{"n":"Slow computer: the complete fix order","h":5,"s":["Learn the checklist: startup apps → disk space → malware scan → RAM pressure → disk health → heat → OS age.","Do it for real: trim startup, free 15% disk space, run a scan, check temperatures.","Measure before and after with boot time and Task Manager. Then upgrade what's left (SSD/RAM)."],"m":"You can make any slow computer dramatically faster, in a sensible order, without guesswork.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"],["iFixit — repair guides","https://www.ifixit.com/Guide"]]},{"n":"Maintenance routine & cleaning","h":3,"s":["Learn the habits: dust out vents (compressed air), keep vents clear, update monthly, free disk space, back up weekly.","Learn heat management: laptop stands, thermal paste every few years, never on a bed/sofa.","Do a full service on your own machine today and put a monthly 15-minute check in your calendar."],"m":"Your machine runs cool and fast because you maintain it, not because you got lucky.","r":[["iFixit — repair guides","https://www.ifixit.com/Guide"]]},{"n":"When to repair vs replace (and not get cheated)","h":3,"s":["Learn the maths: repair if repair < 40% of replacement value AND the machine is under 4–5 years old.","Learn the common shop scams: unnecessary part swaps, 'motherboard dead' without testing, inflated RAM prices, keeping your old parts.","Role-play: a shop says your laptop needs a ₹6,000 repair. Write your 5 verification questions."],"m":"You can price a repair fairly and question a technician without being rude or gullible.","r":[["iFixit — repair guides","https://www.ifixit.com/Guide"]]},{"n":"Stage 8 checkpoint: the full PC service","h":4,"s":["Perform a complete health check on a real machine: temperatures, disk health (SMART), battery health, RAM test, malware scan, backups.","Produce a one-page report: parts list, health findings, upgrade recommendations with prices.","Do one actual upgrade or repair and log what you learned."],"m":"A written report you could hand to a customer — you are now the person people bring their PC to.","r":[["PCPartPicker — specs & compatibility","https://pcpartpicker.com/"],["iFixit — repair guides","https://www.ifixit.com/Guide"]]}]}]},{"id":9,"emo":"🛜","t":"Stage 9 · Networking & Wi-Fi","sub":"How the internet really works, routers, IP/DNS, sharing, VPNs, fixing connectivity","goal":"You understand how data travels from a website to your screen, you can set up and secure a home network, share files and printers across devices, and fix Wi-Fi problems that stump most people.","mods":[{"t":"How the internet works","topics":[{"n":"From website to screen: ISP, router, modem, packets","h":4,"s":["Trace the journey: your device → Wi-Fi → router → ISP → the internet's backbone → the server → and back.","Learn packets: data is chopped into small pieces that travel independently and are reassembled. That's why video buffers.","Run a traceroute (tracert google.com) and count the hops your data takes across the world."],"m":"You can explain the full path from a click to a loaded page, in plain words.","r":[["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"],["Cisco Networking Basics (free course)","https://www.netacad.com/courses/networking-basics"]]},{"n":"IP addresses, DNS & DHCP explained simply","h":5,"s":["Learn IP addresses: every device has one (like 192.168.1.5 locally, or a public IP for your home).","Learn DNS: the internet's phonebook that turns google.com into an IP address; and DHCP: the router hands out addresses automatically.","Find your own public IP and local IP; change DNS to 1.1.1.1 or 8.8.8.8 and feel the difference."],"m":"You explain IP, DNS and DHCP to anyone — and you can change your DNS in 2 minutes.","r":[["How DNS works (comic)","https://howdns.works/"],["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"]]},{"n":"Wi-Fi: bands, channels, range & speed","h":5,"s":["Learn 2.4 GHz (slower, longer range, crowded) vs 5 GHz (faster, shorter range); and that walls and microwaves matter.","Learn channels and interference; use a Wi-Fi analyser app to see your neighbours' networks crowding yours.","Optimise: move the router up and central, change your channel, separate 2.4/5 GHz names, place away from metal."],"m":"You can double your home Wi-Fi speed by fixing placement and channels — no new hardware.","r":[["Cisco Networking Basics (free course)","https://www.netacad.com/courses/networking-basics"],["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"]]},{"n":"Router setup & Wi-Fi security","h":5,"s":["Log into your router (192.168.1.1 / 192.168.0.1), and tour: WAN, DHCP, Wi-Fi settings, port forwarding, parental controls.","Secure it: change the admin password, WPA2/WPA3 encryption, strong Wi-Fi password, disable WPS and remote admin, update firmware.","Create a guest network so visitors never touch your main network."],"m":"Your home network is locked down and you know your own router inside out.","r":[["Cisco Networking Basics (free course)","https://www.netacad.com/courses/networking-basics"],["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"]]}]},{"t":"Sharing & remote access","topics":[{"n":"LAN: sharing files & printers between devices","h":5,"s":["Learn what a LAN is (your home network) and that all your devices are on it together.","Share a folder on Windows (right-click → properties → sharing) and open it from another device or phone.","Share one printer over Wi-Fi and print from two devices. Also learn Nearby Share / AirDrop for phone↔PC."],"m":"Files and printers move between your devices without cables or WhatsApp.","r":[["Microsoft Windows help centre","https://support.microsoft.com/windows"],["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"]]},{"n":"Mobile hotspot, tethering & mobile data","h":3,"s":["Set up a phone hotspot, connect a laptop, and learn what eats mobile data (video, updates, background sync).","Learn data-saving: metered connection on Windows/Android, limiting video quality, disabling auto-updates on mobile data.","Measure: run a speed test on mobile data vs office/home Wi-Fi and note the difference."],"m":"You get a laptop online anywhere, without burning your data pack.","r":[["Speedtest by Ookla","https://www.speedtest.net/"],["Cisco Networking Basics (free course)","https://www.netacad.com/courses/networking-basics"]]},{"n":"VPNs: what they do and don't do","h":4,"s":["Learn what a VPN is: an encrypted tunnel that hides your traffic from your ISP and changes your visible location.","Learn what it does NOT do: it doesn't make you anonymous, doesn't stop malware, doesn't replace HTTPS.","Learn the real uses: public Wi-Fi safety, remote work access, region testing — and free vs paid trust issues."],"m":"You can explain a VPN in one sentence and know when it's actually useful.","r":[["Choosing a VPN — EFF","https://ssd.eff.org/module/choosing-vpn-thats-right-you"],["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"]]},{"n":"Remote access: helping family from anywhere","h":4,"s":["Set up AnyDesk/TeamViewer with a one-time password and control another PC.","SAFETY RULE: never let anyone you did not call remote-control your computer. That is the #1 scam vector.","Help someone real: fix a relative's computer remotely and teach them how to disconnect you."],"m":"You can help anyone's computer from your chair — and you know exactly when to refuse access.","r":[["AnyDesk — remote desktop","https://anydesk.com/"],["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"]]}]},{"t":"Fixing connectivity & going deeper","topics":[{"n":"Troubleshooting: no internet, slow speed, dropouts","h":6,"s":["Learn the ladder: is it one device or all? Wi-Fi or cable? reboot router (30 seconds unplugged)? check lights, check ISP outage.","Learn the tools: ipconfig /all, ping 8.8.8.8, ping google.com, tracert, speedtest — and what each proves.","Fix a real problem end-to-end and write down what was wrong (cable, channel, DNS, ISP)."],"m":"Given 'internet not working', you can find the exact cause in 10 minutes.","r":[["Cisco Networking Basics (free course)","https://www.netacad.com/courses/networking-basics"],["Speedtest by Ookla","https://www.speedtest.net/"]]},{"n":"Speed tests, extenders & mesh: making Wi-Fi reach","h":4,"s":["Learn what your speed test REALLY measures (ping, download, upload) and what numbers matter for what (calls need low ping; streaming needs steady download).","Learn the fixes for dead zones: move router → change channel → powerline adapter → mesh system. Know the price ladder.","Test: measure speed next to the router and at the dead spot; plan the cheapest fix."],"m":"You can plan and buy the right Wi-Fi fix for a house — and skip the overpriced ones.","r":[["Speedtest by Ookla","https://www.speedtest.net/"],["Cisco Networking Basics (free course)","https://www.netacad.com/courses/networking-basics"]]},{"n":"Public Wi-Fi & safe networking habits","h":3,"s":["Learn the risks: fake hotspots with real names, traffic snooping, 'free Wi-Fi' capture portals.","Rules: HTTPS always, no banking on public Wi-Fi, use mobile hotspot instead, VPN when you must, forget the network afterwards.","Audit your saved networks: forget the ones you no longer need, disable auto-connect to open networks."],"m":"You use public Wi-Fi without becoming a headline.","r":[["Choosing a VPN — EFF","https://ssd.eff.org/module/choosing-vpn-thats-right-you"],["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]},{"n":"Stage 9 checkpoint: design & troubleshoot a home network","h":4,"s":["Draw your home network on paper: ISP line, router, Wi-Fi names, every device, where the dead zones are.","Implement three improvements (placement, channel, guest network or DNS) and measure the speed difference before/after.","Break something on purpose (change the Wi-Fi password, unplug the ISP cable) and repair it in under 5 minutes."],"m":"A documented, improved home network — and you are the person who fixed it.","r":[["Cisco Networking Basics (free course)","https://www.netacad.com/courses/networking-basics"],["Speedtest by Ookla","https://www.speedtest.net/"]]}]}]},{"id":10,"emo":"🔐","t":"Stage 10 · Security, Privacy & Safety","sub":"Threats, antivirus, passwords & 2FA, encryption, fraud defence, family safety","goal":"You become the hard target. Scammers, malware and identity thieves skip you because you are not worth the effort. You can clean an infected PC, lock down your accounts, and teach your family to do the same.","mods":[{"t":"Know the threats","topics":[{"n":"The threat landscape: virus, worm, trojan, ransomware, spyware, phishing","h":5,"s":["Learn each one's behaviour: virus (spreads via files), worm (self-spreads over networks), trojan (hides in 'free' software), ransomware (encrypts and demands money), spyware (watches you), phishing (tricks you).","Learn how infections actually arrive: cracked software, fake installers, USB drives, email attachments, malicious ads.","Study 5 real attack stories (WannaCry, an Indian UPI scam, a crypto-stealer in a fake app) and name the entry point for each."],"m":"You can name any malware type, how it spreads, and the specific mistake that let it in.","r":[["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"],["OWASP Top 10 — web security risks","https://owasp.org/www-project-top-ten/"]]},{"n":"How hackers actually get in (so you know what to fix)","h":5,"s":["Learn the real vectors in order of frequency: weak/reused passwords, phishing, unpatched software, public Wi-Fi, social engineering, physical access.","Learn social engineering: manipulating people, not machines (the 'your KYC will expire' call, the fake boss email, the 'support' remote-access request).","Analyse your own life: list every account, device and person who could be the weak link."],"m":"You can map your own attack surface and know your three weakest points.","r":[["EFF Surveillance Self-Defense","https://ssd.eff.org/"],["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"]]},{"n":"Antivirus, defender & the security stack","h":4,"s":["Learn what Windows Defender does today (it's good), what a second opinion scanner adds, and what is snake oil.","Set up the full stack: defender on, firewall on, browser protection, DNS filtering, updates automatic.","Configure a scheduled weekly scan and actually run one today."],"m":"Your machine has layered defence, and you know which layers to trust.","r":[["Windows Security (Defender) guide","https://support.microsoft.com/windows/stay-protected-with-windows-security-2ae0363d-0ada-c064-8b56-6a39afb6a963"],["Malwarebytes — second-opinion scanner","https://www.malwarebytes.com/"]]}]},{"t":"Locking down your accounts","topics":[{"n":"Password managers & 2FA: the two habits that end 95% of account theft","h":6,"s":["Install a password manager (Bitwarden), store your email and banking logins in it, and let it generate 20-character passwords.","Turn on 2FA everywhere important: email, bank, UPI apps, social, cloud. Prefer authenticator apps over SMS where possible.","Audit your logins: change every reused password this week; save recovery codes offline (printed, in a drawer)."],"m":"Every important account has a unique password and 2FA. You are now extremely hard to hack.","r":[["Bitwarden — free password manager","https://bitwarden.com/"],["EFF Surveillance Self-Defense","https://ssd.eff.org/"]]},{"n":"Email is the master key: secure it first","h":4,"s":["Understand why: whoever controls your email can reset every other account. It is the master key.","Secure it: strong unique password, 2FA, recovery phone + backup email, review 'connected apps' and remove the junk.","Check your email's forwarding rules and filters — attackers add hidden forwarding to spy on you."],"m":"Your email account is fortified, and you have removed every app and forward rule you didn't set up.","r":[["Gmail help","https://support.google.com/mail"],["Bitwarden — free password manager","https://bitwarden.com/"]]},{"n":"Data breaches: check, respond, recover","h":4,"s":["Check your email and phone on Have I Been Pwned and note every breach you appear in.","Learn the response: change that site's password (now unique, so it's contained), enable 2FA, watch for targeted phishing.","Set up breach alerts so you learn about the next one before the attacker uses it."],"m":"You know exactly which of your accounts have leaked and have locked them down.","r":[["Have I Been Pwned — breach check","https://haveibeenpwned.com/"],["Bitwarden — free password manager","https://bitwarden.com/"]]},{"n":"Account recovery: preparing for the worst day","h":3,"s":["Learn what recovery looks like: recovery email/phone, backup codes, security questions that can't be googled.","Store recovery codes somewhere real (printed, locked) — not only inside the account you'd be locked out of.","Practise: write out a recovery plan for your email, phone and bank, and test one recovery flow on an unimportant account."],"m":"You could lose your phone and still get back into every account within an hour.","r":[["EFF Surveillance Self-Defense","https://ssd.eff.org/"],["Bitwarden — free password manager","https://bitwarden.com/"]]}]},{"t":"Devices, data & privacy","topics":[{"n":"Encryption: HTTPS, BitLocker, messaging apps","h":5,"s":["Learn HTTPS: the padlock means the connection is encrypted; check it before entering passwords on any site.","Turn on full-disk encryption (BitLocker on Windows, FileVault on Mac) — a stolen laptop then reveals nothing.","Learn end-to-end encryption in messaging: what it protects, what metadata still leaks, and why backups are the loophole."],"m":"Your devices are encrypted, you check for HTTPS out of habit, and you understand messaging privacy.","r":[["Windows Security (Defender) guide","https://support.microsoft.com/windows/stay-protected-with-windows-security-2ae0363d-0ada-c064-8b56-6a39afb6a963"],["EFF Surveillance Self-Defense","https://ssd.eff.org/"]]},{"n":"Privacy: tracking, permissions, and taking your data back","h":5,"s":["Learn how you're tracked: cookies, device IDs, ad networks, location history — and what 'free' apps really sell.","Do a privacy tune-up: revoke unnecessary app permissions, turn off ad personalisation, check your Google/Apple/Meta data settings, use a tracker-blocking browser or extension.","Delete what you don't need: old accounts, old apps, and old data you'd never want leaked."],"m":"You have removed the majority of everyday tracking from your devices, and you know where your data lives.","r":[["EFF Surveillance Self-Defense","https://ssd.eff.org/"],["Google — your data & privacy settings","https://myactivity.google.com/"]]},{"n":"Online fraud in India: UPI scams, job scams, fake apps","h":6,"s":["Learn the big Indian scams: UPI 'collect request' frauds, fake job/investment offers, loan apps blackmailing with contact data, digi-arrest/'parcel' calls, fake KYC links.","Learn the rules: PIN sends money only; never scan/enter UPI PIN to 'receive'; never install unknown APKs; no real agency/court demands money on calls; job offers never ask for payment.","Learn the reporting routes: cybercrime.gov.in, 1930 helpline, bank reversal request within the golden hour."],"m":"You can identify the current Indian scam playbook instantly, and you know exactly what to do in the first hour if it happens.","r":[["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"],["NPCI — UPI safety & FAQ","https://www.npci.org.in/what-we-do/upi/product-overview"]]},{"n":"Social media safety, fake news & reputation","h":4,"s":["Lock down your profiles: privacy settings, who can tag/see, and remove personal info (birthday, address, school) from public posts.","Learn to verify: reverse image search, check source + date, look for other outlets reporting the same thing.","Learn reputation management: what an employer sees when they Google, and how to clean it."],"m":"Your public profile is safe and clean, and you can spot a fake story before sharing it.","r":[["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"],["EFF Surveillance Self-Defense","https://ssd.eff.org/"]]},{"n":"Family safety: protecting kids and parents","h":4,"s":["For parents/children: parental controls, screen time, app store restrictions, and safe-search on home Wi-Fi.","For elders: block unknown-number OTP requests, set up app locks on banking, agree on a family 'code word' for real emergencies.","Hold a 20-minute family security talk using your own rules; check their phones and fix the obvious gaps."],"m":"The vulnerable people around you are protected by settings you configured, not just warnings you gave.","r":[["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"],["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]},{"n":"What to do if you get hacked: the 60-minute plan","h":5,"s":["Learn the order: disconnect from the internet → change the email password first (from a clean device) → change banking → enable 2FA → check forwarding/backup devices → scan all devices.","Learn ransomware rules: do not pay; isolate; restore from backup. This is where Stage 6 pays you back.","Write your own one-page incident plan, print it, and keep it with your recovery codes."],"m":"You have a rehearsed, written response plan — panic becomes a checklist.","r":[["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"],["Windows Security (Defender) guide","https://support.microsoft.com/windows/stay-protected-with-windows-security-2ae0363d-0ada-c064-8b56-6a39afb6a963"]]},{"n":"Stage 10 checkpoint: your personal security audit","h":4,"s":["Run the full audit: passwords manager in use, 2FA on every critical account, disk encryption on, backups current, antivirus active, permissions pruned.","Produce a written report scoring each area out of 10, with the three fixes you still need.","Repeat the audit for one family member and fix their weakest point."],"m":"A documented audit proving you are in the top few percent of ordinary users for security.","r":[["EFF Surveillance Self-Defense","https://ssd.eff.org/"],["Bitwarden — free password manager","https://bitwarden.com/"]]}]}]},{"id":11,"emo":"🚀","t":"Stage 11 · Productivity & Digital Work","sub":"Notes, tasks, calendars, collaboration, PDFs, forms, automation — work like a pro","goal":"You run your life and work from your computer smoothly: everything captured, scheduled, findable and shared. You also automate the boring parts, so your computer does your chores.","mods":[{"t":"Capture & organise","topics":[{"n":"Notes you can actually find again","h":5,"s":["Learn the hierarchy that works: notebook → area (study/work/money) → note, with a clear title and date.","Try three apps honestly for a week: Google Keep (quick), Notion (databases + pages), Obsidian (local files, links).","Migrate your scattered notes from WhatsApp saved messages and paper into one system. Connect notes with links/tags."],"m":"One place for all notes, with a search that finds anything in 10 seconds.","r":[["Notion help","https://www.notion.so/help"],["Obsidian help","https://help.obsidian.md/"]]},{"n":"Tasks, to-dos & getting things done","h":4,"s":["Learn the system: capture everything → clarify next action → schedule → review weekly.","Set up one tool (Google Tasks / Todoist / Trello) and migrate your open loops.","Learn the two rules: one next action per task, and a weekly review of the whole list."],"m":"You always know the next 3 things to do, and nothing falls through the cracks.","r":[["Trello guide","https://trello.com/guide"],["Google Calendar help","https://support.google.com/calendar"]]},{"n":"Calendar: running your week","h":5,"s":["Set up Google Calendar: events, recurring events, reminders (time-based and location-based), shared calendars.","Learn time-blocking: put study blocks, work blocks and family blocks in the calendar, coloured differently.","Add 3 recurring blocks for your computer course and a weekly review slot."],"m":"Your week is planned in the calendar, and your study time is defended like an appointment.","r":[["Google Calendar help","https://support.google.com/calendar"]]},{"n":"Email power user: filters, labels, templates","h":5,"s":["Learn labels/folders + filters: auto-sort newsletters, bills, and work mail so the inbox shows only humans.","Learn templates/canned responses for repeated replies (forms, applications, quotes).","Reach inbox zero once using the 4-actions rule: reply (2 min), delegate, defer (schedule), delete."],"m":"Your email sorts itself; you empty the inbox daily in 15 minutes.","r":[["Gmail help","https://support.google.com/mail"],["Google Workspace Learning Center","https://support.google.com/a/users"]]}]},{"t":"Collaborate & share work","topics":[{"n":"Google Workspace as a work suite","h":5,"s":["Learn how Docs, Sheets, Slides and Drive work together with sharing and comments.","Practise real-time collaboration: two people in one document, comments, suggestions, chat.","Set up a shared folder for a group project with the right permissions and naming conventions."],"m":"You can run a group project entirely in the browser, with everyone on the same version.","r":[["Google Workspace Learning Center","https://support.google.com/a/users"],["Google Docs editors help","https://support.google.com/docs"]]},{"n":"Microsoft 365 & OneDrive in a work setting","h":4,"s":["Learn the Office + OneDrive + Teams stack that most Indian offices actually use.","Practise: save to OneDrive, share with colleagues, co-author a Word document live.","Learn licence reality: what free web versions can't do vs paid desktop versions (and when that matters)."],"m":"You fit straight into any office that runs Microsoft, without a training week.","r":[["Microsoft 365 training centre","https://support.microsoft.com/training"],["OneDrive help","https://support.microsoft.com/onedrive"]]},{"n":"Meetings: Teams, Zoom, Meets done properly","h":4,"s":["Learn the common controls: mute, camera, share screen, chat, recording, background blur, breakout rooms.","Learn meeting hygiene: agenda first, camera on when it matters, mute when not speaking, notes captured, action items assigned.","Host a real 15-minute meeting with an agenda and produce follow-up actions."],"m":"You can host or join any online meeting and people leave knowing what to do next.","r":[["Microsoft Teams help","https://support.microsoft.com/teams"],["Zoom support","https://support.zoom.us/"]]}]},{"t":"Documents, forms & automation","topics":[{"n":"PDF toolbox for real life","h":4,"s":["Learn the everyday PDF jobs: merge, split, compress, rotate, protect, fill, sign, OCR a scan into searchable text.","Turn phone photos of documents into a clean multi-page PDF.","Assemble a submission set: merged pages, correct order, compressed, renamed professionally."],"m":"You handle any PDF requirement a job, college or government form asks for.","r":[["PDF24 — free PDF tools","https://www.pdf24.org/"]]},{"n":"Forms & data collection (Google Forms)","h":4,"s":["Build a form with different question types (text, MCQ, checkbox, file upload) and logic branching.","Link responses to a Sheet; build an automatic summary with COUNTIF and charts.","Run a real form: collect 5 real responses (class attendance, feedback, orders)."],"m":"You can collect and analyse responses from anyone, with zero manual data entry.","r":[["Google Workspace Learning Center","https://support.google.com/a/users"],["Google Forms help","https://support.google.com/docs/topic/6063584"]]},{"n":"Automation for normal people (no-code & macros)","h":7,"s":["Learn what automation means: trigger → action. Then map 5 chores you repeat weekly.","Build two automations: an email-to-Sheets logger (Zapier/Make free tier) and an Excel macro or Apps Script that formats/emails a report.","Schedule one automation to run every Monday morning and let it work for a month."],"m":"At least one weekly chore in your life runs itself — and you know the pattern to automate more.","r":[["Zapier — automation for everyone","https://zapier.com/learn/"],["Google Workspace Learning Center","https://support.google.com/a/users"]]},{"n":"Text expanders, templates & typing at work speed","h":3,"s":["Install a text expander (or use Windows/phone shortcuts) for: your email address, address, bank details, canned replies.","Build a template library: quote, leave application, complaint, feedback request.","Measure the time you save in a normal week — usually 1–2 hours."],"m":"You never type the same block of text twice.","r":[["Keyboard shortcut reference","https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"],["Notion help","https://www.notion.so/help"]]},{"n":"Stage 11 checkpoint: an automated weekly routine","h":3,"s":["Produce: your notes system, calendar with study blocks, inbox with filters, template library and two live automations.","Run one full week using only these systems — no sticky notes, no WhatsApp-to-self.","Write a one-page 'my workflow' doc you could hand to a colleague."],"m":"A personal work system that saves you hours weekly and that you understand completely.","r":[["Google Workspace Learning Center","https://support.google.com/a/users"],["Zapier — automation for everyone","https://zapier.com/learn/"]]}]}]},{"id":12,"emo":"🧠","t":"Stage 12 · Programming Foundations","sub":"Think like a programmer, then Python: variables, loops, functions, files, Git, projects","goal":"You stop being only a user of software and start making it. You can write real programs in Python, solve problems with code, debug your own mistakes, and put your work on GitHub — the start of every technical career.","mods":[{"t":"Thinking like a programmer","topics":[{"n":"What programming is: instructions, algorithms, flowcharts","h":5,"s":["Learn the idea: a program is a precise recipe; a computer does exactly what you say, never what you meant.","Learn to write an algorithm for daily tasks: making tea, sending an email, marking attendance — numbered steps, no skipping.","Draw a flowchart for one process with a decision point (yes/no branch) and a loop."],"m":"You can break any task into precise, ordered steps a machine could follow.","r":[["CS50 — Harvard's intro to computer science (free)","https://cs50.harvard.edu/x/"],["Code.org — start coding","https://code.org/"]]},{"n":"Choosing your first language: why Python","h":2,"s":["Learn why Python first: readable English-like syntax, huge libraries, and it's the language of AI, data and automation.","See the same program in Python vs C to feel the difference in readability.","Decide your goal: automation, websites, data, AI — all reachable from Python."],"m":"You know what Python is for and why it's the right starting point.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"],["roadmap.sh — developer roadmaps","https://roadmap.sh/"]]},{"n":"Setting up: Python, VS Code & your first program","h":5,"s":["Install Python (from python.org, check 'Add to PATH') and VS Code with the Python extension.","Run your first line in the terminal, then write hello.py in VS Code and run it with the Run button.","Learn the loop you'll use forever: write → run → read the error → fix → run again."],"m":"You can create, run and modify a Python file on your own machine without help.","r":[["Visual Studio Code docs","https://code.visualstudio.com/docs"],["The official Python tutorial","https://docs.python.org/3/tutorial/"]]},{"n":"How to solve problems: breaking things down","h":6,"s":["Learn the method: understand the problem → plan on paper → write small pieces → test each → combine.","Practise on 10 small tasks: find the biggest number in a list, count vowels, reverse a word — paper first, then code.","Learn to Google errors properly: paste the exact message, read the first answer, adjust."],"m":"For any small problem, you can plan a solution on paper before typing code.","r":[["CS50 — Harvard's intro to computer science (free)","https://cs50.harvard.edu/x/"],["freeCodeCamp","https://www.freecodecamp.org/"]]}]},{"t":"Python core","topics":[{"n":"Variables & data types","h":6,"s":["Learn variables as labelled boxes: name = value; and the four core types: int, float, str, bool.","Learn conversion: int(), float(), str(); and why '5' + 5 crashes.","Write 10 tiny programs: age calculator, area of a circle, temperature converter, bill splitter."],"m":"You store, label and convert data correctly, and know what type you're holding.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"],["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"]]},{"n":"Input, output & strings","h":5,"s":["Learn input() (always returns text) and print(), plus f-strings for clean output.","Learn string methods: len, upper, lower, strip, split, replace, in.","Build a 'form letter generator' that takes a name and city and prints a personalised message."],"m":"You can build interactive programs that ask for data and print useful results.","r":[["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"]]},{"n":"Conditions: if, elif, else","h":7,"s":["Learn comparison operators (==, !=, <, >, <=, >=) and boolean logic (and, or, not).","Learn indentation — Python's braces. Learn nested conditions.","Build a grading program and a 'is this year a leap year?' checker."],"m":"Your programs make decisions, including chained and nested ones.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"],["freeCodeCamp","https://www.freecodecamp.org/"]]},{"n":"Loops: for & while","h":8,"s":["Learn for with range() and over lists; learn while with a stopping condition.","Learn break, continue, and the deadly infinite loop (and how to escape it).","Build: multiplication table printer, sum of 1–100, a number-guessing game, and a password retry system."],"m":"You can make the computer repeat work without repeating yourself.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"],["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"]]},{"n":"Lists & dictionaries","h":9,"s":["Learn lists: append, remove, sort, slice, index, and iterate.","Learn dictionaries: key → value, get, keys, values, loops over items; and when a dict beats a list.","Build a mini phonebook with add/search/delete, and a student-marks analyser (average, topper)."],"m":"You can store and process real collections of data, the heart of every useful program.","r":[["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"],["The official Python tutorial","https://docs.python.org/3/tutorial/"]]},{"n":"Functions & reuse","h":8,"s":["Learn def, parameters, return values, default arguments — and why functions stop you copy-pasting.","Refactor an earlier 30-line program into 3 clean functions.","Write a small utility toolkit: is_prime(), reverse(), count_words(), and reuse them in a menu program."],"m":"You write small, named, reusable pieces and keep your programs tidy.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"],["CS50 — Harvard's intro to computer science (free)","https://cs50.harvard.edu/x/"]]},{"n":"Files: reading & writing","h":6,"s":["Learn open/close with with open(...) as f, reading lines, writing, and appending.","Learn to save data as CSV and read it back — the bridge to Excel and real data.","Build a diary app that saves entries by date and reads them back."],"m":"Your programs remember data after they close.","r":[["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"]]},{"n":"Errors & debugging like a pro","h":7,"s":["Learn the common error types: SyntaxError, NameError, IndexError, TypeError, KeyError, and reading tracebacks bottom-up.","Learn debugging technique: print points, comment out blocks, isolate the smallest failing case, and read the traceback line number.","Deliberately break your program 5 ways and fix each — this builds more skill than writing new code."],"m":"An error message is now a clue, not a wall. You can find a bug in your own code.","r":[["freeCodeCamp","https://www.freecodecamp.org/"],["The official Python tutorial","https://docs.python.org/3/tutorial/"]]},{"n":"Modules & using other people's code","h":6,"s":["Learn import, the standard library (random, datetime, math, csv), and pip install for packages.","Install a package (requests) and fetch data from a public API.","Build a 'daily quote' or weather CLI script using a free API."],"m":"You pull in outside code confidently — the way all real software is built.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"],["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"]]}]},{"t":"Projects, tools & habits","topics":[{"n":"Mini project: calculator","h":5,"s":["Plan: menu, input numbers, operation choice, loop until exit, handle errors (divide by zero!).","Build it, then rebuild it with functions, then add features (memory, history).","Test with edge cases: zero, negatives, huge numbers, garbage input."],"m":"A calculator that survives any weird input you throw at it.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"]]},{"n":"Mini project: to-do list app (saved to file)","h":6,"s":["Plan the features: add, list, complete, delete, save to file, load on start.","Build with a list of dictionaries and JSON for storage.","Add polish: priorities, due dates, clear console screen."],"m":"A tool you actually use — the point at which programming becomes part of your life.","r":[["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"]]},{"n":"Mini project: automate a real chore","h":8,"s":["Choose a real chore: rename 100 files, merge CSV reports, extract text, resize images, send an email on a schedule.","Build it with the right libraries (os, pathlib, csv, openpyxl, PyPDF2, Pillow, smtplib).","Run it for real on your own files and measure the time saved."],"m":"You have automated a genuine task from your own life, not a toy example.","r":[["Automate the Boring Stuff with Python (free book)","https://automatetheboringstuff.com/"]]},{"n":"Git & GitHub: version control & portfolio","h":9,"s":["Learn the problem Git solves: version history, safe experiments, collaboration.","Learn the commands: init, add, commit, log, status, diff, branch, merge; then push to GitHub.","Create your GitHub profile, push your three projects with README files, and make your profile page look deliberate."],"m":"Your work is versioned, backed up and visible to the world on GitHub.","r":[["Pro Git (free book)","https://git-scm.com/book/en/v2"],["GitHub","https://github.com/"]]},{"n":"Reading docs & other people's code","h":5,"s":["Learn to use official documentation (docs.python.org) and to read function signatures.","Read a small open-source project: find its main file and follow one feature end to end.","Build a habit: when stuck, ask 'what would the docs say?' before searching for a tutorial."],"m":"Documentation is your default teacher, instead of random videos.","r":[["The official Python tutorial","https://docs.python.org/3/tutorial/"],["freeCodeCamp","https://www.freecodecamp.org/"]]},{"n":"100 small programs: the practice path","h":12,"s":["Work through 100 beginner problems (20 per week for 5 weeks): strings, lists, dicts, loops, files.","For each: plan on paper, code, test, refactor, commit to GitHub.","Keep a running notes file of the clever tricks you learn."],"m":"You've written 100 programs, and patterns are starting to feel obvious.","r":[["freeCodeCamp","https://www.freecodecamp.org/"],["CP-Algorithms — algorithms explained","https://cp-algorithms.com/"]]},{"n":"Stage 12 checkpoint: three working programs on GitHub","h":5,"s":["Your GitHub has: a mini tool with a README, one automation of a real task, and one project with a GUI or API.","Each README explains: what it does, how to run it, what you learned.","Show it to a working programmer and ask for one piece of honest feedback. Fix it."],"m":"A portfolio a stranger can run, plus feedback you have already acted on.","r":[["GitHub","https://github.com/"],["Pro Git (free book)","https://git-scm.com/book/en/v2"]]}]}]},{"id":13,"emo":"🌍","t":"Stage 13 · Web Development","sub":"HTML, CSS, JavaScript, responsive design, hosting, APIs, and a live portfolio site","goal":"You can build and publish real websites — your own portfolio, a business site, a tool people use. You understand how the web works under the hood, which makes every other online thing make sense.","mods":[{"t":"The web's building blocks","topics":[{"n":"How websites work: client, server, request & response","h":4,"s":["Learn the conversation: your browser (client) asks; a server answers with HTML/CSS/JS; the browser renders it.","Learn the URL parts: https://, domain, path, query string; and what happens at each step (DNS → request → response).","Open DevTools → Network and watch the actual requests for one page load."],"m":"You can explain any page load step by step, and read the Network tab.","r"
