:[["MDN Web Docs","https://developer.mozilla.org/"],["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"]]},{"n":"HTML: structure, tags, text, links, images","h":9,"s":["Learn the skeleton: <!doctype html>, html, head, body, and the idea of tags opening and closing.","Learn the core tags: h1–h6, p, a, img, ul/ol/li, strong/em, div, span.","Build a 3-page personal site by hand in a text editor: home, about, contact — properly linked."],"m":"You can structure any content as valid HTML without a builder.","r":[["W3Schools","https://www.w3schools.com/"],["freeCodeCamp","https://www.freecodecamp.org/"]]},{"n":"HTML: forms, tables, semantic structure","h":5,"s":["Learn forms: input types (text, email, number, date, file), labels, buttons, required validation.","Learn semantic tags: header, nav, main, section, article, footer — and why they beat a soup of divs.","Build a booking/contact form page and a timetable table page, structured semantically."],"m":"You can build accessible, well-structured pages with working forms.","r":[["MDN Web Docs","https://developer.mozilla.org/"],["W3Schools","https://www.w3schools.com/"]]},{"n":"CSS: selectors, colours, the box model","h":9,"s":["Learn connecting CSS (style tag, external file), selectors, classes, and the cascade.","Learn the box model: content, padding, border, margin — the source of all layout confusion.","Style your 3-page site: colours, fonts, spacing, and remove the default ugliness entirely."],"m":"Your pages look designed, and you can predict how CSS changes will affect layout.","r":[["W3Schools","https://www.w3schools.com/"],["MDN Web Docs","https://developer.mozilla.org/"]]}]},{"t":"Layout, responsiveness & interactivity","topics":[{"n":"CSS layout: flexbox & grid","h":9,"s":["Learn flexbox: row vs column, justify-content, align-items, gap — for one-dimensional layout.","Learn CSS grid: columns, rows, gaps, spanning — for two-dimensional layout.","Build a pricing/feature section with 3 cards using flexbox, then rebuild with grid."],"m":"You lay out any page structure without floats, hacks or random margins.","r":[["MDN Web Docs","https://developer.mozilla.org/"],["freeCodeCamp","https://www.freecodecamp.org/"]]},{"n":"Responsive design: phone, tablet, desktop","h":7,"s":["Learn mobile-first thinking and media queries (@media (max-width: 600px)).","Learn fluid units: %, rem, vw, and why fixed pixels break on phones.","Take an existing page and make it genuinely good on a 360px phone screen."],"m":"Your sites work properly on every screen size, without a framework.","r":[["MDN Web Docs","https://developer.mozilla.org/"],["W3Schools","https://www.w3schools.com/"]]},{"n":"JavaScript: variables, functions, logic in the browser","h":9,"s":["Learn let/const, types, functions, arrays and objects — the same ideas as Python, new syntax.","Learn to run JS in the console and link a .js file to your page.","Build: a tip calculator and a random quote generator that run in the browser."],"m":"You write working JavaScript and know how it differs from Python.","r":[["MDN Web Docs","https://developer.mozilla.org/"],["freeCodeCamp","https://www.freecodecamp.org/"]]},{"n":"JavaScript: the DOM — making pages alive","h":9,"s":["Learn selecting elements (querySelector), changing text/styles, creating and removing elements.","Learn events: click, input, submit — and event listeners.","Build an interactive to-do list in the browser (add, complete, delete, count)."],"m":"You can make any page respond to the user, without frameworks.","r":[["MDN Web Docs","https://developer.mozilla.org/"],["W3Schools","https://www.w3schools.com/"]]},{"n":"DevTools: inspect & debug any website","h":5,"s":["Learn the tabs: Elements (inspect HTML/CSS live), Console (errors), Network (requests), Application (storage).","Change a website's text and colours live in the Elements tab (temporarily) to understand how it's built.","Debug your own JS: find the line number in Console, set a breakpoint, step through."],"m":"You can look under any website's hood and fix your own bugs with DevTools.","r":[["MDN Web Docs","https://developer.mozilla.org/"]]}]},{"t":"Build, ship & grow","topics":[{"n":"Project: personal portfolio website","h":12,"s":["Plan the sections: hero (who you are), skills, projects (with links), about, contact.","Build it: HTML + CSS + a bit of JS (dark mode toggle, smooth scroll), fully responsive.","Design pass: consistent spacing scale, 2 fonts, 3 colours, real project screenshots."],"m":"A portfolio you'd actually hand to an employer, built from scratch.","r":[["freeCodeCamp","https://www.freecodecamp.org/"],["MDN Web Docs","https://developer.mozilla.org/"]]},{"n":"Publish it free: GitHub Pages, Netlify, Vercel","h":5,"s":["Learn static hosting: how a folder of files becomes a website with a URL.","Deploy your portfolio on GitHub Pages (and try Netlify drag-and-drop in 30 seconds).","Learn custom domains: buying one, pointing DNS, HTTPS certificates."],"m":"Your site is live on the internet with a real URL you can share.","r":[["GitHub Pages — free hosting","https://pages.github.com/"],["Netlify — free hosting","https://www.netlify.com/"]]},{"n":"APIs: pulling data from other services","h":9,"s":["Learn what an API is: a website's data door with a defined request format (JSON in, JSON out).","Fetch data with JavaScript fetch() from a free public API (weather, currency, GitHub).","Build a live dashboard page: search a city → show weather; search a user → show GitHub stats."],"m":"Your pages show live, real-world data instead of hardcoded text.","r":[["MDN Web Docs","https://developer.mozilla.org/"],["freeCodeCamp","https://www.freecodecamp.org/"]]},{"n":"Backend basics: servers, databases & auth (intro)","h":10,"s":["Learn the server side: Node.js or Python (Flask) receiving requests and sending responses.","Learn databases (SQLite/Mongo) and the idea of storing users, posts and sessions.","Build a tiny 'notes' app that saves data server-side and shows it back to you."],"m":"You understand and can build the simplest full-stack app.","r":[["freeCodeCamp","https://www.freecodecamp.org/"],["MDN Web Docs","https://developer.mozilla.org/"]]},{"n":"SEO & analytics: getting found","h":4,"s":["Learn SEO basics: titles, meta descriptions, headings, alt text, mobile speed, and why content beats tricks.","Add Google Analytics (or a free alternative) and verify you can see your own visit.","Submit your site's sitemap and check it appears in Google search results."],"m":"Your site can be found by search engines, and you can see who visits.","r":[["MDN Web Docs","https://developer.mozilla.org/"],["Grow with Google","https://grow.google/"]]},{"n":"Stage 13 checkpoint: a live website","h":6,"s":["Ship a complete site: portfolio OR a small tool (calculator, converter, quiz) that works on phone and desktop.","Ensure it's live on a real URL, loads fast, has no console errors, and has a README on GitHub.","Share it with 3 people; collect 3 pieces of raw feedback; implement the top one."],"m":"A URL proving you can build and ship for the web — plus feedback you acted on.","r":[["GitHub Pages — free hosting","https://pages.github.com/"],["freeCodeCamp","https://www.freecodecamp.org/"]]}]}]},{"id":14,"emo":"📈","t":"Stage 14 · Data, SQL & Analysis","sub":"Databases, SQL queries, pandas, visualisation, dashboards, statistics for work","goal":"You can take raw, messy data and turn it into decisions. SQL is the single most in-demand skill in Indian IT hiring — and with pandas and dashboards you can do the whole pipeline: pull, clean, analyse, present.","mods":[{"t":"Data thinking & databases","topics":[{"n":"Tables everywhere: how data is really stored","h":4,"s":["Learn the row/column model: every row is one thing (a customer, an order), every column one attribute.","Learn the difference between a spreadsheet (free-form, one file) and a database (structured, multi-table, built for millions of rows).","Take a familiar system (your college) and sketch 4 tables it must have: students, courses, marks, teachers."],"m":"You see the world as tables and can sketch the database behind any system.","r":[["SQLBolt — interactive SQL","https://sqlbolt.com/"],["Select Star SQL (free book)","https://selectstarsql.com/"]]},{"n":"Database design: keys, relationships, normalisation","h":6,"s":["Learn primary keys (unique ID per row), foreign keys (links between tables), and one-to-many vs many-to-many.","Learn why normalisation exists: storing facts once prevents contradictions.","Design a small shop database on paper: customers, products, orders, order_items — with keys and relationships marked."],"m":"You can design a clean multi-table schema for any small project.","r":[["SQLBolt — interactive SQL","https://sqlbolt.com/"],["Select Star SQL (free book)","https://selectstarsql.com/"]]},{"n":"Installing & using a real database","h":4,"s":["Install DB Browser for SQLite (zero setup) and open/create a database file.","Create your shop tables with CREATE TABLE, insert 10 sample rows, and query them.","Learn where this leads: MySQL/PostgreSQL on a server, exactly the same SQL."],"m":"You have a working database on your machine and can create/insert/query in it.","r":[["SQLBolt — interactive SQL","https://sqlbolt.com/"]]}]},{"t":"SQL: the employable skill","topics":[{"n":"SELECT, WHERE, ORDER BY, LIMIT","h":9,"s":["Learn the anatomy: SELECT columns FROM table WHERE condition ORDER BY column LIMIT n.","Learn operators and text matching: =, >, <, AND/OR/NOT, IN, BETWEEN, LIKE '%text%'.","Write 20 queries against a sample table: filter, sort, combine conditions, find patterns."],"m":"You can answer 'show me X where Y, sorted by Z' without touching a spreadsheet.","r":[["SQLBolt — interactive SQL","https://sqlbolt.com/"],["Select Star SQL (free book)","https://selectstarsql.com/"]]},{"n":"Aggregates: COUNT, SUM, AVG, MIN, MAX","h":6,"s":["Learn the aggregate functions and that NULL behaves strangely (COUNT(col) vs COUNT(*)).","Combine aggregates with WHERE to answer real questions: average marks per class, total sales last month.","Write 10 aggregate queries on your shop database."],"m":"You can summarise an entire table into a few meaningful numbers.","r":[["SQLBolt — interactive SQL","https://sqlbolt.com/"],["Select Star SQL (free book)","https://selectstarsql.com/"]]},{"n":"GROUP BY & HAVING","h":8,"s":["Learn grouping: one result row per category (per city, per month, per customer).","Learn HAVING — filtering groups after aggregation (WHERE filters rows, HAVING filters groups).","Answer: top 5 cities by revenue; months with more than 100 orders; customers with 2+ purchases."],"m":"You can produce grouped reports directly from the database.","r":[["Select Star SQL (free book)","https://selectstarsql.com/"],["SQLBolt — interactive SQL","https://sqlbolt.com/"]]},{"n":"JOINs: pulling data from multiple tables","h":9,"s":["Learn INNER JOIN first: match rows where keys are equal in both tables.","Learn LEFT JOIN: keep all rows from one table even when there's no match (find customers with no orders).","Join three tables (orders → customers → products) and answer real questions with names instead of IDs."],"m":"You combine tables as if it were one, which is what real reporting demands.","r":[["SQLBolt — interactive SQL","https://sqlbolt.com/"],["Select Star SQL (free book)","https://selectstarsql.com/"]]},{"n":"Modifying data: INSERT, UPDATE, DELETE & transactions","h":5,"s":["Learn the three write statements, always with WHERE (and the fear of forgetting WHERE).","Learn transactions: BEGIN → changes → COMMIT/ROLLBACK, and why banks rely on them.","Practise on a copy: insert 5 rows, update a price with a wrong WHERE, roll back, then do it right."],"m":"You can safely change data — and undo mistakes the professional way.","r":[["SQLBolt — interactive SQL","https://sqlbolt.com/"]]},{"n":"Subqueries, CASE & window functions (the advanced layer)","h":8,"s":["Learn subqueries: a query inside a query ('customers who spent more than average').","Learn CASE for if-else categorisation inside SQL (grade A/B/C from marks).","Learn window functions: ROW_NUMBER, RANK, running totals — the exact tools used in analytics jobs."],"m":"You write the kind of SQL that appears in analyst interview questions.","r":[["Select Star SQL (free book)","https://selectstarsql.com/"],["SQLBolt — interactive SQL","https://sqlbolt.com/"]]}]},{"t":"Python for data","topics":[{"n":"pandas: loading & inspecting data","h":9,"s":["Install pandas; load a CSV into a DataFrame; inspect with head(), info(), describe(), shape.","Learn selecting: columns, rows, filtering with conditions (df[df['marks'] > 60]).","Load a real dataset (Kaggle CSV) and answer 5 basic questions about it."],"m":"You can load any CSV and understand its structure in a minute.","r":[["pandas tutorials","https://pandas.pydata.org/docs/getting_started/intro_tutorials/"],["Kaggle Learn — free data courses","https://www.kaggle.com/learn"]]},{"n":"Cleaning data: missing values, duplicates, types","h":8,"s":["Learn to find and handle nulls (drop, fill, or investigate), drop duplicates, fix data types and trim text.","Learn to convert dates and fix messy categorical values (Delhi/delhi/NEW DELHI).","Clean one deliberately messy dataset end-to-end and document every decision."],"m":"You can take raw garbage data and make it analysis-ready.","r":[["pandas tutorials","https://pandas.pydata.org/docs/getting_started/intro_tutorials/"],["Kaggle Learn — free data courses","https://www.kaggle.com/learn"]]},{"n":"Grouping, merging & pivot tables in pandas","h":8,"s":["Learn groupby() + aggregation, sort_values, and value_counts — the pandas equivalent of SQL's GROUP BY.","Learn merge() to join DataFrames like SQL JOIN.","Reproduce five of your SQL answers using pandas instead, and compare the experience."],"m":"You can do the same analysis in SQL or Python, choosing whichever fits the job.","r":[["pandas tutorials","https://pandas.pydata.org/docs/getting_started/intro_tutorials/"],["Kaggle Learn — free data courses","https://www.kaggle.com/learn"]]}]},{"t":"Visualise, present & practise","topics":[{"n":"Charts that tell the truth","h":6,"s":["Learn the chart-choice rules (again, deeper): compare/trend/relationship/distribution.","Build charts in Excel/Sheets, then matplotlib/plotly in Python.","Take a chart that misleads (truncated axis, wrong chart type) and fix it."],"m":"Your charts make the finding obvious instead of hiding it.","r":[["pandas tutorials","https://pandas.pydata.org/docs/getting_started/intro_tutorials/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Power BI / Tableau: interactive dashboards for jobs","h":9,"s":["Install Power BI Desktop (free) or use Tableau Public; import your cleaned CSV.","Build a 3-visual dashboard: KPIs, trend, category breakdown, with slicers/filters.","Publish it online (Tableau Public / Power BI) and get a shareable link."],"m":"An interactive, shareable dashboard — the portfolio piece that gets analytics interviews.","r":[["Microsoft Learn — Power BI","https://learn.microsoft.com/en-us/training/powerplatform/power-bi"],["Tableau Public — free dashboards","https://public.tableau.com/"]]},{"n":"Statistics for work (without the headache)","h":9,"s":["Learn: mean vs median vs mode and when each lies; spread (range, standard deviation) in plain words.","Learn correlation (not causation), sampling bias, and what a p-value roughly means.","Analyse a real dataset: find a correlation, then list three other explanations for it."],"m":"You can read any report claiming 'average' or 'correlation' and judge whether it's honest.","r":[["Khan Academy — Statistics & probability","https://www.khanacademy.org/math/statistics-probability"],["Kaggle Learn — free data courses","https://www.kaggle.com/learn"]]},{"n":"Practise on real data (Kaggle)","h":10,"s":["Create a Kaggle account and pick 3 datasets that interest you (sports, health, movies, Indian census).","For each: load, clean, analyse, visualise, and write 5 findings in plain English.","Publish at least one as a Kaggle notebook so it's public and linkable."],"m":"Three complete analyses in your portfolio, on data you actually care about.","r":[["Kaggle Learn — free data courses","https://www.kaggle.com/learn"],["pandas tutorials","https://pandas.pydata.org/docs/getting_started/intro_tutorials/"]]},{"n":"Stage 14 checkpoint: end-to-end analysis","h":7,"s":["Pick a real question ('which IPL team wins most at home?'). Get the data, load it into SQL AND pandas.","Clean it, analyse it, answer the question with evidence, and build one dashboard or 3 charts.","Write the whole thing up in a 1-page story: question → data → method → finding → caveat. Publish on GitHub/Kaggle."],"m":"A complete data story: from raw file to decision, published and defendable.","r":[["Kaggle Learn — free data courses","https://www.kaggle.com/learn"],["Microsoft Learn — Power BI","https://learn.microsoft.com/en-us/training/powerplatform/power-bi"]]}]}]},{"id":15,"emo":"🤖","t":"Stage 15 · AI & Modern Tools","sub":"How AI works, using ChatGPT/Gemini/Copilot well, prompting, AI in every job, limits & ethics","goal":"You use AI as a power tool, not a toy or a crutch. You understand what these systems are actually doing, you can get 10× more out of them than most people, and you know exactly when not to trust them.","mods":[{"t":"Understand the technology","topics":[{"n":"How AI works: models, training, tokens (no maths)","h":6,"s":["Learn the plain-English version: an LLM is a very large pattern-completion machine trained on text; it predicts the next word astonishingly well.","Learn the vocabulary: parameters, training data, tokens, context window, inference, fine-tuning, hallucination.","Learn what 'generative' means across media: text, image, audio, video, code — same idea, different data."],"m":"You can explain to anyone what an AI model is, and why it sometimes invents facts.","r":[["Elements of AI — free course","https://www.elementsofai.com/"],["Hugging Face — learn AI","https://huggingface.co/learn"]]},{"n":"The 2026 AI landscape: who does what","h":5,"s":["Learn the players and their strengths: ChatGPT, Gemini, Claude, Copilot, plus image (Midjourney/Imagen), audio, video tools.","Learn the categories: chatbots, coding assistants, image/video generators, agents, local models (privacy!).","Try the same prompt in two different assistants and note where each is stronger."],"m":"You know which AI tool to reach for, for what, and why.","r":[["ChatGPT","https://chatgpt.com/"],["Google Gemini","https://gemini.google.com/"]]},{"n":"Using AI assistants well (the real skill)","h":6,"s":["Learn the four-part request: goal, context, format, constraints — and to iterate, not to hope.","Practise: ask for an explanation at 3 levels, ask for a quiz on a topic, ask for feedback on your writing.","Learn to verify: ask for sources, cross-check facts, and never paste output you haven't read."],"m":"You get dramatically better output from any AI tool because you ask like a professional.","r":[["Prompt Engineering Guide","https://www.promptingguide.ai/"],["ChatGPT","https://chatgpt.com/"]]},{"n":"Prompting patterns that work","h":6,"s":["Learn patterns: role-play ('act as my interviewer'), few-shot (give 2 examples of what you want), step-by-step, and output templates.","Learn chain-of-thought for reasoning tasks, and 'ask me questions first' for complex jobs.","Build your own prompt library file with 10 prompts you'll reuse (study, work, email, Excel, resume)."],"m":"You have a reusable prompt toolkit that saves you hours every week.","r":[["Prompt Engineering Guide","https://www.promptingguide.ai/"],["Google Gemini","https://gemini.google.com/"]]}]},{"t":"AI for real work","topics":[{"n":"AI for study & learning anything faster","h":5,"s":["Use AI as a tutor: explain a topic at 3 levels, generate practice questions, quiz you, mark your answers (Gemini/ChatGPT study mode).","Use NotebookLM to load your own PDFs/notes and ask questions grounded in your material.","Build a study loop: read → explain to AI → get corrected → quiz → teach it back."],"m":"You learn any new topic twice as fast, with an AI tutor that never gets tired.","r":[["NotebookLM — study your own documents","https://notebooklm.google.com/"],["ChatGPT","https://chatgpt.com/"]]},{"n":"AI for office work: docs, email, Excel, slides","h":6,"s":["Use AI to draft and rewrite emails, summarise long documents/meetings, and translate.","Use it for spreadsheet help: explain formulas, generate formulas from a description, debug #REF! errors.","Generate a slide outline and speaker notes, then apply your Stage 4 design standards."],"m":"The boring 40% of office work takes a fraction of the time.","r":[["Microsoft Copilot","https://copilot.microsoft.com/"],["ChatGPT","https://chatgpt.com/"]]},{"n":"AI image, audio & video tools","h":5,"s":["Generate images for slides/posters (and learn about licensing/watermarks).","Use AI for: background removal, upscaling, voiceover, noise removal, subtitles, dubbing.","Produce one small media project (30-second video with AI voiceover + AI images + subtitles)."],"m":"You can produce publishable media without expensive software or a studio.","r":[["Google Gemini","https://gemini.google.com/"],["CapCut — free video editor","https://www.capcut.com/"]]},{"n":"AI coding assistants: pair-programming","h":7,"s":["Install a coding assistant (Copilot in VS Code or a free alternative); learn autocomplete, chat and explain-code features.","Use it properly: ask it to explain errors, suggest approaches, write tests, review your code — then read and edit everything it gives you.","Build one small project where you write the plan and structure, AI fills in the tedious parts."],"m":"You code several times faster and still understand every line you ship.","r":[["Visual Studio Code docs","https://code.visualstudio.com/docs"],["Microsoft Copilot","https://copilot.microsoft.com/"]]},{"n":"Automation + AI: making agents work for you","h":7,"s":["Learn the concept: trigger → AI step → action, with memory and tools (search, files, email).","Build two automations: an email triage/summariser, and a 'research this topic → save a summary file' agent.","Learn where agents fail (long tasks, verification) and design your automation around the failures."],"m":"At least two real workflows in your life run automatically with AI in the loop.","r":[["Zapier — automation for everyone","https://zapier.com/learn/"],["ChatGPT","https://chatgpt.com/"]]}]},{"t":"Judgement: limits, safety & ethics","topics":[{"n":"Hallucinations & verification: never get fooled","h":5,"s":["Learn when models hallucinate most: precise facts, numbers, citations, recent events, niche topics.","Learn verification habits: ask for sources, cross-check with search, test with known facts.","Catch one AI in 3 deliberate mistakes and write your own verification checklist."],"m":"You trust AI output exactly as much as you've verified it — no more.","r":[["Prompt Engineering Guide","https://www.promptingguide.ai/"],["Elements of AI — free course","https://www.elementsofai.com/"]]},{"n":"Privacy & ethics: what never goes into an AI","h":5,"s":["Learn the rules: no passwords, no Aadhaar/PAN/bank details, no other people's private data, no confidential work documents unless the tool is approved for them.","Learn how your chats may be used for training, and how to turn that off (or use enterprise/private modes).","Write your own one-page 'what I never paste into AI' policy and follow it."],"m":"You use AI freely on things that don't matter and carefully on things that do.","r":[["EFF Surveillance Self-Defense","https://ssd.eff.org/"],["ChatGPT","https://chatgpt.com/"]]},{"n":"AI's limits: where humans still win","h":4,"s":["Learn what AI cannot do: take responsibility, judge values, know your context, build trust, or be accountable.","Learn the 'AI as junior assistant' mental model: fast, tireless, sometimes confidently wrong — you are the senior who checks.","List 5 tasks in your own life you will never delegate to AI, and say why."],"m":"You use AI as a tool without losing your own judgement to it.","r":[["Elements of AI — free course","https://www.elementsofai.com/"]]},{"n":"Staying current in a fast-moving field","h":4,"s":["Learn where to follow AI news without the hype: a few good newsletters/YouTube channels and one community.","Learn to test a new tool in 10 minutes: one real task, compare to your current tool, keep or drop.","Set a monthly 30-minute 'AI tool check' in your calendar."],"m":"You stay up to date calmly, without drowning in hype.","r":[["Hugging Face — learn AI","https://huggingface.co/learn"],["Elements of AI — free course","https://www.elementsofai.com/"]]},{"n":"Stage 15 checkpoint: build something with AI","h":5,"s":["Build a real deliverable using AI in at least 3 ways: e.g. a report (research + writing + charts), or a small app (idea + code + design).","Document your process: prompts used, what AI got wrong, how you fixed it, final verification.","Publish the deliverable (GitHub/LinkedIn/Drive) with one paragraph on your workflow."],"m":"Proof you can direct AI to ship real work — the skill employers screen for now.","r":[["ChatGPT","https://chatgpt.com/"],["GitHub","https://github.com/"]]}]}]},{"id":16,"emo":"🏗️","t":"Stage 16 · Computer Science Core","sub":"Binary, architecture, OS internals, data structures & algorithms, complexity, testing","goal":"You understand how computers actually work, from electrons in gates to running algorithms. This is the layer that makes you a computer scientist rather than a user — and it's exactly what technical interviews test.","mods":[{"t":"From bits to machines","topics":[{"n":"Binary & how data is stored","h":7,"s":["Learn binary: base-2 counting, and why computers use it (on/off, reliable).","Convert back and forth: decimal ↔ binary ↔ hex for 20 numbers, until it's boring.","Learn how everything else is encoded: ASCII/Unicode for text, RGB for colours, sampling for audio, pixels for images."],"m":"You can convert numbers between bases and explain how text, images and sound become bits.","r":[["Crash Course Computer Science (video series)","https://www.youtube.com/playlist?list=PL8dPuuaLjXtNlUrzyH5r6jN9ulIgZBpdo"],["Nand2Tetris — build a computer from scratch","https://www.nand2tetris.org/"]]},{"n":"Logic gates & how a CPU adds","h":7,"s":["Learn the gates: AND, OR, NOT, XOR and their truth tables.","Build (on paper or Nand2Tetris) a half adder and full adder from gates.","Learn how gates form registers and an ALU — the part that does your arithmetic."],"m":"You can build an adder from logic gates and explain the chain from gate to calculation.","r":[["Nand2Tetris — build a computer from scratch","https://www.nand2tetris.org/"],["Crash Course Computer Science (video series)","https://www.youtube.com/playlist?list=PL8dPuuaLjXtNlUrzyH5r6jN9ulIgZBpdo"]]},{"n":"Computer architecture: fetch-decode-execute","h":8,"s":["Learn the cycle: fetch instruction → decode → execute → store, millions of times a second.","Learn registers vs RAM vs cache, and why cache hierarchy (L1/L2/L3) decides real-world speed.","Learn how your Python code travels: source → bytecode/interpreter → machine instructions → CPU."],"m":"You can trace what physically happens when your program runs a single line.","r":[["Crash Course Computer Science (video series)","https://www.youtube.com/playlist?list=PL8dPuuaLjXtNlUrzyH5r6jN9ulIgZBpdo"],["Nand2Tetris — build a computer from scratch","https://www.nand2tetris.org/"]]},{"n":"Operating system internals: processes, memory, files","h":10,"s":["Learn processes and threads: what 'running' really means; scheduling and context switching.","Learn virtual memory and paging: how every program thinks it owns the whole machine.","Learn file systems, permissions and system calls — and recognise them in Task Manager and the terminal."],"m":"You understand what Task Manager is truly showing and why programs crash.","r":[["Crash Course Computer Science (video series)","https://www.youtube.com/playlist?list=PL8dPuuaLjXtNlUrzyH5r6jN9ulIgZBpdo"],["CS50 — Harvard's intro to computer science (free)","https://cs50.harvard.edu/x/"]]}]},{"t":"Algorithms & data structures","topics":[{"n":"Big-O: complexity without fear","h":9,"s":["Learn the idea: how running time grows as input grows, ignoring constants.","Learn the ladder: O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ), with one real example each.","Analyse 8 code snippets you've written: classify each one's complexity."],"m":"You can look at a loop and say how it will behave on a million rows.","r":[["VisuAlgo — algorithms visualized","https://visualgo.net/"],["CP-Algorithms — algorithms explained","https://cp-algorithms.com/"]]},{"n":"Arrays, lists, stacks & queues","h":10,"s":["Learn how arrays work in memory (why index access is instant) vs linked lists.","Learn stack (LIFO — undo, back button) and queue (FIFO — printing, messaging).","Implement a stack and a queue in Python from scratch, then use the built-ins."],"m":"You can implement the basic structures and know which one a given problem needs.","r":[["VisuAlgo — algorithms visualized","https://visualgo.net/"],["CS50 — Harvard's intro to computer science (free)","https://cs50.harvard.edu/x/"]]},{"n":"Dictionaries, sets & hashing","h":8,"s":["Learn how hash tables give near-instant lookup, and what a hash collision is.","Learn when a set beats a list (membership tests, deduplication).","Solve 5 problems choosing the right structure: count word frequencies, find duplicates, two-sum."],"m":"You reach for a dict/set automatically when speed matters.","r":[["VisuAlgo — algorithms visualized","https://visualgo.net/"],["CP-Algorithms — algorithms explained","https://cp-algorithms.com/"]]},{"n":"Trees & graphs: the real world's structures","h":12,"s":["Learn trees: hierarchy (file systems, org charts), binary search trees, and why balanced trees matter.","Learn graph terms: nodes, edges, directed/undirected, weighted — and model 5 real systems as graphs (maps, friends, web links).","Implement BFS and DFS in Python; use them to find a path and explore a network."],"m":"You can model any connected system as a graph and traverse it with code.","r":[["VisuAlgo — algorithms visualized","https://visualgo.net/"],["CP-Algorithms — algorithms explained","https://cp-algorithms.com/"]]},{"n":"Searching & sorting: the classic algorithms","h":10,"s":["Learn linear search vs binary search (and why sorted data is powerful).","Learn bubble sort (to understand), then merge sort and quick sort (to use) — implement all three.","Learn how Python's built-in sort works and why you should trust it in real code."],"m":"You can implement and compare the classics, and explain each one's trade-offs.","r":[["VisuAlgo — algorithms visualized","https://visualgo.net/"],["CS50 — Harvard's intro to computer science (free)","https://cs50.harvard.edu/x/"]]},{"n":"Recursion & divide-and-conquer","h":10,"s":["Learn recursion: a function calling itself with a smaller problem, plus the base case that stops it.","Learn divide-and-conquer through merge sort and binary search.","Solve: factorial, Fibonacci, tower of Hanoi, and a folder-size calculator with recursion."],"m":"You solve problems recursively and can explain why the base case is everything.","r":[["CS50 — Harvard's intro to computer science (free)","https://cs50.harvard.edu/x/"],["CP-Algorithms — algorithms explained","https://cp-algorithms.com/"]]},{"n":"Dynamic programming & greedy (the interview layer)","h":8,"s":["Learn dynamic programming by hand first: the staircase problem, then climbing stairs with memoisation → tabulation.","Learn greedy algorithms and when they fail (coin change).","Solve 5 classic DP problems and write down the pattern each belongs to."],"m":"DP problems look like puzzles with here with one command."],"m":"You package and run any app consistently, on any machine.","r":[["Docker — getting started","https://docs.docker.com/get-started/"]]},{"n":"Kubernetes overview & CI/CD pipelines","h":8,"s":["Learn what Kubernetes does (scheduling containers across machines, self-healing, scaling) and when you don't need it yet.","Build a CI/CD pipeline: push to GitHub → tests run → build image → deploy automatically.","Add a status badge to your README showing your pipeline passing."],"m":"Your projects deploy themselves and stay up without you babysitting them.","r":[["Kubernetes tutorials","https://kubernetes.io/docs/tutorials/"],["GitHub Actions — CI/CD docs","https://docs.github.com/en/actions"]]},{"n":"Monitoring & logging: keeping things alive","h":5,"s":["Learn uptime checks, error logging, and alerting; set up a free uptime monitor for your site.","Learn to read logs to diagnose an outage (and cause one on purpose to practise).","Create a simple status page for your own services."],"m":"You know when something breaks before your users tell you.","r":[["GitHub Actions — CI/CD docs","https://docs.github.com/en/actions"],["AWS Skill Builder (free cloud courses)","https://skillbuilder.aws/"]]}]},{"t":"Specialise: cyber, mobile, game","topics":[{"n":"Cybersecurity paths: blue team vs red team","h":7,"s":["Learn the landscape: blue (defence: monitoring, IR, hardening), red (offence: pen testing), and governance/compliance.","Learn the core toolkit: Linux, networking, scripting (Python), web technologies — you already built all four.","Map your own path: pick one starting certification/lab track and write a 6-month plan."],"m":"You know where you fit in cybersecurity and what to learn next, in order.","r":[["TryHackMe — learn cyber security","https://tryhackme.com/"],["OWASP Top 10 — web security risks","https://owasp.org/www-project-top-ten/"]]},{"n":"Ethical hacking lab: your first CTF","h":10,"s":["Set up a legal lab: TryHackMe/Kali VM. Learn the rules — only test what you own or are authorised to test.","Complete a beginner path: reconnaissance, scanning, web exploitation basics, privilege escalation basics.","Solve 5 CTF challenges and write up each one (the write-up habit is the career skill)."],"m":"You've legitimately hacked practice targets and documented how — the beginning of offensive security.","r":[["TryHackMe — learn cyber security","https://tryhackme.com/"],["OverTheWire wargames","https://overthewire.org/wargames/"]]},{"n":"Mobile app development intro","h":10,"s":["Choose a route: Android (Kotlin + Android Studio) or cross-platform (Flutter — one codebase for Android+iOS).","Build a 2-screen app with data saved locally (a habit tracker or a unit converter).","Run it on your own phone, and learn the Play Store publishing process and costs."],"m":"A working mobile app on your own phone, built by you.","r":[["Android developers — get started","https://developer.android.com/get-started"],["Flutter — one codebase, any phone","https://docs.flutter.dev/get-started"]]},{"n":"Game development intro","h":10,"s":["Pick Godot (free, light) or Unity; learn the scene/object/update-loop model.","Build one tiny game: collect-the-coins, or flappy-style, with score, sound and restart.","Learn about assets (free packs), and publish to itch.io for free."],"m":"A playable game you can send as a link to a friend.","r":[["Godot engine docs","https://docs.godotengine.org/"],["Unity Learn","https://learn.unity.com/"]]},{"n":"No-code & low-code: shipping without typing code","h":5,"s":["Learn the platforms: Glide/Airtable apps, WordPress sites, Shopify stores, Zapier automations.","Build one small internal tool (a booking system on an Airtable base) with zero code.","Learn when no-code is right (speed, budget) vs when custom code wins (scale, control)."],"m":"You can ship a small working product in a weekend without a developer.","r":[["Zapier — automation for everyone","https://zapier.com/learn/"],["Notion help","https://www.notion.so/help"]]}]},{"t":"Career & the long game","topics":[{"n":"Certifications worth doing (and which are a waste)","h":5,"s":["Learn the valuable ones: cloud (AWS/Azure fundamentals), networking (CCNA), security (CompTIA Security+, CEH), data (Power BI), and Google/Microsoft role certs.","Learn what employers actually value: a verified portfolio, real projects, and demonstrable skills — certs open doors, projects close them.","Write your personal 12-month certification plan with costs and time budgets."],"m":"A realistic certification plan built around your goal, not a certificate collection.","r":[["AWS Skill Builder (free cloud courses)","https://skillbuilder.aws/"],["Microsoft Learn — Azure fundamentals","https://learn.microsoft.com/en-us/training/azure/"]]},{"n":"Freelancing & remote work skills","h":7,"s":["Learn the business: services you can offer now (Excel automation, data cleanup, website building, tech support, video editing), pricing models, and where to find clients (Upwork, Fiverr, local businesses).","Build your freelance kit: profile, 3 portfolio pieces, service packages, a simple contract, an invoice template (from Stage 3!).","Land one real small job — even ₹500 — and deliver it professionally."],"m":"Your first paid work in tech, plus a repeatable way to get the next client.","r":[["Kaggle Learn — free data courses","https://www.kaggle.com/learn"],["Grow with Google","https://grow.google/"]]},{"n":"Portfolio, GitHub profile & LinkedIn","h":6,"s":["Make your GitHub a portfolio: pinned repositories, good READMEs with screenshots, live links.","Build a LinkedIn that says what you can do: headline, skills, projects, posts about your learning.","Write one post about a project you built. Share it. Learn to talk about your work publicly."],"m":"A profile that makes recruiters stop scrolling.","r":[["GitHub","https://github.com/"],["Grow with Google","https://grow.google/"]]},{"n":"Interview prep: aptitude, coding rounds & IT jobs","h":9,"s":["P /* ================= APP ENGINE ================= */
var LS='czh.v1', MEM={};
function lsG(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}}
function lsS(k,v){MEM[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p2(n){return n<10?'0'+n:''+n}
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function today(){return dstr(new Date())}
function addD(ds,n){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return dstr(d)}
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[R(0,a.length-1)]}

var DEF={v:1,name:'',mins:45,start:today(),lastBackup:'',done:{},doneAt:{},notes:{},scratch:'',log:{},drills:[],flash:{},open:{},sonboard:false};
var S=(function(){try{var o=JSON.parse(lsG(LS)||'null');if(!o)o=JSON.parse(JSON.stringify(DEF));for(var k in DEF)if(o[k]===undefined)o[k]=DEF[k];return o}catch(e){return JSON.parse(JSON.stringify(DEF))}})();
function save(){lsS(LS,JSON.stringify(S))}

var FLAT=[],BYID={},TOT={topics:0,hours:0};
(function(){var i=0;STAGES.forEach(function(st){st.mods.forEach(function(m,mi){m.topics.forEach(function(t,ti){
  var id=st.id+'-'+mi+'-'+ti;

  FLAT.push(o);BYID[id]=o;TOT.topics++;TOT.hours+=t.h;});});});})();

function isDone(id){return !!S.done[id]}
function doneCount(){var c=0;for(var k in S.done)if(S.done[k])c++;return c}
function doneHours(){var h=0;FLAT.forEach(function(o){if(S.done[o.id])h+=o.t.h});return h}
function stageStat(sid){var st=STAGES.filter(function(s){return s.id===sid})[0];var tot=0,dn=0;st.mods.forEach(function(m){m.topics.forEach(function(t){tot++;})});
  FLAT.forEach(function(o){if(o.sid===sid){if(S.done[o.id])dn++}});return{tot:tot,dn:dn,pct:tot?Math.round(dn/tot*100):0}}
function act(d){if(S.log[d]>0)return true;for(var k in S.doneAt)if(S.doneAt[k]===d)return true;return false}
function streak(){var n=0,d=today();if(!act(d))d=addD(d,-1);while(act(d)){n++;d=addD(d,-1);if(n>4000)break}return n}
function totalMin(){var s=0;for(var k in S.log)s+=S.log[k];return s}
function nextUp(){for(var i=0;i<FLAT.length;i++)if(!S.done[FLAT[i].id])return FLAT[i];return null}
function currentStage(){var n=nextUp();return n?n.sid:STAGES[STAGES.length-1].id}
function fmtDate(ds){var p=ds.split('-');var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return p[2]+' '+M[+p[1]-1]+' '+p[0]}

  /* projection */
  var remH=TOT.hours-hrs, daysLeft=S.mins>0?Math.ceil(remH*60/S.mins):0, eta=addD(today(),daysLeft);

function mzhType(el){
  var T=DR.typing; if(!T||T.done)return;
  if(!T.t0){T.t0=Date.now();T.timer=setInterval(mzhTick,250)}
  T.typed=el.value;
  var typed=el.value,target=T.text,t=0,ok=0;
  for(var i=0;i<typed.length;i++){if(typed[i]===target[i]){ok++} }
  var mins=Math.max((Date.now()-T.t0)/60000,1/60);
  T.wpm=Math.round((ok/5)/mins); T.acc=typed.length?Math.round(ok/typed.length*100):100;
  var w=document.getElementById('twpm'),a=document.getElementById('tacc');
  if(w)w.textContent=T.wpm;if(a)a.textContent=T.acc+'%';
  if(typed.length>=target.length){mzhEnd()}
}
function mzhTick(){
  var T=DR.typing;if(!T||T.done)return;
  T.left=Math.max(0,60-Math.floor((Date.now()-T.t0)/1000));
  var e=document.getElementById('tleft');if(e)e.textContent=T.left+'s';

}
function mzhEnd(){
  var T=DR.typing;if(!T||T.done)return;T.done=true;
  if(T.timer){clearInterval(T.timer);T.timer=null}
  var secs=T.t0?Math.round((Date.now()-T.t0)/1000):0;
  if(!secs)secs=1;
  S.drills.push({ts:new Date().toISOString(),mode:'⌨️ typing test',q:T.text.length,ok:(T.typed||'').length,pct:T.acc||0,secs:secs,wpm:T.wpm||0});
  save();paint();toast('Typing test: '+T.wpm+' WPM at '+T.acc+'% accuracy');
}

        else{S.done[id]=true;S.doneAt[id]=today();
          var o=BYID[id],st=stageStat(o.sid);
          if(st.pct===100)toast('🏆 Stage complete: '+o.sname+'! On to the next one.');
          else toast('✓ Mastered: '+o.t.n+'  ('+st.pct+'% of this stage)');}
        save();render();topbar();break}
      case 'togglestage':{var k='s'+id;S.open[k]=!S.open[k];save();el.closest('.stage').classList.toggle('closed');
        var b=el.querySelector('span:last-child');if(b)b.textContent=S.open[k]?'−':'+';break}
      case 'openstage':{VIEW='road';S.open['s'+id]=true;ROADQ='';ROADF='all';save();renderTabs();render();
        setTimeout(function(){var s=document.querySelectorAll('.stage')[STAGES.map(function(x){return x.id}).indexOf(+id)];if(s)s.scrollIntoView({behavior:'smooth',block:'start'})},60);break}
      case 'steps':{S.open[id]=!S.open[id];save();render();break}
      case 'note':{S.open[id]=true;save();render();setTimeout(function(){var t=document.querySelector('[data-tid="'+id+'"] textarea');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.focus()}},60);break}
      case 'filter':ROADF=id;render();break;
      case 'expandall':FLAT.forEach(function(o){S.open[o.id]=true});STAGES.forEach(function(s){S.open['s'+s.id]=true});save();render();toast('All steps expanded — good for printing');break;
      case 'collapseall':S.open={};STAGES.forEach(function(s){if(s.id===currentStage())S.open['s'+s.id]=true});save();render();break;
      case 'acc':{var p=el.parentElement,bd=p.querySelector('.acc-b'),vis=bd.style.display!=='none';bd.style.display=vis?'none':'block';
        var sp=el.querySelector('span:last-child');if(sp)sp.textContent=vis?'+':'−';break}
      case 'jumptopic':{var o=BYID[id];VIEW='road';ROADQ='';ROADF='all';S.open['s'+o.sid]=true;S.open[id]=true;save();renderTabs();render();
        setTimeout(function(){var t=document.querySelector('[data-tid="'+id+'"]');if(t)t.scrollIntoView({behavior:'smooth',block:'center'})},60);break}
      case 'setmins':S.mins=+id;save();render();toast('Plan set to '+id+' minutes a day');break;
      case 'quicklog':addLog(+id);break;
      case 'addlog':{var v=+document.getElementById('logmin').value;if(!v||v<1){toast('Enter the number of minutes first');break}addLog(v);break}
      case 'dellog':delete S.log[id];save();render();toast('Entry removed');break;
      case 'dsub':killSprint();if(DR.typing&&DR.typing.timer){clearInterval(DR.typing.timer);DR.typing.timer=null}DR.sub=id;paint();break;
      case 'dmode':killSprint();DR.mode=id;DR.q=null;DR.i=0;DR.ok=0;DR.streak=0;DR.sq=0;DR.sok=0;DR.sprint=0;paint();break;
      case 'qstart':DR.i=0;DR.ok=0;DR.streak=0;DR.t0=Date.now();DR.fb=null;DR.q=GENQ(DR.mode);paint();break;
      case 'tstart':startTyping();break;
      case 'tquit':mzhEnd();break;
      case 'qclear':DR.q=null;DR.fb=null;paint();break;
      case 'qskip':case 'qshow':qReveal();break;
      case 'sstart':startSprint();break;
      case 'sskip':DR.q=GENQ(DR.mode);DR.fb=null;paint();break;
      case 'frev':DR.rev=!DR.rev;paint();break;
      case 'fgood':DR.okf++;DR.di++;DR.rev=false;paint();break;
      case 'fbad':DR.missf++;DR.missq=DR.missq||[];DR.missq.push(DR.deck[DR.di]);var c=DR.deck.splice(DR.di,1)[0];DR.deck.splice(Math.min(DR.di+2,DR.deck.length),0,c);DR.rev=false;paint();break;
      case 'frestart':DR.deck=[];DR.missq=[];paint();break;
      case 'fmissed':if(DR.missq&&DR.missq.length){DR.deck=DR.missq.slice();DR.missq=[];DR.di=0;DR.okf=0;DR.missf=0;DR.rev=false;paint()}else toast('No missed cards yet');break;
      case 'print':doPrint();break;
      case 'backup':S.lastBackup=today();save();download('math-progress-'+today()+'.json',JSON.stringify(S,null,1),'application/json');toast('Backup saved ✓ keep the .json file safe');render();break;
      case 'exportmd':download('math-roadmap-'+today()+'.md',toMD(),'text/markdown');toast('Roadmap exported as Markdown');break;
      case 'reset':if(confirm('Erase ALL progress, notes and logs? This cannot be undone. Download a backup first if unsure.')){S=JSON.parse(JSON.stringify(DEF));S.start=today();save();VIEW='dash';renderTabs();render();toast('Reset. Fresh start 🐣')}break;
      case 'onbgo':case 'onbskip':S.sonboard=true;save();document.getElementById('modal').classList.remove('on');if(act==='onbgo'){VIEW='road';S.open.s0=true;renderTabs();render();toast('Stage 0 is open. Start with counting 1–100 🚀')}break;
    }
  });
  app.addEventListener('change',function(e){
    var el=e.target.closest('[data-in]');if(!el)return;var k=el.getAttribute('data-in'),id=el.getAttribute('data-id');
    if(k==='tnote'){S.notes[id]=el.value;save();return}
    if(k==='scratch'){S.scratch=el.value;save();return}
    if(k==='lognote'){S.logNote=el.value;save();return}
    if(k==='restore'){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);for(var kk in DEF)if(o[kk]===undefined)o[kk]=DEF[kk];S=o;save();render();toast('Progress restored ✓')}catch(x){toast('That file could not be read')}};r.readAsText(f);return}
    if(k==='mins'){S.mins=Math.max(5,+el.value||45);save();render();return}
    if(k==='name'){S.name=el.value.trim();save();topbar();return}
    if(k==='start'){S.start=el.value;save();render();return}
  });
  var sDebounce=null;
  app.addEventListener('input',function(e){
    var el=e.target.closest('[data-in]');if(!el)return;var k=el.getAttribute('data-in'),id=el.getAttribute('data-id');
    if(k==='tnote'){S.notes[id]=el.value;save();return}
    if(k==='scratch'){S.scratch=el.value;save();return}
    if(k==='lognote'){S.logNote=el.value;save();return}
    if(k==='name'){S.name=el.value.trim();save();topbar();return}
    if(k==='search'){clearTimeout(sDebounce);var val=el.value;sDebounce=setTimeout(function(){ROADQ=val.trim();render();
      var s=document.getElementById('rsearch');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}},220);return}
  });
  app.addEventListener('submit',function(e){
    var f=e.target.closest('form');if(!f)return;e.preventDefault();
    var inp=f.querySelector('input');var v=(inp.value||'').trim();
    if(f.getAttribute('data-form')==='sprint'){
      if(v==='')return;var good=checkAns(v,DR.q);
      DR.sq++;if(good)DR.sok++;DR.sprint=DR.sok-(DR.sq-DR.sok);DR.q=GENQ(DR.mode);DR.fb=null;paint();return}
    if(!v)return;var ok=checkAns(v,DR.q);
    if(ok){DR.ok++;DR.streak=(DR.streak||0)+1}else{DR.streak=0}
    DR.fb={ok:ok,ans:'Answer: '+(DR.q.show||DR.q.a)};paint();
    setTimeout(function(){DR.i++;DR.fb=null;
      if(DR.i>=DR.n){var secs=Math.round((Date.now()-DR.t0)/1000);var pct=Math.round(DR.ok/DR.n*100);
        S.drills.push({ts:new Date().toISOString(),mode:DR.mode,q:DR.n,ok:DR.ok,pct:pct,secs:secs});save()}
      else DR.q=GENQ(DR.mode);
      paint();topbar()},ok?600:1600);
  });
  document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')this.classList.remove('on')});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();if(VIEW!=='road'){VIEW='road';renderTabs();render()}setTimeout(function(){var s=document.getElementById('rsearch');if(s)s.focus()},50)}
    if(e.key==='Escape')document.getElementById('modal').classList.remove('on');
  });
}
function bindExtra(){/* hooks for post-render focus */}
function addLog(m){var d=today();S.log[d]=(S.log[d]||0)+m;
  var n=(document.getElementById('lognote')||{}).value;if(n&&n.trim())S.log[d+'_note']=(S.log[d+'_note']||'')+' '+n.trim();
  save();render();toast('+'+m+' min logged · '+streak()+'-day streak 🔥')}
function download(name,txt,type){var b=new Blob([txt],{type:type||'text/plain'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},400)}
function doPrint(){var prev=VIEW;VIEW='road';ROADQ='';ROADF='all';STAGES.forEach(function(s){S.open['s'+s.id]=true});FLAT.forEach(function(o){S.open[o.id]=true});save();renderTabs();render();
  setTimeout(function(){window.print();S.open={};save();VIEW=prev;renderTabs();render()},250)}
function toMD(){
  var L2=['# Math: Zero → Hero — Complete Roadmap','',
   'Generated '+fmtDate(today())+' · Progress: '+doneCount()+'/'+TOT.topics+' topics ('+Math.round(doneCount()/TOT.topics*100)+'%) · '+doneHours()+' of '+Math.round(TOT.hours)+' hours · Streak: '+streak()+' days',''];
  STAGES.forEach(function(st){var s=stageStat(st.id);
    L2.push('## '+st.t+'  — '+s.pct+'% ('+s.dn+'/'+s.tot+')');L2.push('_'+st.sub+'_');L2.push('');L2.push('> **Goal:** '+st.goal);L2.push('');
    st.mods.forEach(function(m){L2.push('### '+m.t);L2.push('');
      m.topics.forEach(function(t,ti){var id=st.id+'-'+st.mods.indexOf(m)+'-'+ti;
        L2.push('- ['+(S.done[id]?'x':' ')+'] **'+t.n+'**  (~'+t.h+'h)'+(S.doneAt[id]?' — done '+S.doneAt[id]:''));
        t.s.forEach(function(x){L2.push('    - '+x)});
        L2.push('    - ✔ Mastered when: '+t.m);
        if(S.notes[id])L2.push('    - 📝 Note: '+S.notes[id].replace(/\n/g,' '));
        if(t.r&&t.r.length)L2.push('    - 🔗 '+t.r.map(function(r){return '['+r[0]+']('+r[1]+')'}).join(' · '));
        L2.push('')});});});
  if(S.scratch)L2.push('## Scratchpad','',S.scratch,'');
  L2.push('## Study log','', '| Date | Minutes |','|---|---|');
  Object.keys(S.log).filter(function(k){return k.indexOf('_')<0}).sort().reverse().slice(0,60).forEach(function(d){L2.push('| '+d+' | '+S.log[d]+' |')});
  return L2.join('\n');
}

/* ================= BOOT ================= */
renderTabs();render();bind();topbar();
if(!S.sonboard)setTimeout(onb,500);
</script>

  function get(k) { try { return localStorage.getItem(V + '.' + k); } catch (e) { return null; } }
  function today() { try { return window.today(); } catch (e) { return ''; } }
  function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

  /* ---------- toasts (reuse the tracker's) ---------- */
  function toast(msg) {
    try { if (typeof window.toast === 'function') { window.toast(msg); return; } } catch (e) {}
    var el = $('#pwa-toast');
    if (!el) { el = document.createElement('div'); el.id = 'pwa-toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 2500);
  }

  /* ---------- service worker: offline + updates ---------- */
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;   // file:// is already local
    try {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
        window.__swReg = reg;
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              store('updateReady', '1');
              toast('\u2B06\uFE0F Update ready — tap "Check for updates" in Settings');
            }
          });
        });
        if (!get('offlineReady')) {
          store('offlineReady', '1');
          setTimeout(function () { toast('\u2713 Saved for offline use'); }, 4000);
        }
      }).catch(function () {});
    } catch (e) {}
  }

  function checkForUpdates() {
    if (!window.__swReg) { location.reload(); return; }
    window.__swReg.update().then(function () {
      if (get('updateReady')) {
        get('updateReady'); store('updateReady', '');
        if (window.__swReg.waiting) window.__swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
        toast('Updating\u2026');
        setTimeout(function () { location.reload(); }, 700);
      } else {
        toast('\u2713 You already have the latest version');
      }
    }).catch(function () { toast('Could not check right now (offline?)'); });
  }

  /* ---------- keep progress safe ---------- */
  function requestPersistence() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().then(function (granted) { store('persist', granted ? 'granted' : 'denied'); });
      }
    } catch (e) {}
  }
  function persistStatus() {
    var s = get('persist');
    if (s === 'granted') return ['\u2713 On', 'The browser will not clear this app\u2019s data automatically.'];
    if (s === 'denied') return ['Not granted yet', 'Android: Settings \u2192 Apps \u2192 Chrome \u2192 Storage. iPhone: keep the app installed and use it regularly.'];
    return ['\u2026', 'Protection is requested when you first save progress.'];
  }

  function backupJSON() {
    var S = window.S || {};
    return JSON.stringify(S);
  }
  function backupName() { return 'computer-hero-backup-' + (today() || 'today') + '.json'; }

  function saveBackupFile() {
    try {
      if (typeof window.download === 'function') window.download(backupName(), backupJSON(), 'application/json');
      else {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([backupJSON()], { type: 'application/json' }));
        a.download = backupName();
        document.body.appendChild(a); a.click(); a.remove();
      }
      if (window.S) { window.S.lastBackup = today(); if (typeof window.save === 'function') window.save(); }
      toast('Backup saved \u2014 keep the file in Drive \u2713');
      return true;
    } catch (e) { toast('Could not create the backup file'); return false; }
  }

  /* Share the backup through the phone's share sheet → Drive, WhatsApp, Gmail… */
  function shareBackup() {
    var file = null;
    try {
      file = new File([backupJSON()], backupName(), { type: 'application/json' });
    } catch (e) { file = null; }

    if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      navigator.share({
        files: [file],
        title: 'Comp Hero progress backup',
        text: 'My Math: Zero \u2192 Hero progress backup (restore it from Settings \u2192 Restore).'
      }).then(function () {
        if (window.S) { window.S.lastBackup = today(); if (typeof window.save === 'function') window.save(); }
        toast('Shared \u2713 \u2014 save it in Drive');
      }).catch(function () {});
      return;
    }
    if (navigator.share && !file) {                      // text-only fallback
      navigator.share({ title: 'Comp Hero progress', text: progressSummary() }).catch(function () {});
      return;
    }
    saveBackupFile();                                    // last resort: download
    toast('Backup downloaded \u2014 move it to Drive when you get a chance');
  }

  function progressSummary() {
    try {
      var S = window.S, dn = window.doneCount ? window.doneCount() : 0;
      var tot = window.TOT ? window.TOT.topics : 258;
      var st = window.streak ? window.streak() : 0;
      var hrs = window.doneHours ? Math.round(window.doneHours()) : 0;
      var nx = window.nextUp ? window.nextUp() : null;
      return 'Math: Zero \u2192 Hero \u2014 ' + dn + '/' + tot + ' topics (' + Math.round(dn / tot * 100) + '%), ' +
             hrs + ' h done, ' + st + '-day streak' + (nx ? '. Next: ' + nx.t.n : '.') + '\n' + location.href;
    } catch (e) { return location.href; }
  }

  function copyLink() {
    var url = location.href.split('#')[0].split('?')[0];
    var done = function () { toast('Link copied \u2014 paste it on your phone'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link:', url); });
    } else { prompt('Copy this link:', url); }
  }
  function shareLink() {
    var url = location.href.split('#')[0].split('?')[0];
    if (navigator.share) navigator.share({ title: 'Math: Zero \u2192 Hero', text: 'My computer learning app \u2014 install it from here:', url: url }).catch(function () {});
    else copyLink();
  }

  var NAV = [
    ['dash', '\uD83C\uDFE0', 'Home'],

    ['drill', '\u26A1', 'Drill'],
    ['plan', '\uD83D\uDCC5', 'Plan'],

  function buildNav() {
    if ($('.pwa-bottomnav')) return;
    var nav = document.createElement('nav');
    nav.className = 'pwa-bottomnav no-print';
    nav.setAttribute('aria-label', 'Main navigation');
    nav.innerHTML = NAV.map(function (t) {
      return '<button type="button" data-pwa-tab="' + t[0] + '" aria-label="' + t[2] + '">' +
             '<span class="i">' + t[1] + '</span><span class="l">' + t[2] + '</span></button>';
    }).join('');
    document.body.appendChild(nav);
    document.body.classList.add('pwa-nav');
    nav.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pwa-tab]');
      if (!b) return;
      try {
        window.VIEW = b.getAttribute('data-pwa-tab');
        if (typeof window.renderTabs === 'function') window.renderTabs();
        if (typeof window.render === 'function') window.render();
        window.scrollTo(0, 0);
      } catch (err) {}
      syncNav();
    });
    syncNav();
  }

  function syncNav() {
    var nav = $('.pwa-bottomnav');
    if (!nav) return;
    var cur = window.VIEW || 'dash';
    Array.prototype.forEach.call(nav.querySelectorAll('[data-pwa-tab]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-pwa-tab') === cur);
    });
  }

  function hookRenderTabs() {
    if (typeof window.renderTabs !== 'function' || window.renderTabs.__pwa) return false;
    var orig = window.renderTabs;
    var wrapped = function () { var r = orig.apply(this, arguments); try { syncNav(); } catch (e) {} return r; };
    wrapped.__pwa = true;
    window.renderTabs = wrapped;
    return true;
  }

  /* ---------- sheets ---------- */

    wrap.innerHTML = '<div class="pwa-sheet" role="dialog" aria-modal="true"><div class="pwa-sheet-grip"></div>' + html + '</div>';
    document.body.appendChild(wrap);

    return wrap;
  }

  /* ---------- install ---------- */
  var deferred = null;

  function installRowHTML(big) {
    if (standalone) {
      return '<div class="pwa-row"><b class="pwa-ok">\u2713 Installed</b>' +
             '<span class="pwa-mut">You are running the installed app.</span></div>';
    }
    var cls = 'btn pri pwa-btn' + (big ? ' pwa-btn-big' : '');
    if (deferred) {
      return '<button class="' + cls + '" data-pwa="install">\u2B07\uFE0F Install' + (big ? ' the app' : '') + '</button>' +
             '<span class="pwa-mut">One tap \u2014 adds the \u03C0 icon to your home screen.</span>';
    }
    if (isIOS()) {
      return '<button class="' + cls + '" data-pwa="ios">\u2B06\uFE0F Install on iPhone / iPad</button>' +
             '<span class="pwa-mut">Opens the 3-step Add to Home Screen guide.</span>';
    }
    if (isAndroid()) {
      return '<button class="' + cls + '" data-pwa="android">\u2753 Install on Android</button>' +
             '<span class="pwa-mut">Chrome menu \u22EE \u2192 \u201CInstall app\u201D / \u201CAdd to Home screen\u201D.</span>';
    }
    return '<button class="' + cls + '" data-pwa="help">\u2B07\uFE0F How to install</button>' +
           '<span class="pwa-mut">' + (location.protocol === 'file:'
             ? 'Needs the hosted link (or the included local server) to install.'
             : 'Browser menu \u2192 \u201CInstall app\u201D.') + '</span>';
  }

  function installCard() {
    var card = document.createElement('div');
    card.className = 'card pwa-install-card';
    card.id = 'pwa-install-card';
    card.innerHTML = '<h2>\uD83D\uDCF1 Install as a phone app</h2>' +
      '<p class="sub">A real installable app (PWA): home-screen icon, fullscreen, works with no internet. ' +
      'Your progress is saved on this device and installing does not reset it.</p>' +
      '<div class="pwa-row pwa-install-row">' + installRowHTML(false) + '</div>';
    return card;
  }

  function safetyCard() {
    var ps = persistStatus();
    var last = (window.S && window.S.lastBackup) ? window.S.lastBackup : null;
    var card = document.createElement('div');
    card.className = 'card pwa-safety-card';
    card.id = 'pwa-safety-card';
    card.innerHTML =
      '<h2>\uD83D\uDD12 Save my progress</h2>' +
      '<p class="sub">Ticks, notes, streaks and drill history are stored on this phone (offline storage) and saved after every change. ' +
      'A backup file is your safety net if you change phones or clear the browser.</p>' +
      '<div class="pwa-kv"><span>Storage protection</span><b>' + ps[0] + '</b></div>' +
      '<div class="pwa-kv"><span>Last backup</span><b>' + (last ? window.fmtDate(last) : 'never') + '</b></div>' +
      '<p class="pwa-mut" style="margin:6px 0 10px">' + ps[1] + '</p>' +
      '<div class="row">' +
        '<button class="btn pri" data-pwa="sharebackup">\uD83D\uDCE4 Share backup \u2192 Drive / WhatsApp</button>' +
        '<button class="btn" data-pwa="backup">\u2B07\uFE0F Download backup</button>' +
      '</div>' +
      '<div class="row" style="margin-top:10px">' +
        '<button class="btn ghost" data-pwa="sharelink">\uD83D\uDD17 Share this app</button>' +
        '<button class="btn ghost" data-pwa="copylink">\uD83D\uDCCB Copy app link</button>' +
        '<button class="btn ghost" data-pwa="checkupdate">\u21BB Check for updates</button>' +
      '</div>';
    return card;
  }

  function refreshInstall() {
    var row = $('#pwa-install-card .pwa-install-row');
    if (row) row.innerHTML = installRowHTML(false);
    var heroRow = $('#pwa-hero-card .pwa-install-row');
    if (heroRow) heroRow.innerHTML = installRowHTML(true);
  }

  function showInstallSheet() {
    var steps = isIOS()
      ? [['1', 'Tap the <b>Share</b> button (the square with an arrow) in Safari\u2019s toolbar.'],
         ['2', 'Scroll down, tap <b>Add to Home Screen</b>.'],
         ['3', 'Tap <b>Add</b>. The \u03C0 icon appears with your other apps \u2014 open it like any app.']]
      : [['1', 'Open the browser menu (\u22EE in Chrome, \u2261 in Firefox).'],
         ['2', 'Tap <b>Install app</b> or <b>Add to Home screen</b>.'],
         ['3', 'Confirm. The \u03C0 icon lands on your home screen and opens fullscreen.']];
    sheet('pwa-how', '<h3>Install \u03C0 on your phone</h3>' +
      '<ol class="pwa-steps">' + steps.map(function (s) { return '<li><b>' + s[0] + '.</b> ' + s[1] + '</li>'; }).join('') + '</ol>' +
      '<p class="pwa-note">Works offline once installed. Your progress stays on your phone \u2014 installing never touches it.</p>' +
      '<button class="btn pri pwa-btn" data-pwa="close">Got it</button>');
  }

  function offerInstall() {
    if (!deferred) { showInstallSheet(); return; }
    deferred.prompt();
    deferred.userChoice.then(function (res) {
      if (res && res.outcome === 'accepted') toast('Installing\u2026 \uD83C\uDF89');
      deferred = null;
      refreshInstall();
      closeSheet('pwa-install-banner');
      closeSheet('pwa-hero-install');
    }).catch(function () {});
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    refreshInstall();
    tryBanner();
  });
  window.addEventListener('appinstalled', function () {
    store('installed', '1');
    closeSheet('pwa-install-banner');
    removeHeroInstall();
    toast('Installed \uD83C\uDF89 Open \u03C0 from your home screen');
    refreshInstall();
  });

  /* the app's own install card should disappear once installed */
  function removeHeroInstall() {
    var h = document.getElementById('pwa-hero-install');
    if (h) h.remove();
  }

  /* ---------- install banner (bottom, non-blocking) ---------- */
  function bannerBlocked() {
    if (standalone) return true;
    if (isInAppBrowser()) return true;      /* the in-app rescue banner handles this case */
    if (get('installed')) return true;
    if (get('bannerDismissed')) return true;
    if (!isPhone()) return true;
    var ob = document.getElementById('modal');
    if (ob && ob.classList.contains('on')) return true;      // onboarding is open
    if (document.getElementById('pwa-install-banner')) return true;
    return false;
  }

  /* ---------- onboarding: put install in front of the user ---------- */
  function hookOnboarding() {
    var i = document.getElementById('modal-in');
    var m = document.getElementById('modal');
    if (!i || !m || !m.classList.contains('on')) return;
    if (i.querySelector('#pwa-onb-install')) return;
    var row = document.createElement('div');
    row.id = 'pwa-onb-install';
    row.className = 'pwa-onb-install';
    row.innerHTML = '<div class="pwa-row pwa-install-row">' + installRowHTML(true) + '</div>';
    i.appendChild(row);
  }

  /* ---------- settings injection ---------- */
  function injectInto(container) {
    if (container.querySelector('#pwa-install-card')) { refreshInstall(); return; }
    container.appendChild(installCard());
    container.appendChild(safetyCard());
  }

  var moTimer = null;
  function scanViews() {
    heroInstall();
    hookOnboarding();
    var app = document.getElementById('app');
    if (!app) return;
    if (document.getElementById('pwa-install-card')) { refreshInstall(); return; }
    if (/Settings & (amp;)?your data/.test(app.textContent)) injectInto(app);
  }
  var mo = new MutationObserver(function (records) {
    for (var i = 0; i < records.length; i++) {
      var t = records[i].target;
      if (t && t.closest && (t.closest('.pwa-bottomnav') || t.closest('#pwa-install-card') || t.closest('#pwa-hero-install'))) continue;
      clearTimeout(moTimer);
      moTimer = setTimeout(scanViews, 200);
      return;
    }
  });

  /* ---------- clicks ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-pwa]');
    if (!el) return;
    var act = el.getAttribute('data-pwa');
    if (act === 'install') offerInstall();
    else if (act === 'openchrome') openInChrome();
    else if (act === 'dismiss-inapp') { store('inappDismissed', '1'); var ib = document.getElementById('pwa-inapp'); if (ib) ib.remove(); }
    else if (act === 'ios' || act === 'android' || act === 'help') showInstallSheet();
    else if (act === 'close') closeSheet('pwa-how');
    else if (act === 'backup') saveBackupFile();
    else if (act === 'sharebackup') shareBackup();
    else if (act === 'copylink') copyLink();
    else if (act === 'sharelink') shareLink();
    else if (act === 'checkupdate') checkForUpdates();
    else if (act === 'dismiss-banner') { store('bannerDismissed', '1'); closeSheet('pwa-install-banner'); }
    else if (act === 'dismiss-hero') { store('heroDismissed', '1'); removeHeroInstall(); }
  });

  /* ---------- home-screen shortcuts: ?go=plan / ?go=drill / ?go=road ---------- */
  function applyDeepLink() {
    var want = null;
    try { var p = new URLSearchParams(location.search); want = p.get('go') || p.get('tab'); } catch (e) {}
    if (!want) return false;
    if (!NAV.some(function (t) { return t[0] === want; })) return false;
    try {
      window.VIEW = want;
      if (typeof window.renderTabs === 'function') window.renderTabs();
      if (typeof window.render === 'function') window.render();
    } catch (e) { return false; }
    syncNav();
    return true;
  }

  /* ---------- boot ---------- */
  function boot() {
    buildNav();
    try { inAppBanner(); } catch (e) {}
    applyDeepLink();
    try { registerSW(); } catch (e) {}
    try { requestPersistence(); } catch (e) {}
    hookRenderTabs();
    scanViews();
    mo.observe(document.body, { childList: true, subtree: true });

    /* the install ask: hero immediately, banner as soon as onboarding is out of the way */
    setTimeout(scanViews, 600);
    var tries = 0;
    var t = setInterval(function () {
      tries++;
      scanViews();
      tryBanner();
      if ((deferred || isIOS()) && tries > 40) clearInterval(t);   // ~1 min of trying, then stop
    }, 1500);

    setInterval(syncNav, 1500);
    setInterval(scanViews, 4000);

    window.addEventListener('online', function () { toast('\u2713 Back online'); });
    window.addEventListener('offline', function () { toast('\u2708\uFE0F Offline \u2014 the app keeps working'); });

    /* belt-and-braces save when the app goes to the background (phones kill tabs) */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { try { window.save && window.save(); } catch (e) {} }
    });
  }

  var build = document.querySelector('meta[name="app-build"]');
  if (build) console.log('Comp Hero app build ' + build.getAttribute('content'));

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
