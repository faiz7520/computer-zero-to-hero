<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Computer: Zero → Hero · Your personal tracker</title>
<style>
:root{
  --bg:#070b16; --bg2:#0b1120; --card:#0f1728; --card2:#131e33; --line:#1e2b45; --line2:#2a3a58;
  --txt:#e8eefc; --mut:#93a4c3; --dim:#64748f;
  --acc:#10b981; --acc2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --grad:linear-gradient(135deg,#10b981,#22d3ee);
  --r:16px; --rs:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:
 radial-gradient(900px 520px at 8% -8%,rgba(16,185,129,.22),transparent 62%),
 radial-gradient(760px 460px at 96% 0%,rgba(34,211,238,.15),transparent 60%),
 radial-gradient(680px 520px at 50% 115%,rgba(168,85,247,.12),transparent 60%);
 pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;opacity:.55}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 90px}
header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(7,11,22,.82);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#06121f;font-size:15px;flex:0 0 auto}
.brand small{display:block;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.topbar{flex:1 1 320px;min-width:220px;height:34px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 12px;display:flex;align-items:center;gap:10px}
.topbar .bar{flex:1;height:8px;background:#0a1120;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.topbar .bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.topbar b{font-size:12px;color:var(--txt);white-space:nowrap}
nav.tabs{position:sticky;top:55px;z-index:35;display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin:0 -2px;scrollbar-width:none;background:linear-gradient(180deg,rgba(7,11,22,.96),rgba(7,11,22,.72) 70%,transparent)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.16s}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{background:var(--grad);color:#06121f;border-color:transparent}
main{padding-top:14px}
h1{font-size:clamp(24px,4vw,36px);line-height:1.15;margin:6px 0 8px;letter-spacing:-.03em}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
h3{font-size:16px;margin:0}
.sub{color:var(--mut);margin:0 0 18px;max-width:76ch}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:linear-gradient(135deg,rgba(99,102,241,.20),rgba(34,211,238,.10)),linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:20px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%)}
.hero .tagline{color:var(--acc2);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:16px 0}
.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.stat.good .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.acc .n{color:var(--acc2)}
.btn{border:1px solid var(--line2);background:var(--card2);color:var(--txt);padding:10px 15px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.16s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-1px);border-color:var(--acc)}
.btn.pri{background:var(--grad);border-color:transparent;color:#06121f}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.ghost{background:transparent}
.btn.dang{border-color:rgba(251,113,133,.4);color:#fecdd3}
.btn.dang:hover{background:rgba(251,113,133,.14)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:#0a1120;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}
.stage{border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden;background:linear-gradient(180deg,rgba(19,30,51,.7),rgba(15,23,40,.7))}
.stage-h{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;user-select:none;background:transparent;border:0;width:100%;text-align:left;color:inherit;font:inherit}
.stage-h:hover{background:rgba(99,102,241,.07)}
.emo{font-size:22px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#0a1120;border:1px solid var(--line2);flex:0 0 auto}
.stage-h .mid{flex:1;min-width:0}
.stage-h .t{font-weight:800;letter-spacing:-.02em;font-size:16px}
.stage-h .d{color:var(--dim);font-size:12.5px}
.pill{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);background:#0a1120;color:var(--mut);white-space:nowrap}
.pill.done{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:#a7f3d0}
.pill.now{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.45);color:#fde68a}
.stage-b{padding:0 16px 16px;border-top:1px solid var(--line)}
.goal{background:rgba(99,102,241,.09);border:1px solid rgba(99,102,241,.3);border-left:3px solid var(--acc);padding:11px 13px;border-radius:11px;margin:14px 0;font-size:13.5px;color:#dbe4ff}
.mod{margin:14px 0 0}
.mod-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mod-h .mt{font-weight:800;font-size:14.5px;letter-spacing:-.01em}
.mod-h .bar{flex:1;min-width:60px}
.topic{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:rgba(10,17,32,.55);transition:.16s}
.topic:hover{border-color:var(--line2)}
.topic.done{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.28)}
.topic.done .tname{text-decoration:line-through;color:var(--mut)}
.cbx{appearance:none;width:22px;height:22px;border:2px solid var(--line2);border-radius:7px;background:#0a1120;cursor:pointer;flex:0 0 auto;margin-top:2px;position:relative;transition:.15s}
.cbx:hover{border-color:var(--acc2)}
.cbx:checked{background:var(--ok);border-color:var(--ok)}
.cbx:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#04150e;font-weight:900;font-size:14px}
.tmain{flex:1;min-width:0}
.tname{font-weight:700;font-size:14px}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.tmeta span{font-size:11px;color:var(--dim)}
.tmeta .hrs{color:var(--acc2);font-weight:700}
.tact{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.mini{border:1px solid var(--line);background:#0a1120;color:var(--mut);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}
.mini:hover{color:var(--txt);border-color:var(--acc2)}
.mini.on{background:rgba(99,102,241,.2);border-color:var(--acc);color:#c7d2fe}
.steps{margin-top:10px;padding:12px;border-radius:11px;background:#08130f;border:1px dashed var(--line2)}
.steps ol{margin:0 0 8px;padding-left:20px}
.steps li{margin:5px 0;font-size:13.5px;color:#d5ddf0}
.mastery{font-size:13px;color:#fde68a;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.25);border-radius:9px;padding:8px 10px;margin:8px 0}
.mastery b{color:#fff}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:11.5px;color:var(--acc2);text-decoration:none;border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.08);padding:4px 9px;border-radius:999px}
.links a:hover{background:rgba(34,211,238,.2)}
textarea.note{width:100%;margin-top:8px;background:#08130f;border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:56px;resize:vertical}
input[type=text],input[type=number],input[type=date],select{background:#08130f;border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(99,102,241,.55);outline-offset:1px}
input[type=checkbox]{accent-color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.qbox{text-align:center;padding:18px 14px}
.qtext{font-size:clamp(28px,7vw,46px);font-weight:800;letter-spacing:-.02em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0 14px}
.ans{width:min(280px,100%);font-size:22px;text-align:center;font-family:ui-monospace,monospace;letter-spacing:.04em}
.scorerow{display:flex;justify-content:space-between;gap:10px;color:var(--mut);font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);background:#0a1120;color:var(--mut);padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on{background:rgba(99,102,241,.2);border-color:var(--acc);color:#c7d2fe}
.flash{min-height:130px;display:grid;place-items:center;background:#08130f;border:1px dashed var(--line2);border-radius:14px;padding:16px;cursor:pointer}
.flash .q{font-size:26px;font-weight:800;font-family:ui-monospace,monospace}
.flash .a{font-size:30px;font-weight:800;color:var(--ok)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:5px}
.hd{aspect-ratio:1;border-radius:4px;background:#0a1120;border:1px solid var(--line)}
.hd.l1{background:rgba(52,211,153,.28);border-color:transparent}
.hd.l2{background:rgba(52,211,153,.55);border-color:transparent}
.hd.l3{background:rgba(52,211,153,.9);border-color:transparent}
.hd.today{outline:2px solid var(--acc2)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tbl tr:hover td{background:rgba(99,102,241,.05)}
.acc-h{display:flex;gap:12px;align-items:center;width:100%;background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;padding:14px 0;text-align:left}
.acc-h .emo{width:38px;height:38px;font-size:19px}
.acc-b{padding:0 0 14px 0}
.acc-b h4{margin:14px 0 6px;font-size:13px;color:var(--acc2);text-transform:uppercase;letter-spacing:.08em}
.acc-b ul{margin:6px 0;padding-left:20px}
.acc-b li{margin:6px 0;font-size:14px}
.acc-b a{color:#a5b4fc;text-decoration:none;border-bottom:1px dotted rgba(165,180,252,.5);word-break:break-all}
.acc-b a:hover{color:#fff}
.acc-b code{background:#0a1120;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12.5px;color:#a5f3fc}
.empty{color:var(--dim);font-size:14px;padding:16px;text-align:center}
.searchbar{position:relative;flex:1;min-width:180px}
.searchbar input{width:100%;padding-left:34px}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
footer{color:var(--dim);font-size:12px;text-align:center;padding:26px 0 8px;border-top:1px solid var(--line);margin-top:26px}
.modal-bg{position:fixed;inset:0;background:rgba(3,6,14,.82);backdrop-filter:blur(6px);display:none;z-index:80;padding:18px;overflow:auto}
.modal-bg.on{display:grid;place-items:center}
.modal{max-width:560px;width:100%;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:20px;padding:22px}
.kbd{border:1px solid var(--line2);background:#0a1120;border-radius:6px;padding:1px 7px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#0b1a14;border:1px solid rgba(52,211,153,.5);color:#bbf7d0;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;transition:.28s;z-index:90;pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wk{border:1px solid var(--line);border-radius:13px;padding:12px;background:rgba(10,17,32,.6)}
.wk .wh{font-weight:800;font-size:13.5px;color:var(--acc2);margin-bottom:5px}
.wk ul{margin:0;padding-left:17px;font-size:13px;color:var(--mut)}
.wk li{margin:3px 0}
@media(max-width:640px){
  .wrap{padding:0 11px 70px}
  .top-in{padding:9px 11px;gap:10px}
  .brand small{display:none}
  nav.tabs{top:52px;padding:9px 2px}
  .tab{padding:11px 15px;font-size:13.5px}
  h1{font-size:23px}
  .hero{padding:16px 14px;border-radius:16px}
  .card{padding:14px}
  .stats{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:12px}
  .stat .n{font-size:22px}
  .cbx{width:30px;height:30px;border-radius:9px;margin-top:1px}
  .cbx:checked::after{font-size:18px}
  .topic{padding:13px 11px;gap:12px}
  .tname{font-size:14.5px}
  .btn{padding:12px 16px;font-size:14px}
  .btn.sm{padding:10px 13px;font-size:12.5px}
  .mini{width:38px;height:38px}
  .chip{padding:10px 14px;font-size:13px}
  .ans{font-size:26px;padding:14px;width:100%}
  .qtext{font-size:34px}
  .flash{min-height:160px}
  .flash .q{font-size:23px}
  .flash .a{font-size:27px}
  textarea.note{font-size:14px;min-height:74px}
  input[type=text],input[type=number],input[type=date],select{padding:12px;font-size:16px}
  .stage-h{padding:13px 11px;gap:10px}
  .emo{width:38px;height:38px;font-size:19px}
  .stage-h .t{font-size:15px}
  .heat{grid-template-columns:repeat(15,1fr);gap:4px}
  .tbl th,.tbl td{padding:11px 8px;font-size:13px}
  .steps li{font-size:14px}
  .toast{left:12px;right:12px;transform:translateY(20px);bottom:16px;text-align:center;border-radius:14px}
  .toast.on{transform:translateY(0)}
}
@media print{
  body{background:#fff;color:#000} body::before,body::after{display:none}
  header.top,nav.tabs,.no-print,.toast,.modal-bg{display:none!important}
  .card,.stage,.topic,.stat{background:#fff!important;border-color:#ccc!important;color:#000!important}
  .stage-b{display:block!important} .steps{display:block!important;background:#fafafa!important}
  .tname,.stage-h .t,.stat .n,h1,h2,h3{color:#000!important}
  .sub,.stage-h .d,.tmeta span,.acc-b li{color:#333!important}
  .goal{background:#f3f4ff!important;color:#111!important}
  a{color:#0b3bd6!important}
}

/* ================= PWA / phone-app shell ================= */
:root{--navh:62px}
html,body{overscroll-behavior-y:contain}
body{-webkit-tap-highlight-color:transparent}
button,.tab,.mini,.chip,.topic-h,.stage-h{touch-action:manipulation}

/* --- bottom tab bar (phones) --- */
.pwa-bottomnav{display:none}
@media(max-width:820px){
  body.pwa-nav .pwa-bottomnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:linear-gradient(180deg,rgba(11,17,32,.88),rgba(7,11,22,.98));
    -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
    border-top:1px solid var(--line);
    padding:5px 3px calc(5px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 30px rgba(0,0,0,.45)
  }
  .pwa-bottomnav button{
    flex:1 1 0;min-width:0;background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;transition:.15s
  }
  .pwa-bottomnav button .i{font-size:19px;line-height:1;filter:grayscale(.35) opacity(.85)}
  .pwa-bottomnav button .l{font-size:9.5px;font-weight:700;letter-spacing:.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pwa-bottomnav button.on{color:var(--txt);background:rgba(16,185,129,.18)}
  .pwa-bottomnav button.on .i{filter:none;transform:translateY(-1px)}
  .pwa-bottomnav button.on .l{color:var(--acc2)}
  /* the old horizontally-scrolling tab strip is replaced by the bottom bar */
  body.pwa-nav nav.tabs{display:none}
  .wrap{padding-bottom:calc(var(--navh) + 46px + env(safe-area-inset-bottom))}
  main{padding-top:8px}
  /* thumb-friendly spacing */
  .topic{padding:14px 12px}
  .btn{padding:13px 17px}
  .cbx{width:32px;height:32px}
}
@media(max-width:400px){
  .pwa-bottomnav button .l{font-size:9px}
  .pwa-bottomnav button .i{font-size:18px}
}

/* installed / standalone: use the notch area properly */
@media(display-mode:standalone){
  header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0}
  .wrap{padding-top:2px}
  body::before{opacity:.85}
}

/* --- install card inside Settings --- */
.pwa-install-card{border-color:rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(34,211,238,.06),rgba(10,17,32,.7))}
.pwa-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pwa-install-row{margin-top:10px}
.pwa-mut{font-size:12.5px;color:var(--dim)}
.pwa-ok{color:var(--ok)}
.pwa-btn{width:auto}

/* --- banners (install + backup) --- */
.pwa-banner{
  position:fixed;left:10px;right:10px;bottom:calc(var(--navh,62px) + 14px + env(safe-area-inset-bottom));z-index:80;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#141f36,#0d1526);border:1px solid var(--line2);border-radius:16px;
  padding:10px 12px;box-shadow:0 18px 40px rgba(0,0,0,.5);
  transform:translateY(26px);opacity:0;transition:.32s cubic-bezier(.2,.8,.2,1)
}
.pwa-banner.on{transform:translateY(0);opacity:1}
.pwa-banner img{border-radius:10px;flex:0 0 auto}
.pwa-banner-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.pwa-banner-t b{font-size:13.5px}
.pwa-banner-t span{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwa-x{background:none;border:0;color:var(--dim);font-size:15px;padding:6px;cursor:pointer;flex:0 0 auto}
.pwa-go{
  flex:0 0 auto;border:0;border-radius:11px;padding:10px 15px;font-weight:800;font-size:12.5px;cursor:pointer;
  background:var(--grad);color:#06121f
}
.pwa-nudge{border-color:rgba(251,191,36,.35)}
.pwa-nudge .pwa-go{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#241a02}

/* --- bottom sheet --- */
.pwa-sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(3,6,14,.62);display:flex;align-items:flex-end;justify-content:center}
.pwa-sheet{
  width:100%;max-width:560px;background:#0d1526;border:1px solid var(--line2);border-radius:20px 20px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)
}
@media(min-width:620px){.pwa-sheet{border-radius:20px;margin-bottom:40px}}
@keyframes sheetUp{from{transform:translateY(40px)}to{transform:translateY(0)}}
.pwa-sheet-grip{width:44px;height:4px;border-radius:99px;background:var(--line2);margin:4px auto 12px}
.pwa-sheet h3{margin:0 0 10px;font-size:18px}
.pwa-steps{margin:0;padding-left:20px;font-size:14px;color:var(--mut)}
.pwa-steps li{margin:8px 0}
.pwa-steps b{color:var(--txt)}
.pwa-note{font-size:12.5px;color:var(--dim);margin:14px 0 0}

/* --- misc --- */
#pwa-toast{position:fixed;left:12px;right:12px;bottom:calc(var(--navh,62px) + 90px);z-index:95;text-align:center;
  background:#131e33;border:1px solid var(--line2);color:var(--txt);padding:11px 14px;border-radius:14px;font-size:13.5px;
  opacity:0;transform:translateY(14px);transition:.22s;pointer-events:none}
#pwa-toast.on{opacity:1;transform:translateY(0)}
@media print{.pwa-bottomnav,.pwa-banner,.pwa-sheet-bg,#pwa-toast,.pwa-install-card{display:none!important}}

/* ================= v2: install-first additions ================= */

/* --- big install hero on the dashboard --- */
.pwa-hero-install{
  border-color:rgba(34,211,238,.45);
  background:linear-gradient(135deg,rgba(16,185,129,.16),rgba(34,211,238,.10) 55%,rgba(10,17,32,.75));
  box-shadow:0 14px 34px rgba(6,12,26,.5)
}
.pwa-hero-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pwa-hero-top img{border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.pwa-hero-top div{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.pwa-hero-top b{font-size:16px;letter-spacing:-.01em}
.pwa-hero-top span{font-size:12.5px;color:var(--mut)}
.pwa-hero-install .pwa-mut{font-size:12.5px}
.pwa-btn-big{font-size:15px;padding:14px 20px;border-radius:14px;box-shadow:0 10px 24px rgba(34,211,238,.22)}

/* --- install row inside the onboarding popup --- */
.pwa-onb-install{
  border-top:1px solid var(--line);margin-top:16px;padding-top:14px
}
.pwa-onb-install .pwa-install-row{margin-top:0}

/* --- progress-safety card --- */
.pwa-safety-card{border-color:rgba(52,211,153,.32);background:linear-gradient(180deg,rgba(52,211,153,.06),rgba(10,17,32,.72))}
.pwa-kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--mut);padding:7px 0;border-bottom:1px dashed var(--line)}
.pwa-kv b{color:var(--txt)}
.pwa-kv:last-of-type{border-bottom:0}
@media(max-width:640px){
  .pwa-hero-top b{font-size:15px}
  .pwa-btn-big{width:100%;text-align:center}
  .pwa-safety-card .btn{width:100%}
  .pwa-safety-card .row{flex-direction:column}
}

/* --- in-app browser rescue banner (WhatsApp/Instagram) --- */
.pwa-inapp{border-color:rgba(251,191,36,.45);background:linear-gradient(180deg,#1d1a10,#150f0a)}
.pwa-inapp .pwa-go{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#241a02}

var STAGES=[{"id":0,"emo":"🖥️","t":"Stage 0 · Absolute Beginner","sub":"What a computer is, mouse & keyboard, typing, files, first real tasks","goal":"You can switch a computer on, use the mouse and keyboard without panic, type without hunting for keys, find and organise your own files, take a screenshot, print, install an app, and fix the five most common everyday problems. Everything else sits on this.","mods":[{"t":"Meet the machine","topics":[{"n":"What a computer actually is","h":2,"s":["A computer does four things: takes input, processes it, stores it, gives output. Write those four words on paper.","Find them in real life: you (typing) = input, the chip = processing, the disk = storage, the screen = output.","Say out loud what part does what while you use a phone or laptop for 10 minutes."],"m":"You can explain input → process → storage → output using your own machine as the example.","r":[["GCFGlobal — free computer tutorials","https://edu.gcfglobal.org/en/topics/computerbasics/"]]},{"n":"Types of computers: desktop, laptop, tablet, phone, server","h":2,"s":["Learn the difference: desktop (fixed, powerful, cheap to upgrade), laptop (portable, battery), tablet/phone (touch), server (a computer that serves other computers).","Look at the machines in your home and name the type of each.","Understand that a smartphone IS a computer — same four jobs, smaller."],"m":"You can name a machine's type and guess who it is best for.","r":[["GCFGlobal — free computer tutorials","https://edu.gcfglobal.org/en/topics/computerbasics/"]]},{"n":"The parts inside: CPU, RAM, storage, motherboard, GPU","h":3,"s":["Learn what each does: CPU = thinks, RAM = short-term memory while working, storage = long-term memory, motherboard = the board everything plugs into, GPU = draws images and video.","Open Task Manager (Ctrl+Shift+Esc) and watch CPU / Memory / Disk move while you open apps.","Remember the analogy: CPU = cook, RAM = kitchen counter, storage = fridge, GPU = the artist."],"m":"You can point to each part in Task Manager and say what it does, using the kitchen analogy.","r":[["GCFGlobal — free computer tutorials","https://edu.gcfglobal.org/en/topics/computerbasics/"]]},{"n":"Input and output devices","h":3,"s":["List input devices: keyboard, mouse, touchpad, microphone, webcam, scanner, touchscreen.","List output devices: monitor, speakers, headphones, printer, projector.","Sort 12 real devices at home into input / output / both (touchscreen is both)."],"m":"You can classify any device you meet as input, output, or both, and say why.","r":[["GCFGlobal — free computer tutorials","https://edu.gcfglobal.org/en/topics/computerbasics/"]]},{"n":"Ports and cables: USB, HDMI, charging, audio, Ethernet","h":3,"s":["Learn the shapes: USB-A, USB-C, micro-USB, HDMI, 3.5mm audio, Ethernet (RJ45), power.","Find each port on your own computer or phone and say what it is for.","Practise plugging and unplugging a USB drive and a charger gently — never force a plug."],"m":"You can identify every port on your machine and pick the right cable for a job.","r":[["GCFGlobal — free computer tutorials","https://edu.gcfglobal.org/en/topics/computerbasics/"]]},{"n":"Switching on, logging in, shutting down safely","h":3,"s":["Practise the correct order: press power → wait → log in with password/PIN → use → Start menu → Shut down.","Learn why you never cut power directly: unsaved work is lost and files can be corrupted.","Learn restart vs shutdown vs sleep: restart fixes most problems, sleep saves battery, shutdown saves power."],"m":"You can start, log into, restart and shut down any computer the safe way, and explain why sleep ≠ shutdown.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]}]},{"t":"Mouse, keyboard & typing","topics":[{"n":"Mouse skills: click, double-click, right-click, drag, scroll","h":3,"s":["Learn the five moves: single click = select, double-click = open, right-click = menu of options, drag = move things, scroll wheel = move the page.","Practise on the desktop: open a folder (double-click), rename a file (right-click), move a window (drag).","Play any mouse-practice game or solitaire for 20 minutes — it is genuinely good training."],"m":"All five mouse actions are automatic, and you know that right-click is where the hidden options live.","r":[["Mouse & keyboard basics","https://edu.gcfglobal.org/en/computerbasics/"]]},{"n":"Keyboard tour: every key and what it does","h":4,"s":["Group the keyboard in your head: letters, number row, Enter, Space, Backspace, Delete, Shift, Caps Lock, Tab, Esc, arrow keys, Windows/⌘ key.","Learn the modifier keys: Shift = one capital, Caps Lock = ALL CAPS until pressed again, Ctrl and Alt = used with other keys.","Deliberately use Tab, Esc and the arrows in real apps today instead of the mouse."],"m":"You can name any key's job, and you know the difference between Backspace and Delete.","r":[["Mouse & keyboard basics","https://edu.gcfglobal.org/en/computerbasics/"]]},{"n":"Typing: posture, home row and blind typing","h":6,"s":["Sit straight, wrists floating, eyes on the screen. Place fingers on the home row: ASDF (left) JKL; (right).","Do 15 minutes a day on a typing site: first letters, then words. Do NOT look at your hands.","Cover your hands with a cloth for 5 minutes a day to force touch-typing."],"m":"You type all letters without looking at the keyboard, at any speed.","r":[["TypingClub — free touch-typing course","https://www.typingclub.com/"],["keybr.com — typing practice","https://www.keybr.com/"]]},{"n":"Typing: reaching 30–40 words per minute","h":20,"s":["Do 15–20 minutes of typing practice every single day for a month. Consistency beats marathon sessions.","Track your speed weekly. 30 WPM is comfortable, 40 WPM is professionally fast, 60 is excellent.","Type real things: your notes, WhatsApp replies, and the drill sentences in this app."],"m":"You type 30+ WPM with 95%+ accuracy on a normal English passage.","r":[["keybr.com — typing practice","https://www.keybr.com/"],["10FastFingers — typing speed test","https://10fastfingers.com/"]]},{"n":"Shortcut keys 101: Ctrl+C, Ctrl+V, Ctrl+Z, Ctrl+S, Ctrl+F","h":3,"s":["Learn the five that change your life: Copy, Paste, Undo, Save, Find. Left hand on Ctrl, right hand on the letter.","Learn Ctrl+X (cut), Ctrl+A (select all), Ctrl+P (print), Ctrl+W (close tab).","Use shortcuts ONLY (no mouse menu) for one full hour of work today."],"m":"You use the ten most common shortcuts without thinking, and you press Ctrl+S out of pure habit.","r":[["Keyboard shortcut reference","https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"]]},{"n":"Text editing and the clipboard in real apps","h":3,"s":["Select text: click-drag, double-click a word, triple-click a paragraph, Ctrl+A for everything.","Clipboard: copy vs cut, and how to paste as plain text (Ctrl+Shift+V) to avoid weird formatting.","Practise in a real editor: move a paragraph, fix a typo, undo, redo, then save."],"m":"You can rearrange any text quickly with selection + cut/paste, and you know why plain-text paste exists.","r":[["Keyboard shortcut reference","https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"]]}]},{"t":"Desktop, windows & files","topics":[{"n":"The desktop, Start menu, taskbar and system tray","h":3,"s":["Learn the four zones: desktop (your worktop), Start/search (everything), taskbar (what is running), tray (clock, volume, Wi-Fi, battery).","Pin your 5 most-used apps to the taskbar; unpin the junk that came preinstalled.","Use the Start menu search to open anything: type the first three letters of an app or file."],"m":"You launch anything in under 3 seconds using search, and you know what lives in the tray.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Windows: minimise, maximise, snap, switch, close","h":3,"s":["Learn the three top-right buttons: − minimise, □ maximise, ✕ close. Learn Alt+Tab to switch apps.","Snap windows: drag a window to the left/right edge, or press Win+←/→ to work with two things side by side.","Work with two windows side by side for 15 minutes: notes on one side, browser on the other."],"m":"You arrange and switch windows without touching the mouse, and you always know which window is active.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Files & folders: create, rename, move, copy, delete","h":5,"s":["Learn the tree: This PC → drive → folder → subfolder → file. Create your own structure: Documents → Study → Computer.","Practise: create 3 folders, make 3 files, rename them, move one into another, copy one, delete one (and restore it from the Recycle Bin).","Learn the difference: Move (Ctrl+X then Ctrl+V) vs Copy (Ctrl+C then Ctrl+V) vs Delete (goes to Recycle Bin)."],"m":"You build and reorganise a folder tree confidently, and you can always find what you just saved.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"File extensions & icons: .jpg, .pdf, .docx, .mp3, .exe","h":4,"s":["Turn on file extensions in File Explorer → View → File name extensions. Now you can SEE the truth.","Learn the big ten: .jpg/.png (image), .mp3/.wav (audio), .mp4 (video), .pdf (fixed document), .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .zip (compressed), .exe (program), .txt (plain text).","Look at 15 files on your computer and predict what app opens each before you click."],"m":"You identify a file's type from its extension and know which app will open it.","r":[["Keyboard shortcut reference","https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"]]},{"n":"USB pen drives & memory cards: copy, eject, keep data safe","h":3,"s":["Insert the drive, open it from This PC, and copy a folder across. Watch the progress bar finish before removing.","ALWAYS eject safely: click the USB icon in the tray → Eject, then unplug. Yanks corrupt files.","Understand the danger: any USB drive from outside can contain malware — scan before opening its contents."],"m":"You move files to a pen drive and eject it safely — every time, without losing a byte.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Finding things: search the computer and the web","h":3,"s":["Search your own PC: Start → type a file name, or use File Explorer's search box in a folder.","Learn wildcards: *.pdf finds all PDFs; report* finds files starting with 'report'.","Search the web properly: type a full question, add the word 'Windows' or the app name to get exact answers."],"m":"You can find any file on your computer in under 30 seconds, and any answer online in one search.","r":[["Internet Basics — GCFGlobal","https://edu.gcfglobal.org/en/internetbasics/"]]}]},{"t":"First real tasks","topics":[{"n":"Screenshots & screen recording basics","h":3,"s":["Learn the screenshot keys: Win+Shift+S (snip an area), PrtScn (whole screen), Win+PrtScn (saves automatically to Pictures).","Practise: snip a chart, a conversation, and an error message. Paste each into a document.","On phone: volume-down + power. Learn where screenshots are stored."],"m":"You capture and share exactly what is on screen, both on PC and phone, without photographing the monitor.","r":[["ShareX — screenshots & screen recording","https://getsharex.com/"]]},{"n":"Installing & uninstalling apps safely","h":4,"s":["Learn the safe sources: the app's official website, Microsoft Store, Play Store. Never from random WhatsApp links or pop-up ads.","Install a free app (e.g. 7-Zip), use it, then uninstall it via Settings → Apps.","Learn to spot a fake download button on a website — the real one never blinks or says 'Download Now! Fast!'."],"m":"You can install from an official source and completely uninstall, knowing why the source matters.","r":[["GCFGlobal — free computer tutorials","https://edu.gcfglobal.org/en/topics/computerbasics/"]]},{"n":"Settings: Wi-Fi, brightness, volume, time, wallpaper","h":3,"s":["Open Settings (Win+I) and explore: System, Network, Personalisation, Accounts, Time & Language.","Set your machine up your way: wallpaper, dark mode, correct time zone, do-not-disturb hours.","Connect and disconnect Wi-Fi deliberately, and know what the Wi-Fi icon's states mean."],"m":"You configure a new computer's basics yourself without help.","r":[["Windows Basics — GCFGlobal","https://edu.gcfglobal.org/en/windowsbasics/"]]},{"n":"Printing, scanning & photocopying","h":4,"s":["Connect a printer (USB or Wi-Fi) and print a test page. Learn paper size (A4), orientation, and duplex (both sides).","Print a PDF, then use 'Print to PDF' to save a document as PDF instead of wasting paper.","Scan a document to your computer or phone, and know when scanning beats photographing."],"m":"You can print, scan, and print-to-PDF correctly on any printer you meet.","r":[["Printers & scanning — GCFGlobal","https://edu.gcfglobal.org/en/printersandscanners/"]]},{"n":"When things go wrong: the 3-step fix routine","h":5,"s":["Step 1: read the error message out loud — it usually names the problem. Step 2: restart the app, then the computer. Step 3: search the exact message online.","Learn the big three fixes: restart, check the cable/power/Wi-Fi, close and reopen. They solve over half of all problems.","Practise on something harmless: unplug the mouse, notice nothing works, replug it, and note that the fix was that simple."],"m":"When something breaks you calmly run your routine instead of panicking or hitting the machine.","r":[["Basic troubleshooting — GCFGlobal","https://edu.gcfglobal.org/en/computerbasics/basic-troubleshooting/1/"]]},{"n":"Stage 0 checkpoint: you are no longer dangerous","h":3,"s":["Turn the computer on, log in, create a folder in Documents with your name, save a text file inside it, screenshot it, and shut down safely.","Without help: find a file saved last week, copy it to a pen drive, eject the drive, and print one page.","Explain to another person what RAM, storage and CPU do, using your own words."],"m":"You complete the whole checklist alone, in the right order, without googling anything.","r":[["Basic troubleshooting — GCFGlobal","https://edu.gcfglobal.org/en/computerbasics/basic-troubleshooting/1/"]]}]}]},{"id":1,"emo":"🌐","t":"Stage 1 · Internet, Email & Everyday Online","sub":"Browsing, searching, Gmail, cloud storage, UPI, government portals, safety","goal":"You use the internet for real life: search properly, write and manage email, store and share files in the cloud, pay and fill forms online, and spot scams before they cost you money. This stage alone changes your daily life.","mods":[{"t":"Browsers & search","topics":[{"n":"What the internet actually is","h":3,"s":["Understand the chain: websites live on servers → your ISP connects you → your browser asks for pages → they travel as data packets.","Learn the words: browser (Chrome/Edge/Safari), website, URL (address), tab, link, download vs upload.","Trace it once: type a URL, watch it load, and notice the padlock icon (HTTPS) that means the connection is encrypted."],"m":"You can explain browsing in plain words: server, ISP, browser, page, download/upload.","r":[["Internet Basics — GCFGlobal","https://edu.gcfglobal.org/en/internetbasics/"],["Cloudflare Learning Center — how the internet works","https://www.cloudflare.com/learning/"]]},{"n":"Browser basics: tabs, bookmarks, history, zoom","h":3,"s":["Master tabs: Ctrl+T new tab, Ctrl+W close, Ctrl+Shift+T restore a closed tab, Ctrl+Tab switch.","Bookmark your 8 most-used sites into a bookmarks bar; delete the rest. Use History (Ctrl+H) to find a page you forgot to save.","Learn zoom (Ctrl+ +/−), full screen (F11), and 'reopen closed tab' — the small joys of a comfortable browser."],"m":"You browse like a power user: many tabs under control, everything important bookmarked.","r":[["Internet Basics — GCFGlobal","https://edu.gcfglobal.org/en/internetbasics/"]]},{"n":"Google search that actually works","h":5,"s":["Search in plain questions, then add the app name: 'how to convert word to pdf windows'.","Use operators: \"exact phrase\" in quotes, minus to exclude a word, site:gov.in to search one site, filetype:pdf for documents.","Use AI assistants (ChatGPT/Gemini) for explanations and Google for facts, prices and local info — know which tool for which job."],"m":"You find the right answer in one or two searches, and you verify it with a second source.","r":[["Internet Basics — GCFGlobal","https://edu.gcfglobal.org/en/internetbasics/"],["Google Gemini","https://gemini.google.com/"]]},{"n":"Downloading safely: files, images, PDFs, apps","h":4,"s":["Download only from official sites. Learn to read a download page's traps: multiple 'Download' buttons, ads disguised as links.","After downloading, go to your Downloads folder and check the file name and extension before opening (.exe and .msi need extra care).","Scan a suspicious file with VirusTotal before opening it."],"m":"You download what you meant to download, from the right source, and you check before you click Open.","r":[["Internet Basics — GCFGlobal","https://edu.gcfglobal.org/en/internetbasics/"],["VirusTotal — scan files & links","https://www.virustotal.com/"]]},{"n":"Web forms, logins and cookies","h":3,"s":["Learn how accounts work: username + password + verification via email/phone.","Understand cookies: small files that remember you — accept only where needed; clear them in browser settings to log out everywhere.","Fill a real online form (a survey or signup) using autofill, and check every field before submitting."],"m":"You create accounts, log in/out safely, and use a form without leaving a trail you did not intend.","r":[["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]}]},{"t":"Email & messaging","topics":[{"n":"Email basics: address, inbox, compose, reply","h":5,"s":["Create/understand an address: name@gmail.com. Learn the anatomy of the Gmail screen: inbox, starred, sent, drafts, trash, spam.","Send yourself a test email with a subject and a short body. Then reply to it and forward it.","Learn the discipline: check email 2–3 times a day, not continuously; empty the inbox or archive it."],"m":"You can send, reply, forward and find any email, and you keep an inbox that does not drown you.","r":[["Email 101 — GCFGlobal","https://edu.gcfglobal.org/en/email101/"],["Gmail help","https://support.google.com/mail"]]},{"n":"Attachments: sending and receiving files by email","h":3,"s":["Attach a photo and a PDF to an email and send both. Learn the 25 MB limit.","For big files, use a Drive link instead of an attachment — practise sending one.","Open an attachment safely: check who sent it and whether you expected it before clicking."],"m":"You exchange documents by email and know exactly what to do when a file is too big.","r":[["Gmail help","https://support.google.com/mail"],["Google Drive help","https://support.google.com/drive"]]},{"n":"CC, BCC and email etiquette","h":2,"s":["Learn: To = act on this, CC = for information, BCC = hidden copy (used for groups so addresses stay private).","Write a professional email: clear subject, greeting, one-paragraph purpose, action request, sign-off.","Practise: send a formal email to a teacher or office using all of it."],"m":"You write short, polite, actionable emails and never reveal a group's addresses by mistake.","r":[["Gmail help","https://support.google.com/mail"]]},{"n":"WhatsApp Web, Telegram & video calls","h":4,"s":["Link WhatsApp Web/Desktop by scanning the QR code. Learn what stays on your phone (messages sync from the phone).","Use video calls (Meet/Zoom/WhatsApp) properly: test mic, camera, mute background noise, know screen-share.","Practise a real 5-minute video call and share your screen with someone."],"m":"You chat and meet online comfortably from both phone and computer.","r":[["Internet Basics — GCFGlobal","https://edu.gcfglobal.org/en/internetbasics/"],["Zoom support","https://support.zoom.us/"]]},{"n":"Email vs messaging vs SMS: choosing the right channel","h":2,"s":["Learn the rules of thumb: email = documents, records, formal; WhatsApp = quick, personal; SMS = OTPs and alerts only.","Set up notifications so work messages don't ping at midnight (Focus/Do Not Disturb).","Clean up: unsubscribe from 5 junk mailing lists."],"m":"You pick the right channel for each message type and keep notifications under your control.","r":[["Email 101 — GCFGlobal","https://edu.gcfglobal.org/en/email101/"]]}]},{"t":"Cloud storage & sharing","topics":[{"n":"Google Drive / OneDrive basics","h":5,"s":["Understand cloud storage: your files on someone else's computer (a server), reachable from anywhere, safe from a broken laptop.","Upload files, create folders, and organise logically: Documents / Photos / Study / Money.","Install the Drive for Desktop app so a folder on your PC syncs automatically."],"m":"You store and retrieve your files from any device, and your PC folder and the cloud stay in sync.","r":[["Google Drive help","https://support.google.com/drive"],["OneDrive help","https://support.microsoft.com/onedrive"]]},{"n":"Sharing files & links with permissions","h":4,"s":["Learn the three sharing levels: view only, comment, edit. Default to view.","Share a file, copy the link, open it in a private window to see what the other person sees.","Learn to stop sharing / set expiry. Never leave 'Anyone with the link' on sensitive documents."],"m":"You share exactly what you intend, with exactly who you intend, and you can un-share.","r":[["Google Drive help","https://support.google.com/drive"]]},{"n":"Google Docs & Sheets in the browser","h":4,"s":["Create a document in Docs from Drive; notice autosave and version history (File → Version history).","Type on your computer, open the same doc on your phone — same document, no transfer needed.","Make a simple sheet of monthly expenses in Google Sheets, on the cloud."],"m":"You work on documents from any device and never email files to yourself again.","r":[["Google Docs editors help","https://support.google.com/docs"],["Google Workspace Learning Center","https://support.google.com/a/users"]]},{"n":"Phone photos → cloud: backup your memories","h":4,"s":["Turn on Google Photos backup (or iCloud) once; understand free vs paid storage limits.","Sort: create albums for family, documents, screenshots; delete blurry repeats.","Do a real backup of a month of photos and free space on your phone afterwards."],"m":"Your photos exist in at least two places and you can find any of them by search.","r":[["Google Drive help","https://support.google.com/drive"]]}]},{"t":"India online: money, documents, government","topics":[{"n":"UPI and online payments safely","h":4,"s":["Learn how UPI works: your bank + your phone + a UPI ID. Money moves between bank accounts instantly, without card details.","Pay someone correctly: verify the name shown before paying, start with ₹1 test transfers to new payees.","Learn the golden rule of money apps: money goes OUT only when YOU send it. Entering a PIN always SENDS money — never 'receives'."],"m":"You send and receive UPI payments confidently, and you know that receiving money never requires your PIN.","r":[["NPCI — UPI safety & FAQ","https://www.npci.org.in/what-we-do/upi/product-overview"],["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"]]},{"n":"DigiLocker, Aadhaar & government portals","h":5,"s":["Create your DigiLocker account and store your Aadhaar, PAN, driving licence and 10th/12th marksheets.","Understand which government services exist online: income tax, passports, scholarships, certificates, UMANG.","Download one official document from DigiLocker and use it somewhere real (a form, a verification)."],"m":"Your key documents live in DigiLocker and you can produce any of them in 2 minutes.","r":[["DigiLocker — government documents","https://www.digilocker.gov.in/"],["UMANG — government services","https://web.umang.gov.in/"]]},{"n":"Online forms: tickets, jobs, colleges, applications","h":5,"s":["Learn the pattern of every online form: register → fill → upload documents → pay → download confirmation.","Practise with a real one (IRCTC account, a job portal profile, or a college application): nothing teaches faster.","Make a personal details file (name, DOB, address, education, bank, Aadhaar/PAN numbers) so you can copy-paste instead of hunting."],"m":"You complete a government or college application online without needing help.","r":[["DigiLocker — government documents","https://www.digilocker.gov.in/"]]},{"n":"e-Signatures, digital documents & printing to PDF","h":3,"s":["Learn what an e-signature is (Aadhaar e-Sign, or a scanned signature on a PDF) and when it is accepted.","Fill and sign a PDF on a phone: mark it up, sign, save, send.","Practise the full document loop: scan → PDF → sign → email."],"m":"You can legally sign and send a document from your phone in under five minutes.","r":[["PDF24 — free PDF tools","https://www.pdf24.org/"],["DigiLocker — government documents","https://www.digilocker.gov.in/"]]}]},{"t":"Staying safe online","topics":[{"n":"Passwords that actually work","h":4,"s":["Learn the rules: long beats complex, never reuse between important accounts, never birthdates or names.","Adopt a system: a phrase-based passphrase + a free password manager (Bitwarden) holding the rest.","Change your email password to a strong one TODAY — your email is the master key to everything."],"m":"Every important account has a unique, strong password, stored in a manager.","r":[["Bitwarden — free password manager","https://bitwarden.com/"],["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]},{"n":"Phishing, OTP fraud & scam calls","h":5,"s":["Learn the four families of scams: fake links (phishing), OTP requests, fake job/lottery offers, fake tech support calls.","Rules: never share an OTP; never install AnyDesk/TeamViewer on a caller's request; banks/HMRC/Amazon never ask for PINs; check the sender address, not the logo.","Study 3 real scam SMS/emails and name the giveaway in each."],"m":"You can spot a scam from the first line, and you never share an OTP with anyone, ever.","r":[["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"],["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]},{"n":"Online shopping: choosing sellers and paying wisely","h":3,"s":["Learn to check: seller rating, return policy, reviews with photos, and whether the price is 'too good'.","Prefer cash-on-delivery or UPI with verified names for new sellers; use cards with buyer protection for bigger purchases.","Keep proof: order screenshots, invoices, tracking. Know the complaint route."],"m":"You shop online without being tricked by fake sellers or fake discounts.","r":[["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]},{"n":"Privacy settings on your phone and browser","h":4,"s":["Go through app permissions and revoke what apps don't need (contacts, mic, location).","Turn off ad personalisation; check what Google/Meta know about you (myactivity.google.com).","Set up app lock / screen lock, and know what Find My Device does."],"m":"Every app on your phone only has permissions it truly needs, and you know what is shared about you.","r":[["EFF Surveillance Self-Defense","https://ssd.eff.org/"],["Internet Safety — GCFGlobal","https://edu.gcfglobal.org/en/internetsafety/"]]},{"n":"Stage 1 checkpoint: an online-capable adult","h":3,"s":["Send a formal email with a PDF attachment, from your own account.","Upload a folder to Drive and share one file with view-only permission.","Make a UPI payment, download a document from DigiLocker, and identify one scam message in your inbox."],"m":"All four tasks done alone, with no one guiding your clicks.","r":[["India Cyber Crime Portal (report fraud)","https://cybercrime.gov.in/"]]}]}]},{"id":2,"emo":"📝","t":"Stage 2 · Word Processing","sub":"Word & Google Docs: typing, formatting, tables, resumes, mail merge, PDF","goal":"You can produce any document people actually need: letters, resumes, reports, certificates — properly formatted, with tables and images, printed or as PDF. This is the single most used computer skill in the real world.","mods":[{"t":"Word basics & editing","topics":[{"n":"Which app: Word vs Google Docs vs LibreOffice vs Notepad","h":2,"s":["Understand the family: MS Word (paid, standard in offices), Google Docs (free, online, collaborative), LibreOffice Writer (free, offline), Notepad (plain text only).","Install LibreOffice or open Google Docs now — free tools are completely enough to learn on.","Learn what a .docx file is and why compatibility (.docx open everywhere) matters when you email it."],"m":"You know which tool to use for which document, and you can work in the free ones.","r":[["LibreOffice (free Office suite)","https://www.libreoffice.org/get-help/documentation/"],["Google Docs editors help","https://support.google.com/docs"]]},{"n":"Create, save, reopen and name documents","h":3,"s":["Create a document, type 3 lines, save with a clear name and a date (report-2026-10-budget.docx).","Learn the save triangle: Ctrl+S, Save As (a copy with a new name), and where the file went (Documents → your folder).","Reopen a saved file from inside Word's Recent list, then from File Explorer. Both routes matter."],"m":"You never lose a document and never save 'final', 'final2', 'final-FINAL' — your names carry dates and meaning.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"],["Microsoft 365 training centre","https://support.microsoft.com/training"]]},{"n":"Typing, editing and undo","h":3,"s":["Practise core editing: insert, delete (Backspace/Delete), select, drag-and-drop text, Ctrl+Z/Y undo/redo.","Type a paragraph with 6 deliberate mistakes, then fix them all using undo and retype.","Learn Show Formatting (¶) — the single most useful Word button nobody teaches."],"m":"You edit text quickly and you know why the paragraph mark (¶) reveals invisible formatting.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Fonts, sizes, bold, italic, underline, colour","h":2,"s":["Learn the font controls: family (Calibri/Times/Arial), size (body 11–12pt, headings bigger), B/I/U, colour, highlighter.","Rule of thumb: documents use 2 fonts maximum, and bold beats underline for emphasis.","Format a short announcement: title, body, emphasise two phrases — tastefully."],"m":"You produce clean-looking text without rainbow chaos, and you know professional defaults.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Cut, copy, paste and the Format Painter","h":3,"s":["Use Ctrl+X / C / V and right-click 'Paste options' (keep source / merge / text-only) consciously.","Learn Format Painter (the paintbrush): copy formatting from one part to another in two clicks.","Practise: format a heading once, then fast-format 8 more headings with Format Painter."],"m":"You format consistent documents fast, and you know which paste option keeps your formatting sane.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"],["Keyboard shortcut reference","https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"]]}]},{"t":"Paragraphs, styles & page setup","topics":[{"n":"Paragraphs: alignment, spacing, line spacing, indents","h":3,"s":["Learn left/centre/right/justify and when each is used (body text = left or justify; titles = centre).","Set space-after paragraphs instead of hitting Enter twice — the professional way to space text.","Set line spacing to 1.15 or 1.5 for anything long. Reformat a messy pasted paragraph correctly."],"m":"Your paragraphs space themselves properly and nothing depends on empty 'Enter' lines.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Bullets, numbering and multi-level lists","h":3,"s":["Create bullet lists and numbered lists, then nest them (Tab to indent a sub-list).","Fix the classic disaster: a numbered list continuing wrongly — right-click → Restart at 1.","Write a real procedure (how to back up a phone) as a 5-step numbered list with sub-bullets."],"m":"Your lists number themselves correctly and you can fix any list's numbering instantly.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Styles & headings (why they matter)","h":4,"s":["Apply Heading 1 / Heading 2 to titles instead of just making text bigger and bold.","See the payoff: Navigation pane to jump around, an automatic table of contents, and consistent looks.","Restyle a long document using only styles, then insert a Table of Contents (References → Table of Contents)."],"m":"You format by style, not by hand, and your documents get automatic content pages.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Page setup: margins, size, orientation","h":2,"s":["Set margins, A4 vs Letter, portrait vs landscape, and where those controls live (Layout tab).","Understand margin rule of thumb: 2.5 cm default; less margin = more content per page but tighter look.","Set up a landscape certificate page and a portrait letter page in one document using section breaks."],"m":"You control page geometry, and you know how to mix portrait and landscape in one file.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Headers, footers, page numbers","h":3,"s":["Add a header (document name) and footer (page number, date) — the mark of a professional document.","Learn 'Different first page' and how to start numbering from page 2.","Add page numbers to a 4-page document in the format 'Page X of Y'."],"m":"Every multi-page document you make is numbered and titled automatically.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Find, replace & spell-check properly","h":3,"s":["Use Ctrl+F and Ctrl+H — including regex-free tricks: replace double spaces with one, replace straight quotes with curly.","Run spelling & grammar check, but read every suggestion — autocorrect is not always right.","Clean a deliberately messy 1-page text with find/replace in under 3 minutes."],"m":"You clean up documents with find/replace instead of manual hunting.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]}]},{"t":"Beyond text: tables, images, shapes","topics":[{"n":"Tables: build, format, merge cells","h":4,"s":["Insert a table, add/delete rows & columns, merge cells for headings.","Format borders/shading and set column widths so everything fits A4.","Build a real table: monthly budget (Income / Expense / Balance) with a totals row."],"m":"You can build a clean, printable table and fix any row/column problem.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Inserting images, wrap text, captions","h":3,"s":["Insert a picture and learn the wrap options (In line, Square, Tight, Behind) — 'In line' behaves best.","Resize by corner handles (keeps proportions), add a caption, keep image quality high.","Make a 1-page poster or notice with a title, image and caption."],"m":"Images sit where you want them and never shove your paragraphs around.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Shapes, text boxes and smart layout","h":2,"s":["Insert shapes, lines and text boxes; align them with snapped guides.","Learn alignment tools (Align → Middle, Distribute) to line up several elements perfectly.","Build a simple 'certificate frame' layout using a rectangle border and a text box."],"m":"You assemble simple visual layouts (certificates, posters, letterheads) inside a document.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Spell check, word count, translate & accessibility","h":2,"s":["Use word count (for essays with limits) and the readability tool (Editor → Editor Score).","Learn how to make documents accessible: headings in order, alt text on images, real lists.","Add alt text to 3 images and check your heading order with the Navigation pane."],"m":"Your documents are clean, correctly counted, and usable by screen readers.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"],["Microsoft 365 training centre","https://support.microsoft.com/training"]]}]},{"t":"Real documents people need","topics":[{"n":"A formal letter (block format)","h":3,"s":["Learn the block format: sender, date, receiver, subject, salutation, body, closing, signature.","Write one: a leave application to a college/workplace with a clear subject line.","Set it on A4 with proper margins and print/PDF it."],"m":"You produce a correct formal letter from a blank page in under 15 minutes.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"]]},{"n":"Your resume / CV, done properly","h":6,"s":["Collect raw material: education, marks, skills, projects, experience, contact — everything, no formatting yet.","Lay it out: one page, reverse-chronological, action verbs, numbers where possible ('managed 40 students').","Design pass: consistent fonts, aligned dates, no photo needed for most jobs in India, export as PDF, filename YourName-Resume.pdf."],"m":"A stranger could pick your resume from a stack — clean, honest, one page, no typos.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"],["Canva Design School","https://www.canva.com/designschool/"]]},{"n":"Mail merge: personalised letters to many people","h":5,"s":["List the concept: one template + a data list (Excel/Sheets) = many personalised letters.","Build a small list (5 names with addresses) and merge: letters/envelopes/certificates.","Run a real merge producing 5 personalised invitation letters, each correct."],"m":"You generate 50 personalised letters in the time it used to take to type 3.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"],["Microsoft 365 training centre","https://support.microsoft.com/training"]]},{"n":"Track changes, comments & reviewing others' work","h":4,"s":["Turn on Track Changes, edit a document, and read the markup as a reviewer would.","Use comments (not highlighted text) for feedback; learn Accept/Reject.","Exchange a document with a partner: they edit with track changes, you review and accept."],"m":"You can review and merge edits on any document without losing anyone's work.","r":[["Word — GCFGlobal tutorials","https://edu.gcfglobal.org/en/word/"],["Google Docs editors help","https://support.google.com/docs"]]},{"n":"Convert to PDF & print like a pro","h":3,"s":["Save as PDF properly (File → Save as → PDF), and know why PDF is the format for sending final documents.","Learn print preview: page count, scaling, grayscale vs colour, duplex, which printer.","Take one document end-to-end: draft → PDF → printed page that looks exactly like the screen."],"m":"Your printed pages and PDFs look exactly as intended — no cut-off margins, ever.","r":[["PDF24 — free PDF tools","https://www.pdf24.org/"],["Printers & scanning — GCFGlobal","https://edu.gcfglobal.org/en/printersandscanners/"]]}]},{"t":"Stage 2 checkpoint","topics":[{"n":"Checkpoint: resume + letter + merge, all as PDFs","h":4,"s":["Produce: (1) a one-page resume, (2) a formal leave letter, (3) 5 mail-merged certificates — all formatted and exported as PDF.","Show a document with headings, a table, an image with caption, header/footer and page numbers.","Have someone check all three for typos, alignment and consistency. Fix everything they find."],"m":"Three professional documents, each one you would be comfortable sending to an employer.","r":[["Microsoft 365 training centre","https://support.microsoft.com/training"]]}]}]},{"id":3,"emo":"📊","t":"Stage 3 · Spreadsheets (Excel & Sheets)","sub":"The most employable computer skill: formulas, functions, charts, pivot tables, real workbooks","goal":"You can turn raw numbers into answers and money: keep accounts, track attendance, analyse sales, build dashboards. Half of all 'computer jobs' in India are really this skill. Take it slowly and do every exercise — this stage is worth more than the rest combined for most careers.","mods":[{"t":"Spreadsheet basics","topics":[{"n":"Rows, columns, cells and the grid","h":3,"s":["Understand the coordinate system: columns are letters (A, B, C), rows are numbers (1, 2, 3), so B7 is one exact cell.","Click cells and watch the Name Box (top-left) show the address. Type in a cell, press Enter, arrow around.","Learn the difference between a workbook (the file) and a sheet (one page inside it, the tabs at the bottom)."],"m":"You can point at any cell and say its address instantly, and use the Enter/Tab/arrow keys to move fast.","r":[["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Entering and editing data fast","h":4,"s":["Type a small table of 5 students with marks in 3 subjects. Use Tab to move right, Enter for the next row.","Learn to edit in place: double-click a cell or press F2. Escape cancels, Enter commits.","Practise selecting ranges: click-drag, Shift+click, Ctrl+click for scattered cells, Ctrl+A for everything."],"m":"You enter a 20-cell table without ever touching the mouse, and you know how to fix any cell.","r":[["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"]]},{"n":"Saving, and Sheets vs Excel vs LibreOffice Calc","h":2,"s":["Understand file formats: .xlsx (Excel, the standard), Google Sheets (cloud), .ods (LibreOffice), .csv (plain data).","Create the SAME small table in Google Sheets and in Excel; convert one to .csv and open the .csv in Notepad to see what .csv really is.","Learn autosave in Sheets vs Ctrl+S in Excel — know which one you are using."],"m":"You move a spreadsheet between Excel, Sheets and .csv without losing data.","r":[["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"],["Google Sheets help","https://support.google.com/docs/answer/6000292"]]},{"n":"Autofill, copy, paste & drag tricks","h":5,"s":["Drag the fill handle to copy a formula down; type Jan in a cell and drag to get Feb, Mar automatically.","Learn paste special: values only (Ctrl+Shift+V), transpose, multiply — the power tools.","Fill 12 months, 30 serial numbers and a multiplication table (10x10) using only drags."],"m":"You build grids of repetitive data in seconds, and you know when to paste values only.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["ExcelJet — formulas & functions","https://exceljet.net/"]]}]},{"t":"Formulas: the real skill","topics":[{"n":"Every formula starts with =","h":3,"s":["Type =1+1 in a cell and press Enter. That equals sign is the switch from 'text' to 'calculation'.","Learn order of operations (BODMAS) applies: =(2+3)*4 is 20, =2+3*4 is 14.","Build 8 playground formulas: add, subtract, multiply, divide, power (^), and combinations with brackets."],"m":"You can write any arithmetic spreadsheet formula, and you understand why the = matters.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Cell references: A1, $A$1, and dragging safely","h":5,"s":["Learn relative references: =A1+B1 copied down becomes =A2+B2. That is the magic of spreadsheets.","Learn the $ lock: $A$1 stays fixed when copied — used for tax rates, conversion factors, totals.","Build a price list with a single tax rate cell locked with $, and copy the formula down 10 rows."],"m":"You can predict what a formula becomes when dragged, and you lock the right parts with $.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["ExcelJet — formulas & functions","https://exceljet.net/"]]},{"n":"The core functions: SUM, AVERAGE, MIN, MAX, COUNT, COUNTA","h":6,"s":["Learn the six: SUM adds, AVERAGE means, MIN/MAX find extremes, COUNT counts numbers, COUNTA counts non-empty cells.","Apply them to a marks table: total, average, highest, lowest, how many students.","Learn Autosum (Σ button) and the Status Bar trick: select cells and just read the sum at the bottom."],"m":"You use the six core functions fluently and can get a sum without writing a formula when in a hurry.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"]]},{"n":"IF: making the sheet decide","h":6,"s":["Learn the shape: =IF(condition, value_if_true, value_if_false), e.g. =IF(B2>=40,\"Pass\",\"Fail\").","Learn text vs number results, and compare operators: =, <, >, <=, >=, <>.","Build a marksheet with Pass/Fail, a grade column (A/B/C) using nested IFs, and a 'distinction' flag."],"m":"You can make any sheet classify data automatically with IF, including nested IFs.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"ROUND, percentages, and everyday maths","h":4,"s":["Learn ROUND, ROUNDUP, ROUNDDOWN, and percentage maths: =B2*10/100 or =B2*0.1.","Compute GST: price + 18% and price including/excluding tax both ways.","Build a bill: 5 items, quantity, rate, amount, subtotal, GST, grand total — all calculated."],"m":"You calculate discounts, GST and totals correctly and know why rounding matters in money.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"]]}]},{"t":"Formatting that makes sheets readable","topics":[{"n":"Numbers, currency ₹, dates and decimals","h":4,"s":["Format numbers: comma separators for thousands, ₹ currency, 0 vs 2 decimals, and percentages (format, not multiply).","Format a date column properly (dd-mm-yyyy) and sort a date column to prove it behaves like a date, not text.","Formatting changes how it LOOKS; the value stays exact — prove it by seeing 2.5 display as 3 but still total correctly."],"m":"Your numbers read like a professional report, and dates sort correctly.","r":[["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"]]},{"n":"Conditional formatting: colour that means something","h":4,"s":["Learn the rules: colour a cell red if < 40, green if >= 75, data bars for scale, colour scales for heat.","Apply it to a marks table so weak students glow red automatically.","Learn custom formulas inside conditional formatting for whole-row highlighting."],"m":"Your sheets show problems and successes at a glance, without you scanning numbers.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Borders, colours, freeze panes, merge & wrap","h":3,"s":["Freeze the header row (View → Freeze Panes) so it stays visible while scrolling 500 rows.","Wrap text in a cell; merge cells only for titles (never for data — remember this rule).","Style a report: bold header with fill colour, frozen title row, gridlines off for printing."],"m":"You can make any sheet look clean and stay usable when it grows to hundreds of rows.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"]]}]},{"t":"Data handling","topics":[{"n":"Sorting and filtering","h":5,"s":["Sort a table by marks (largest first), then by two levels (class, then marks).","Use AutoFilter (Data → Filter) to show only Fail students, then only Class A students above 75.","Learn the danger: sorting one column alone breaks data. Always sort the whole table."],"m":"You can answer 'show me only…' questions in seconds with filters.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"]]},{"n":"Text functions: LEFT, RIGHT, MID, LEN, CONCAT, TRIM, UPPER","h":6,"s":["Learn what each does: LEFT/RIGHT grab ends of text, MID grabs from the middle, LEN counts characters, CONCAT joins, TRIM removes stray spaces, UPPER/LOWER change case.","Split a messy name column into first/last name using LEFT/RIGHT and FIND.","Fix 20 messy entries (extra spaces, mixed case) with TRIM and UPPER in one pass."],"m":"You can clean and split text data that others retype by hand.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"]]},{"n":"Date & time maths","h":4,"s":["Learn TODAY(), NOW(), and that dates are actually numbers underneath — subtract two dates to get days.","Compute age from a date of birth, days remaining until a deadline, and working days between dates (NETWORKDAYS).","Build an EMI due-date tracker that highlights overdue rows."],"m":"You handle dates, deadlines and age calculations without a single mistake.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"]]},{"n":"VLOOKUP & XLOOKUP: finding data across tables","h":6,"s":["Understand the job: 'given this ID, fetch that detail from another table'. =VLOOKUP(id, range, column_number, 0).","The four rules that make lookups work: unique key, key in the first column, exact match = 0/FALSE, locked range with $.","Build a student ID → name + marks lookup sheet pulling from a master list of 20 rows."],"m":"You can pull data from a master list three different ways, and you know why a lookup returns #N/A.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Data validation & drop-down lists","h":4,"s":["Create drop-downs (Data → Validation → List) for Class, Status, Payment mode — no more typos.","Add input messages and error alerts so wrong data cannot be entered.","Restrict a phone-number column to 10 digits and a marks column to 0–100."],"m":"Your sheets refuse bad data at entry time instead of needing cleaning later.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"]]},{"n":"Duplicates, blanks & cleaning real data","h":4,"s":["Use Remove Duplicates, Go To Special → Blanks, and find-replace to fix exported data.","Convert 'text that looks like numbers' back to real numbers (Text to Columns / VALUE).","Clean a deliberately messy 50-row export: duplicates gone, blanks handled, units consistent."],"m":"You can take ugly exported data and make it analysable in fifteen minutes.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"]]}]},{"t":"Charts & analysis","topics":[{"n":"Charts: which chart for which question","h":5,"s":["Learn the pairing: bar = compare categories, line = change over time, pie = parts of one whole (use rarely), scatter = relationship between two numbers.","Insert each of the four from the same data and note which one answers which question.","Build a marks-distribution bar chart and a monthly-sales line chart."],"m":"You choose the right chart instantly and never use a pie chart for 12 categories.","r":[["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Charts: making them look professional","h":4,"s":["Remove clutter: delete gridlines, redundant legends, and drop shadows. Add axis titles and units.","Format: clear title that states the finding ('Sales fell in June'), data labels where useful, consistent colours.","Rebuild a default ugly chart into a clean one and export it as an image for a report."],"m":"Your charts look like a newspaper's, not Excel's defaults.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"Pivot tables: summarise 10,000 rows in 60 seconds","h":7,"s":["Understand the idea: rows → categories down the side, columns → categories across, values → numbers summarised.","Build a pivot from a 100-row sales list: sales by city, then by city AND month, then with % of total.","Add slicers (buttons) so anyone can filter the summary without touching formulas."],"m":"You summarise any large list by any category in under a minute.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["ExcelJet — formulas & functions","https://exceljet.net/"]]},{"n":"IFS, SUMIF, COUNTIF, AVERAGEIF: conditional maths","h":6,"s":["Learn SUMIF/COUNTIF/AVERAGEIF: add or count only rows that match a condition ('total sales of Mumbai only').","Learn SUMIFS with multiple conditions (Mumbai AND June).","Build a class-wise and gender-wise summary from a student list with these functions."],"m":"You can total and count by any condition, which is half of all real reporting.","r":[["ExcelJet — formulas & functions","https://exceljet.net/"],["Excel Easy — free tutorials","https://www.excel-easy.com/"]]},{"n":"What-if, Goal Seek & scenarios","h":4,"s":["Use Goal Seek ('what marks do I need in the last exam to average 70?').","Build a simple scenario table: loan EMI at 8%, 9%, 10% interest side by side.","Answer three business questions with what-if: break-even, best price, biggest cost to cut."],"m":"You answer 'what if we change this?' questions with a working model, not a guess.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"]]}]},{"t":"Real workbooks (build these)","topics":[{"n":"Project 1: monthly budget & expense tracker","h":6,"s":["Columns: date, category, description, amount, payment mode. Add monthly totals by category with SUMIF.","Add a summary sheet: income vs expense vs savings, with a bar chart and a % saved KPI.","Fill it with your own real month — real data teaches ten times faster than dummy data."],"m":"A living budget you actually use, that updates itself as you add rows.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["Excel Basics — GCFGlobal","https://edu.gcfglobal.org/en/excel/"]]},{"n":"Project 2: invoice + attendance sheet","h":6,"s":["Build an invoice: your details, customer, 5 line items, quantity × rate, subtotal, GST, total in words.","Build a monthly attendance sheet: 31 day columns, P/A/H codes, and COUNTIF totals at the end of the row.","Auto-highlight anyone with more than 3 absences using conditional formatting."],"m":"Two documents a real small business would pay you to build.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["ExcelJet — formulas & functions","https://exceljet.net/"]]},{"n":"Project 3: a one-screen dashboard","h":7,"s":["Plan one screen answering: how much, how many, how is it trending, what is the best/worst.","Build it: 4 KPI cells (SUM/AVERAGE formulas), 2 charts, and a month slicer-driven pivot.","Design rules: consistent colours, no gridlines, one big number per KPI, everything labelled."],"m":"A dashboard that tells a manager the story of the data in 10 seconds.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"],["Microsoft Learn — Power BI","https://learn.microsoft.com/en-us/training/powerplatform/power-bi"]]},{"n":"Stage 3 checkpoint: marks + attendance system","h":5,"s":["Build a class tracker: 20 students, 4 subjects, totals, averages, percentages, grades (IF), rank (RANK), Pass/Fail, class topper.","Add a summary sheet: subject-wise toppers, class average, pass % — all with functions, no manual typing.","Add two charts and a printable report sheet. Then show it to someone who works in an office."],"m":"A working mini school-management system, built entirely by you, formulas only.","r":[["Excel Easy — free tutorials","https://www.excel-easy.com/"]]}]}]},{"id":4,"emo":"📽️","t":"Stage 4 · Presentations","sub":"PowerPoint, Google Slides & Canva: tell a story people actually watch","goal":"You can plan, design and deliver a presentation that makes people listen — for school, work, a job interview or a business pitch. You also stop making the classic death-by-slides mistakes.","mods":[{"t":"Presentation thinking","topics":[{"n":"Slides are not documents (the #1 mistake)","h":3,"s":["Rule: one idea per slide, max ~20 words, big visuals. If they are reading, you are redundant.","Learn the 'billboard' test: a slide should be understandable in 5 secon
